<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaSim v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04090F; color: #7EE8FA; font-family: 'Share Tech Mono', monospace; font-size: 13px; }

    /* === 3-column layout: left | centre | right === */
    #layout { display: flex; width: 100%; height: 100vh; }

    /* --- Left panel: species palette + brush --- */
    #left-panel {
      width: 168px; min-width: 168px; max-width: 168px;
      background: #04090F; border-right: 1px solid #0C2D40;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #left-panel h1 {
      font-family: 'Orbitron', monospace; color: #00E5FF; letter-spacing: 2px;
      font-size: 1.1rem; text-align: center; padding: 10px 8px 8px;
    }

    #user-bar {
      display: flex; align-items: center; gap: 4px; padding: 4px 8px;
      font-size: 0.65rem; color: #4A7A8A; border-bottom: 1px solid #0C2D40;
    }
    #user-bar button {
      background: none; border: 1px solid #0C2D40; color: #7EE8FA; border-radius: 3px;
      padding: 1px 6px; cursor: pointer; font-family: inherit; font-size: 0.6rem;
    }
    #user-bar button:hover { background: #0C2D40; }

    #species-info { color: #4A7A8A; font-size: 0.7rem; min-height: 14px; padding: 2px 8px; }

    #palette-list {
      display: flex; flex-direction: column; gap: 1px; flex: 1;
      overflow-y: auto; padding: 0 4px;
    }
    #palette-list::-webkit-scrollbar { width: 4px; }
    #palette-list::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 2px; }

    .tier-label { color: #4A7A8A; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; margin: 4px 0 1px; padding-left: 4px; }
    .sp-btn {
      display: flex; align-items: center; gap: 6px; width: 100%;
      background: transparent; border: 1px solid transparent; color: #7EE8FA;
      padding: 2px 6px; cursor: pointer; font-family: inherit; font-size: 11px;
      border-radius: 2px; text-align: left;
    }
    .sp-btn:hover { background: #0C2D40; }
    .sp-btn.active { border-color: #00E5FF; background: #0D2438; }
    .sp-btn.disaster { color: #FF6B6B; }
    .sp-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    #heatmap-bar { padding: 6px 6px 4px; border-top: 1px solid #0C2D40; flex-shrink: 0; }
    #heatmap-bar select, #scenario-bar select {
      width: 100%; background: #0A1622; border: 1px solid #0C2D40; color: #7EE8FA;
      padding: 3px 6px; font-family: inherit; font-size: 11px; border-radius: 3px;
    }
    #scenario-bar { padding: 0 6px 4px; flex-shrink: 0; }

    /* --- Centre column: canvas + bottom bar --- */
    #centre {
      display: flex; flex-direction: column; flex: 1; overflow: hidden;
    }

    #canvas-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #060E16;
    }
    #canvas-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
    #canvas-wrap::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 3px; }
    #grid-canvas { image-rendering: pixelated; }

    #bottom-bar {
      height: 44px; min-height: 44px;
      display: flex; align-items: center; padding: 0 8px; gap: 5px;
      background: #04090F; border-top: 1px solid #0C2D40;
    }
    #bottom-bar button, #bottom-bar select {
      font-family: 'Share Tech Mono', monospace; font-size: 0.65rem;
      padding: 4px 9px; border: 1px solid #0C2D40; background: #0A1622; color: #7EE8FA;
      cursor: pointer; border-radius: 3px; white-space: nowrap;
    }
    #bottom-bar button:hover { background: #1B3A4B; }
    #bottom-bar select { padding: 3px 6px; }
    #bottom-bar label { display: flex; align-items: center; gap: 3px; font-size: 0.65rem; color: #4A7A8A; white-space: nowrap; }
    #bottom-bar input[type="checkbox"] { accent-color: #00E5FF; }
    .bar-divider { width: 1px; height: 20px; background: #0C2D40; margin: 0 2px; flex-shrink: 0; }
    .bar-spacer { flex: 1; }
    #season-display { color: #88FF88; font-size: 0.7rem; white-space: nowrap; }
    #gen-counter { color: #00E5FF; font-size: 0.7rem; white-space: nowrap; }

    .btn-evo { color: #DDBB44 !important; border-color: #DDBB44 !important; }
    .btn-danger { color: #FF6B6B !important; }

    /* --- Right panel: stats + biodiversity + evo log --- */
    #right-panel {
      width: 200px; min-width: 200px; max-width: 200px;
      background: #04090F; border-left: 1px solid #0C2D40;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #right-panel h2 {
      font-family: 'Orbitron', monospace; font-size: 0.6rem; letter-spacing: 1px;
      padding: 8px 10px 6px; flex-shrink: 0;
    }
    .rp-heading-pop { color: #00E5FF; }
    .rp-heading-evo { color: #DDBB44; }

    #bio-score {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 4px 10px 6px; border-bottom: 1px solid #0C2D40; flex-shrink: 0;
    }
    #bio-score-label { color: #4A7A8A; font-size: 0.5rem; font-family: 'Orbitron', monospace; letter-spacing: 1px; }
    #bio-score-value { font-size: 0.85rem; font-weight: bold; color: #00FF88; }

    #stats-list { flex: 1; overflow-y: auto; padding: 0 8px; }
    #stats-list::-webkit-scrollbar { width: 4px; }
    #stats-list::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 2px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; cursor: pointer; border-radius: 2px; }
    .stat-row:hover { background: rgba(0,229,255,0.06); }
    .stat-name { font-size: 0.7rem; opacity: 0.85; }
    .stat-count { font-size: 0.7rem; color: #00E5FF; min-width: 36px; text-align: right; }

    #pop-graph-wrap { flex-shrink: 0; padding: 2px 4px 4px; border-top: 1px solid #0C2D40; }
    #pop-graph { display: block; width: 100%; height: 80px; }

    #evo-log {
      padding: 0 8px 8px; overflow-y: auto; min-height: 60px;
      height: 200px; flex-shrink: 0; border-top: 1px solid #0C2D40;
    }
    #evo-log::-webkit-scrollbar { width: 4px; }
    #evo-log::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 2px; }
    #evo-entries { font-size: 0.6rem; color: #DDBB44; opacity: 0.9; }
    .evo-entry { padding: 1px 0; border-bottom: 1px solid #0A1622; }

    /* --- Overlays --- */
    .overlay-hidden { display: none !important; }
    #phylo-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 900;
      display: flex; align-items: center; justify-content: center;
    }
    #phylo-panel {
      background: #0A1520; border: 1px solid #1A3A4B; border-radius: 8px;
      width: 85vw; height: 80vh; display: flex; flex-direction: column;
    }
    #phylo-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; border-bottom: 1px solid #1A3A4B;
      font-family: 'Orbitron', monospace; color: #00E5FF; letter-spacing: 1px; font-size: 0.9rem;
    }
    #phylo-header button {
      background: none; border: none; color: #4A7A8A; font-size: 1.5rem; cursor: pointer;
    }
    #phylo-header button:hover { color: #FF6B6B; }
    #phylo-canvas { flex: 1; width: 100%; cursor: grab; }
    #phylo-canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

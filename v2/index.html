<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaSim v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04090F; color: #7EE8FA; font-family: 'Share Tech Mono', monospace; font-size: 13px; }

    #layout { display: flex; width: 100%; height: 100vh; }

    #sidebar {
      width: 340px; min-width: 340px;
      display: flex; flex-direction: column;
      background: #0A1520; border-right: 1px solid #1A3040;
      overflow-y: auto; padding: 10px;
    }
    #sidebar::-webkit-scrollbar { width: 5px; }
    #sidebar::-webkit-scrollbar-thumb { background: #1A3040; border-radius: 3px; }

    #title-bar { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    #title { font-family: 'Orbitron', monospace; color: #00E5FF; letter-spacing: 2px; font-size: 1.2rem; }
    #gen-counter { color: #4A7A8A; font-size: 0.85rem; }
    #season-display { color: #88FF88; font-size: 0.85rem; }

    #controls, #tools { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    #controls button, #tools button, #controls select {
      background: #0D1B2A; border: 1px solid #1B3A4B; color: #7EE8FA;
      padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 12px; border-radius: 3px;
    }
    #controls button:hover, #tools button:hover { background: #1B3A4B; }
    #controls label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #4A7A8A; }
    #controls input[type="checkbox"] { accent-color: #00E5FF; }

    .info-bar { color: #4A7A8A; font-size: 0.75rem; min-height: 18px; margin-bottom: 6px; }

    #palette-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
    .tier-label { color: #4A7A8A; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin: 4px 0 2px; }
    .sp-btn {
      display: flex; align-items: center; gap: 6px; width: 100%;
      background: #0A1520; border: 1px solid transparent; color: #7EE8FA;
      padding: 3px 8px; cursor: pointer; font-family: inherit; font-size: 12px;
      border-radius: 2px; text-align: left;
    }
    .sp-btn:hover { background: #1B3A4B; }
    .sp-btn.active { border-color: #00E5FF; background: #0D2438; }
    .sp-btn.disaster { color: #FF6B6B; }
    .sp-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    #bio-score { color: #4A7A8A; font-size: 0.8rem; margin: 6px 0; }
    #bio-score-value { font-weight: bold; }

    #pop-graph-wrap { width: 100%; height: 80px; margin-bottom: 6px; }
    #pop-graph { width: 100%; height: 80px; display: block; }

    #stats-list { display: flex; flex-direction: column; gap: 1px; margin-bottom: 8px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; cursor: pointer; border-radius: 2px; }
    .stat-row:hover { background: #0D2438; }
    .stat-name { font-size: 0.8rem; }
    .stat-count { font-size: 0.8rem; color: #4A7A8A; min-width: 40px; text-align: right; }

    #evo-log { flex: 1; min-height: 60px; }
    #evo-entries { font-size: 0.7rem; color: #4A7A8A; }
    .evo-entry { padding: 1px 0; border-bottom: 1px solid #0D1B2A; }

    #canvas-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #020610;
    }
    #grid-canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

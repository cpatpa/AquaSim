        let bred = false;
        for (let dist = 1; dist <= maxDist && !bred; dist++) {
          for (let d = 0; d < 4; d++) {
            const dir = CARDINAL[dirs[d]];
            const nx = wrapX(cx + dir[0] * dist);
            const ny = wrapY(cy + dir[1] * dist);
            const ni = ny * cw + nx;
            // Coral can grow on rock (colonizes reef substrate)
            if (species[ni] === 0 || (sid === 12 && species[ni] === 1)) {
              species[ni] = sid; hunger[ni] = 0; age[ni] = 0;
              processed[ni] = 1;
              bred = true;
              break;
            }
          }
        }
      }
      continue;
    }

    // Animal behaviour (herbivore, consumer, apex, megafauna, decomposer)
    if (!sp.hungerMax) continue;
    const es = evo(sid);
    const traits = es.traits || [];
    const hasTrait = (t) => traits.indexOf(t) !== -1;
    const restoreFrac = HUNGER_RESTORE_BY_TIER[sp.tier] || HUNGER_RESTORE_FRACTION;

    // Seasonal adaptation check
    const isColdAdapt = hasTrait('coldadapt');
    const isWarmAdapt = hasTrait('warmadapt');
    const isMigratory = hasTrait('migratory');
    let seasonHungerMult = sMod[1];
    let seasonBreedMult = sMod[0];
    let seasonMoveMult = sMod[2];
    if (isColdAdapt && (currentSeason === 'Winter' || currentSeason === 'Autumn')) {
      seasonHungerMult = 1.0; seasonBreedMult = 1.0; seasonMoveMult = 1.0;
    }
    if (isWarmAdapt && (currentSeason === 'Summer' || currentSeason === 'Spring')) {
      seasonBreedMult = 1.4; seasonHungerMult = 0.85;
    }
    if (isMigratory) seasonMoveMult = Math.min(1.5, seasonMoveMult * 1.3);
    // Nocturnal: +40% in cold seasons, -20% in warm
    if (hasTrait('nocturnal')) {
      if (currentSeason === 'Winter' || currentSeason === 'Autumn') {
        seasonBreedMult *= 1.4; seasonMoveMult *= 1.4;
      } else {
        seasonBreedMult *= 0.8; seasonMoveMult *= 0.8;
      }
    }
    // Diurnal: +40% in warm seasons, -20% in cold
    if (hasTrait('diurnal')) {
      if (currentSeason === 'Summer' || currentSeason === 'Spring') {
        seasonBreedMult *= 1.4; seasonMoveMult *= 1.4;
      } else {
        seasonBreedMult *= 0.8; seasonMoveMult *= 0.8;
      }
    }

    // 1. Increment hunger (metabolic scaling + seasonal modifier)
    const metab = METABOLISM[sp.tier] || 1.0;
    const hungerChance = metab * seasonHungerMult;
    if (Math.random() < hungerChance) hunger[idx]++;

    // Symbiosis: heal hunger if adjacent to a producer
    if (hasTrait('symbiosis') && hunger[idx] > 2) {
      for (let n = 0; n < 4; n++) {
        const dir = CARDINAL[n];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ns = species[ny * cw + nx];
        const nsp = SPECIES[ns];
        if (nsp && nsp.tier === 'producer') {
          hunger[idx] = Math.max(0, hunger[idx] - 2);
          break;
        }
      }
    }

    // Regeneration: heal 1 hunger every 3 ticks
    if (hasTrait('regen') && age[idx] % 3 === 0 && hunger[idx] > 0) {
      hunger[idx]--;
    }

    // Photosynthetic: herbivore slowly restores hunger in open water
    if (hasTrait('photosyn') && hunger[idx] > 0 && age[idx] % 4 === 0) {
      // Only works if no rock adjacent (open water)
      let hasRock = false;
      for (let n = 0; n < 4; n++) {
        const dir = CARDINAL[n];
        if (species[wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0])] === 1) { hasRock = true; break; }
      }
      if (!hasRock) hunger[idx]--;
    }

    // Parasitic: steal 2 hunger from adjacent non-same species
    if (hasTrait('parasite') && hunger[idx] > 3) {
      for (let n = 0; n < 4; n++) {
        const dir = CARDINAL[n];
        const pnx = wrapX(cx + dir[0]), pny = wrapY(cy + dir[1]);
        const pni = pny * cw + pnx;
        const pSid = species[pni];
        if (pSid > 0 && pSid !== sid && SPECIES[pSid] && SPECIES[pSid].hungerMax) {
          hunger[idx] = Math.max(0, hunger[idx] - 2);
          hunger[pni] = Math.min(hunger[pni] + 2, (evoStats[pSid] || {}).hungerMax || 30);
          break;
        }
      }
    }

    // Filter Feeder: passively feeds from any producer within 2 tiles
    if (hasTrait('filterfeeder') && hunger[idx] > 2 && Math.random() < 0.3) {
      for (let fdy = -2; fdy <= 2; fdy++) {
        let fed = false;
        for (let fdx = -2; fdx <= 2; fdx++) {
          if (fdx === 0 && fdy === 0) continue;
          const fni = wrapY(cy + fdy) * cw + wrapX(cx + fdx);
          const fsp = SPECIES[species[fni]];
          if (fsp && fsp.tier === 'producer') {
            hunger[idx] = Math.max(0, hunger[idx] - 2);
            fed = true; break;
          }
        }
        if (fed) break;
      }
    }

    // Colonial: average hunger with adjacent same-species (once per 2 ticks)
    if (hasTrait('colonial') && age[idx] % 2 === 0) {
      let totalH = hunger[idx], cnt = 1;
      for (let n = 0; n < 8; n++) {
        const dir = NEIGHBOURS_8[n];
        const cni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
        if (species[cni] === sid) { totalH += hunger[cni]; cnt++; }
      }
      if (cnt > 1) {
        const avg = (totalH / cnt) | 0;
        hunger[idx] = avg;
        for (let n = 0; n < 8; n++) {
          const dir = NEIGHBOURS_8[n];
          const cni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
          if (species[cni] === sid) hunger[cni] = avg;
        }
      }
    }

    // Biofilm: damage reduction tracked via biofilm flag (used during predation checks)

    // 2. Starvation check
    if (hunger[idx] >= es.hungerMax) {
      species[idx] = 3; hunger[idx] = 0; age[idx] = 0; // become Dead
      continue;
    }

    // 3. Eat: scan neighbours for food (layer-aware)
    // Apex/megafauna scan 2-tile radius; others scan 8 immediate neighbours
    const eats = es.eats;
    let ate = false;
    const huntRange = (sp.tier === 'apex' || sp.tier === 'megafauna') ? 2 : 1;
    const isPackHunter = hasTrait('packhunter');
    const isTrapJaw = hasTrait('trapjaw');
    const isVenomous = hasTrait('venomous');
    let trapJawUsed = false; // trap jaw only works once per tick

    if (eats && eats.length) {
      // Build randomized scan list
      const scanCells = [];
      for (let dy = -huntRange; dy <= huntRange; dy++) {
        for (let dx = -huntRange; dx <= huntRange; dx++) {
          if (dx === 0 && dy === 0) continue;
          scanCells.push([dx, dy]);
        }
      }
      shuffleSmall(scanCells);

      // Pack hunter: count allies near self
      let packAllyCount = 0;
      if (isPackHunter) {
        for (let pn = 0; pn < 8; pn++) {
          const pdir = NEIGHBOURS_8[pn];
          const pni = wrapY(cy + pdir[1]) * cw + wrapX(cx + pdir[0]);
          if (species[pni] === sid) packAllyCount++;
        }
      }
      const packActive = isPackHunter && packAllyCount >= 2;

      for (let n = 0; n < scanCells.length; n++) {
        const [dx, dy] = scanCells[n];
        const nx = wrapX(cx + dx);
        const ny = wrapY(cy + dy);
        const ni = ny * cw + nx;
        const foodId = species[ni];
        if (eats.indexOf(foodId) !== -1 && layersCanReach(sid, layerOf(foodId))) {
          const preyEs = evo(foodId);
          const preyTraits = preyEs.traits || [];

          // Trap Jaw: first attack ignores ALL prey defenses
          if (isTrapJaw && !trapJawUsed) {
            trapJawUsed = true;
            // Skip all defensive checks — instant kill
          } else {
            // Mimicry: 45% chance predator avoids this prey
            if (preyTraits.indexOf('mimicry') !== -1 && !packActive && Math.random() < 0.45) continue;
            // Camouflage: prey has 40% chance to evade (pack hunters ignore)
            if (preyTraits.indexOf('camouflage') !== -1 && !packActive && Math.random() < 0.4) continue;
            // Pod Defense: 50% miss if 2+ same species nearby (pack hunters ignore)
            if (preyTraits.indexOf('poddefense') !== -1 && !packActive) {
              let podCount = 0;
              for (let pn = 0; pn < 8; pn++) {
                const pdir = NEIGHBOURS_8[pn];
                const pni = wrapY(ny + pdir[1]) * cw + wrapX(nx + pdir[0]);
                if (species[pni] === foodId) podCount++;
              }
              if (podCount >= 2 && Math.random() < 0.5) continue;
            }
            // Gigantism: 30% miss chance
            if (preyTraits.indexOf('gigantism') !== -1 && Math.random() < 0.3) continue;
            // Ink Cloud: 50% dodge + teleport 2 tiles
            if (preyTraits.indexOf('inkcloud') !== -1 && Math.random() < 0.5) {
              // Teleport prey 2 tiles in random direction
              const tDir = CARDINAL[(Math.random() * 4) | 0];
              const tnx = wrapX(nx + tDir[0] * 2), tny = wrapY(ny + tDir[1] * 2);
              const tni = tny * cw + tnx;
              if (species[tni] === 0) {
                species[tni] = foodId; hunger[tni] = hunger[ni]; age[tni] = age[ni];
                species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
                processed[tni] = 1;
              }
              continue;
            }
            // Biofilm: 35% damage reduction when 3+ same species adjacent
            if (preyTraits.indexOf('biofilm') !== -1) {
              let bfCount = 0;
              for (let bn = 0; bn < 8; bn++) {
                const bdir = NEIGHBOURS_8[bn];
                if (species[wrapY(ny + bdir[1]) * cw + wrapX(nx + bdir[0])] === foodId) bfCount++;
              }
              if (bfCount >= 3 && Math.random() < 0.35) continue;
            }
          }

          // Toxic: predator takes hunger damage
          if (preyTraits.indexOf('toxic') !== -1) {
            hunger[idx] += 4;
          }
          // Thorns: predator takes heavy hunger penalty
          if (preyTraits.indexOf('thorns') !== -1) {
            hunger[idx] += 7;
          }
          // Venomous predator: extra damage to prey's neighbors (area denial)
          if (isVenomous) {
            for (let vn = 0; vn < 4; vn++) {
              const vdir = CARDINAL[vn];
              const vni = wrapY(ny + vdir[1]) * cw + wrapX(nx + vdir[0]);
              const vSid = species[vni];
              if (vSid === foodId && SPECIES[vSid] && SPECIES[vSid].hungerMax) {
                hunger[vni] = Math.min(hunger[vni] + 3, (evoStats[vSid] || {}).hungerMax || 30);
              }
            }
          }
          // Deep Root: producer has 35% chance to survive being eaten
          if (preyTraits.indexOf('deeproot') !== -1 && Math.random() < 0.35) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true;
            break;
          }
          // Armored: animal has 30% chance to survive being eaten
          if (preyTraits.indexOf('armored') !== -1 && Math.random() < 0.3) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true;
            break;
          }
          // Rapid Regrowth: when eaten, spreads to up to 2 adjacent empty tiles
          if (preyTraits.indexOf('regrowth') !== -1) {
            let rg = 0;
            for (let rd = 0; rd < 4 && rg < 2; rd++) {
              const rdir = CARDINAL[rd];
              const rx = wrapX(nx + rdir[0]), ry = wrapY(ny + rdir[1]);
              const ri = ry * cw + rx;
              if (species[ri] === 0) {
                species[ri] = foodId; hunger[ri] = 0; age[ri] = 0;
                processed[ri] = 1; rg++;
              }
            }
          }
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Softshell / Dwarfism: same-tier species can eat neighbours with softshell or dwarfism
    if (!ate && sp.hungerMax) {
      const nbrs2 = shuffleSmall([0,1,2,3,4,5,6,7]);
      for (let n = 0; n < 8 && !ate; n++) {
        const dir = NEIGHBOURS_8[nbrs2[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        const nSid = species[ni];
        if (nSid === 0 || nSid === sid) continue;
        const nSp = SPECIES[nSid];
        if (!nSp || !nSp.hungerMax) continue;
        const nEs = evo(nSid);
        const nTraits = nEs.traits || [];
        const vulnerable = nTraits.indexOf('softshell') !== -1 || nTraits.indexOf('dwarfism') !== -1;
        if (vulnerable && nSp.tier === sp.tier && layersCanReach(sid, nSp.layer)) {
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac) | 0));
          processed[ni] = 1;
          ate = true;
        }
      }
    }

    // Bulk Feeder: megafauna eats up to 3 prey in one tick
    if (ate && hasTrait('bulkfeeder') && eats && eats.length) {
      let extraEats = 0;
      const nbrs3 = shuffleSmall([0,1,2,3,4,5,6,7]);
      for (let n = 0; n < 8 && extraEats < 2; n++) {
        const dir = NEIGHBOURS_8[nbrs3[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (eats.indexOf(species[ni]) !== -1 && layersCanReach(sid, layerOf(species[ni]))) {
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * 0.3) | 0));
          processed[ni] = 1;
          extraEats++;
        }
      }
    }

    // Lithivore: if didn't eat normally, try eating adjacent rock
    if (!ate && hasTrait('lithivore')) {
      const rdirs = shuffleSmall([0,1,2,3]);
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[rdirs[d]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (species[ni] === 1) { // Rock
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * 0.5) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Scavenger: if didn't eat normally, eat adjacent dead matter
    if (!ate && hasTrait('scavenger')) {
      const sdirs = shuffleSmall([0,1,2,3,4,5,6,7]);
      for (let d = 0; d < 8; d++) {
        const dir = NEIGHBOURS_8[sdirs[d]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (species[ni] === 3) { // Dead
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * 0.6) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Ambush: if didn't eat normally, check 2-tile range on cardinal axes
    if (!ate && hasTrait('ambush') && eats && eats.length) {
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[d];
        const nx = wrapX(cx + dir[0] * 2);
        const ny = wrapY(cy + dir[1] * 2);
        const ni = ny * cw + nx;
        const foodId = species[ni];
        if (eats.indexOf(foodId) !== -1 && layersCanReach(sid, layerOf(foodId))) {
          const preyEs = evo(foodId);
          const aPT = preyEs.traits || [];
          if (aPT.indexOf('mimicry') !== -1 && Math.random() < 0.45) continue;
          if (aPT.indexOf('camouflage') !== -1 && Math.random() < 0.4) continue;
          if (aPT.indexOf('gigantism') !== -1 && Math.random() < 0.3) continue;
          if (aPT.indexOf('inkcloud') !== -1 && Math.random() < 0.5) {
            const tDir2 = CARDINAL[(Math.random() * 4) | 0];
            const tnx2 = wrapX(nx + tDir2[0] * 2), tny2 = wrapY(ny + tDir2[1] * 2);
            const tni2 = tny2 * cw + tnx2;
            if (species[tni2] === 0) {
              species[tni2] = foodId; hunger[tni2] = hunger[ni]; age[tni2] = age[ni];
              species[ni] = 0; hunger[ni] = 0; age[ni] = 0; processed[tni2] = 1;
            }
            continue;
          }
          if (aPT.indexOf('toxic') !== -1) hunger[idx] += 4;
          if (aPT.indexOf('thorns') !== -1) hunger[idx] += 7;
          if (aPT.indexOf('deeproot') !== -1 && Math.random() < 0.35) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true; break;
          }
          if (aPT.indexOf('armored') !== -1 && Math.random() < 0.3) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true; break;
          }
          if (aPT.indexOf('regrowth') !== -1) {
            let rg = 0;
            for (let rd = 0; rd < 4 && rg < 2; rd++) {
              const rdir = CARDINAL[rd];
              const rx = wrapX(nx + rdir[0]), ry = wrapY(ny + rdir[1]);
              const ri = ry * cw + rx;
              if (species[ri] === 0) { species[ri] = foodId; hunger[ri] = 0; age[ri] = 0; processed[ri] = 1; rg++; }
            }
          }
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Bioluminescent: attract prey within 3 tiles toward self
    if (hasTrait('bioluminesc') && eats && eats.length && Math.random() < 0.3) {
      for (let dy = -3; dy <= 3; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
          if (dx === 0 && dy === 0) continue;
          if (dx * dx + dy * dy > 9) continue;
          const px = wrapX(cx + dx);
          const py = wrapY(cy + dy);
          const pi = py * cw + px;
          if (eats.indexOf(species[pi]) !== -1 && !processed[pi] && layersCanReach(sid, layerOf(species[pi]))) {
            // Move prey one step closer to this predator
            const stepX = dx > 0 ? -1 : dx < 0 ? 1 : 0;
            const stepY = dy > 0 ? -1 : dy < 0 ? 1 : 0;
            const tnx = wrapX(px + stepX);
            const tny = wrapY(py + stepY);
            const tni = tny * cw + tnx;
            if (species[tni] === 0) {
              species[tni] = species[pi]; hunger[tni] = hunger[pi]; age[tni] = age[pi];
              species[pi] = 0; hunger[pi] = 0; age[pi] = 0;
              processed[tni] = 1;
            }
            break;
          }
        }
      }
    }

    // 4. Current sweep — if standing on a current, get pushed in its direction
    const curDir = currents[idx];
    if (curDir) {
      const cd = CARDINAL[curDir - 1];
      const sx = wrapX(cx + cd[0]);
      const sy = wrapY(cy + cd[1]);
      const si = sy * cw + sx;
      if (species[si] === 0) {
        species[si] = sid; hunger[si] = hunger[idx]; age[si] = age[idx];
        species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
        processed[si] = 1;
        continue; // swept — skip voluntary movement
      }
    }

    // 5. Movement (with seasonal modifier)
    const effectiveMoveRate = Math.min(0.98, es.moveRate * seasonMoveMult);
    if (Math.random() < effectiveMoveRate) {
      let moved = false;

      // Echolocation: directed movement toward nearest prey within 4 tiles
      if (!moved && hasTrait('echoloc') && eats && eats.length) {
        let bestDist = 999, bestDx = 0, bestDy = 0;
        for (let dy = -4; dy <= 4; dy++) {
          for (let dx = -4; dx <= 4; dx++) {
            if (dx === 0 && dy === 0) continue;
            const dist = dx * dx + dy * dy;
            if (dist > 16 || dist >= bestDist) continue;
            const px = wrapX(cx + dx), py = wrapY(cy + dy);
            const echoSid = species[py * cw + px];
            if (eats.indexOf(echoSid) !== -1 && layersCanReach(sid, layerOf(echoSid))) {
              bestDist = dist; bestDx = dx; bestDy = dy;
            }
          }
        }
        if (bestDist < 999) {
          const stepX = bestDx > 0 ? 1 : bestDx < 0 ? -1 : 0;
          const stepY = bestDy > 0 ? 1 : bestDy < 0 ? -1 : 0;
          const tnx = wrapX(cx + stepX), tny = wrapY(cy + stepY);
          const tni = tny * cw + tnx;
          if (species[tni] === 0) {
            species[tni] = sid; hunger[tni] = hunger[idx]; age[tni] = age[idx];
            species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
            processed[tni] = 1; moved = true;
          }
        }
      }

      // Stalker: move 2 tiles toward nearest prey (within 3 tiles)
      if (!moved && hasTrait('stalker') && eats && eats.length) {
        let bestDist = 999, bestDx = 0, bestDy = 0;
        for (let dy = -3; dy <= 3; dy++) {
          for (let dx = -3; dx <= 3; dx++) {
            if (dx === 0 && dy === 0) continue;
            const dist = dx * dx + dy * dy;
            if (dist > 9 || dist >= bestDist) continue;
            const px = wrapX(cx + dx), py = wrapY(cy + dy);
            const stSid = species[py * cw + px];
            if (eats.indexOf(stSid) !== -1 && layersCanReach(sid, layerOf(stSid))) {
              bestDist = dist; bestDx = dx; bestDy = dy;
            }
          }
        }
        if (bestDist < 999) {
          const s1x = bestDx > 0 ? 1 : bestDx < 0 ? -1 : 0;
          const s1y = bestDy > 0 ? 1 : bestDy < 0 ? -1 : 0;
          // First step
          const m1x = wrapX(cx + s1x), m1y = wrapY(cy + s1y);
          const m1i = m1y * cw + m1x;
          if (species[m1i] === 0) {
            // Second step
            const m2x = wrapX(m1x + s1x), m2y = wrapY(m1y + s1y);
            const m2i = m2y * cw + m2x;
            const dest = (species[m2i] === 0) ? m2i : m1i;
            species[dest] = sid; hunger[dest] = hunger[idx]; age[dest] = age[idx];
            species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
            processed[dest] = 1; moved = true;
          }
        }
      }

      if (!moved) {
        const dirs = shuffleSmall([0,1,2,3]);
        for (let d = 0; d < 4; d++) {
          const dir = CARDINAL[dirs[d]];
          let nx = wrapX(cx + dir[0]);
          let ny = wrapY(cy + dir[1]);
          let ni = ny * cw + nx;
          const targetSid = species[ni];

          if (targetSid === 0) {
            species[ni] = sid; hunger[ni] = hunger[idx]; age[ni] = age[idx];
            species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
            processed[ni] = 1;
            break;
          }
        }
      }
    }

    // 6. Breed (with seasonal modifier)
    // Schooling: boost breed rate if 3+ same species adjacent
    let breedRate = es.breedRate * seasonBreedMult;
    let sameAdjacentCount = 0;
    for (let n = 0; n < 8; n++) {
      const dir = NEIGHBOURS_8[n];
      const ni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
      if (species[ni] === sid) sameAdjacentCount++;
    }
    if (hasTrait('schooling') && sameAdjacentCount >= 3) breedRate *= 1.5;

    // Territorial: kill adjacent same-species when crowded, breed faster when alone
    if (hasTrait('territorial')) {
      if (sameAdjacentCount >= 4 && Math.random() < 0.3) {
        // Too crowded — kill a random neighbor of same species
        const tNbrs = shuffleSmall([0,1,2,3,4,5,6,7]);
        for (let tn = 0; tn < 8; tn++) {
          const tdir = NEIGHBOURS_8[tNbrs[tn]];
          const tni = wrapY(cy + tdir[1]) * cw + wrapX(cx + tdir[0]);
          if (species[tni] === sid) {
            species[tni] = 3; hunger[tni] = 0; age[tni] = 0; // becomes dead
            processed[tni] = 1;
            break;
          }
        }
      } else if (sameAdjacentCount <= 1) {
        breedRate *= 1.6; // alone — breed faster to claim territory
      }
    }

    if (Math.random() < breedRate) {
      const nbrs = shuffleSmall([0,1,2,3,4,5,6,7]);
      for (let n = 0; n < 8; n++) {
        const dir = NEIGHBOURS_8[nbrs[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (species[ni] === 0) {
          species[ni] = sid;
          // Maternal: offspring start well-fed
          hunger[ni] = hasTrait('maternal') ? 0 : Math.min(hunger[idx], ((es.hungerMax * 0.3) | 0));
          age[ni] = 0;
          processed[ni] = 1;
          break;
        }
      }
    }

    // 7. Competitive displacement: evolved species can outcompete parent/ancestor
    if (sp.parentId !== undefined && evolveEnabled && Math.random() < 0.06) {
      const parentId = sp.parentId;
      const rootId = sp.rootAncestor || parentId;
      const nbrs4 = shuffleSmall([0,1,2,3,4,5,6,7]);
      for (let n = 0; n < 8; n++) {
        const dir = NEIGHBOURS_8[nbrs4[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        const nSid = species[ni];
        // Can displace parent or any ancestor in same lineage
        if (nSid === parentId || nSid === rootId) {
          // Fitness check: only displace if we're healthier
          if (hunger[idx] < hunger[ni] || (hunger[ni] > es.hungerMax * 0.5)) {
            species[ni] = sid; hunger[ni] = 0; age[ni] = 0;
            processed[ni] = 1;
            break;
          }
        }
      }
    }
  }

  generation++;

  // Evolution: record population snapshots periodically
  if (evolveEnabled && generation % POP_SNAPSHOT_INTERVAL === 0) {
    recordPopSnapshot();
  }

  // Evolution: random trigger with cooldown
  if (evolveEnabled) {
    if (evoCooldown > 0) {
      evoCooldown--;
    } else if (popHistory.length >= 3 && Math.random() < EVO_CHANCE_PER_GEN) {
      evolve();
      speciate();
      nicheShift();
      lastEvoGen = generation;
      evoCooldown = EVO_COOLDOWN_MIN + ((Math.random() * (EVO_COOLDOWN_MAX - EVO_COOLDOWN_MIN)) | 0);
    }

    // Extinction cleanup: free slots for extinct evolved species
    if (generation % 50 === 0 && popHistory.length >= 2) {
      const now = popHistory[popHistory.length - 1];
      const prev = popHistory.length >= 2 ? popHistory[popHistory.length - 2] : {};
      for (let di = dynamicSpeciesIds.length - 1; di >= 0; di--) {
        const did = dynamicSpeciesIds[di];
        if ((now[did] || 0) === 0 && (prev[did] || 0) === 0) {
          // Species is extinct — clean up
          delete SPECIES[did];
          delete COLOR_RGB[did];
          delete evoStats[did];
          const li = LIVING_IDS.indexOf(did);
          if (li !== -1) LIVING_IDS.splice(li, 1);
          dynamicSpeciesIds.splice(di, 1);
          const evoTier = TIER_ORDER.find(t => t.label === 'EVOLVED');
          if (evoTier) {
            const ti = evoTier.ids.indexOf(did);
            if (ti !== -1) evoTier.ids.splice(ti, 1);
          }
          // Remove from all species' eats lists
          for (const oid of LIVING_IDS) {
            if (evoStats[oid] && evoStats[oid].eats) {
              const ei = evoStats[oid].eats.indexOf(did);
              if (ei !== -1) evoStats[oid].eats.splice(ei, 1);
            }
          }
          addEvoEvent(did + ' went extinct — slot freed');
        }
      }
    }
  }
}

function tick() {
  step();
  render();
  updateStats();
}

function startLoop() {
  stopLoop();
  if (running) {
    tickTimer = setInterval(tick, tickInterval);
  }
}

function stopLoop() {
  if (tickTimer !== null) { clearInterval(tickTimer); tickTimer = null; }
}

// 5. STATS
// ============================================================
const statsEl = document.getElementById('stats-list');
const genEl = document.getElementById('gen-counter');

function updateStats() {
  genEl.textContent = 'GEN ' + generation;
  const seasonEl = document.getElementById('season-display');
  if (seasonEl) {
    const progress = ((seasonTick / SEASON_LENGTH) * 100) | 0;
    seasonEl.textContent = currentSeason + ' ' + progress + '%';
    seasonEl.style.color = SEASON_COLORS[currentSeason] || '#7EE8FA';
  }
  const counts = {};
  const total = gridW * gridH;
  for (let i = 0; i < total; i++) {
    const s = species[i];
    if (s !== 0) counts[s] = (counts[s] || 0) + 1;
    if (currents[i]) counts[2] = (counts[2] || 0) + 1;
  }
  let html = '';
  for (const tier of TIER_ORDER) {
    for (const id of tier.ids) {
      if (id === 0) continue;
      const c = counts[id] || 0;
      if (c > 0 || (SPECIES[id].tier !== 'transient' && !SPECIES[id].parentId)) {
        html += '<div class="stat-row" data-sid="' + id + '"><span class="stat-name" style="color:' +
          SPECIES[id].color + '">' + SPECIES[id].name +
          '</span><span class="stat-count">' + c + '</span></div>';
      }
    }
  }
  // Show transient counts
  if (counts[3]) {
    html += '<div class="stat-row" data-sid="3"><span class="stat-name" style="color:#1C1410">Dead</span><span class="stat-count">' + counts[3] + '</span></div>';
  }
  if (counts[4]) {
    html += '<div class="stat-row" data-sid="4"><span class="stat-name" style="color:#2A1800">Oil</span><span class="stat-count">' + counts[4] + '</span></div>';
  }
  statsEl.innerHTML = html;

  // Re-attach highlight listeners on stat rows
  statsEl.querySelectorAll('.stat-row[data-sid]').forEach(row => {
    row.addEventListener('mouseenter', function() {
      highlightSpecies = parseInt(this.dataset.sid);
      render();
    });
    row.addEventListener('mouseleave', function() {
      highlightSpecies = -1;
      render();
    });
  });

  // Update evolution log
  const evoEl = document.getElementById('evo-entries');
  if (evolveEnabled && evoLog.length > 0) {
    evoEl.innerHTML = evoLog.map(e => '<div class="evo-entry">' + e + '</div>').join('');
  } else if (!evolveEnabled) {
    evoEl.innerHTML = '<div class="evo-entry" style="opacity:0.4;">EVO OFF</div>';
  } else {
    evoEl.innerHTML = '<div class="evo-entry" style="opacity:0.4;">Waiting...</div>';
  }
}

// ============================================================
// 7. PAINTING — mouse + touch
// ============================================================
let painting = false;
let lastPaintX = -1, lastPaintY = -1; // for drag-direction currents
let currentDir = 2; // default direction: E (1=N, 2=E, 3=S, 4=W)

function dragDirection(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  if (dx === 0 && dy === 0) return 0; // no movement
  if (Math.abs(dx) >= Math.abs(dy)) {
    return dx > 0 ? 2 : 4; // E or W
  } else {
    return dy > 0 ? 3 : 1; // S or N
  }
}

function triggerDisaster(canvasX, canvasY) {
  const cellX = (canvasX / CELL_SIZE) | 0;
  const cellY = (canvasY / CELL_SIZE) | 0;
  // Disasters use a larger radius (brush × 2, min 5)
  const r = Math.max(5, brushSize * 2) - 1;
  const r2 = r * r + r;

  if (selectedType === -1) {
    // BOMB — obliterate everything in radius
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
        currents[idx] = 0;
      }
    }
  } else if (selectedType === -2) {
    // OIL SPILL — place Oil cells
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        if (species[idx] !== 1) { // don't overwrite rock
          species[idx] = 4; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
  } else if (selectedType === -3) {
    // HEATWAVE — kill all animals, leave plants and environment
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        const sp = SPECIES[sid];
        if (sp && sp.hungerMax) {
          // It's an animal — kill it
          species[idx] = 3; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
  } else if (selectedType === -4) {
    // RED TIDE — flood with phytoplankton, suffocate animals
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        if (sid === 1) continue; // don't overwrite rock
        const sp = SPECIES[sid];
        if (sp && sp.hungerMax) {
          // Animal — suffocate: becomes dead
          species[idx] = 3; hunger[idx] = 0; age[idx] = 0;
        } else if (sid === 0 || sid === 3) {
          // Empty or dead — fill with phytoplankton
          species[idx] = 10; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
  }
  render();
  updateStats();
}

function paintAt(canvasX, canvasY) {
  const cellX = (canvasX / CELL_SIZE) | 0;
  const cellY = (canvasY / CELL_SIZE) | 0;

  // Update drag direction for currents
  if (selectedType === 2 && lastPaintX >= 0) {
    const dir = dragDirection(lastPaintX, lastPaintY, canvasX, canvasY);
    if (dir !== 0) currentDir = dir;
  }
  lastPaintX = canvasX;
  lastPaintY = canvasY;

  const r = brushSize - 1;
  const r2 = r * r + r; // circular approximation
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r2) continue;
      const x = wrapX(cellX + dx);
      const y = wrapY(cellY + dy);
      const idx = y * gridW + x;
      if (selectedType === 2) {
        // Current overlay with direction from drag
        currents[idx] = currentDir;
      } else {
        species[idx] = selectedType;
        hunger[idx] = 0;
        age[idx] = 0;
        // Erase also clears current overlay
        if (selectedType === 0) currents[idx] = 0;
      }
    }
  }
  render();
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  return [x, y];
}

canvas.addEventListener('mousedown', function(e) {
  painting = true;
  lastPaintX = -1; lastPaintY = -1;
  const [x, y] = getCanvasCoords(e);
  if (selectedType < 0) { triggerDisaster(x, y); }
  else { paintAt(x, y); }
});
canvas.addEventListener('mousemove', function(e) {
  if (!painting || selectedType < 0) return;
  const [x, y] = getCanvasCoords(e);
  paintAt(x, y);
});
window.addEventListener('mouseup', function() { painting = false; });

// Touch support
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  painting = true;
  lastPaintX = -1; lastPaintY = -1;
  const touch = e.touches[0];
  const [x, y] = getCanvasCoords(touch);
  if (selectedType < 0) { triggerDisaster(x, y); }
  else { paintAt(x, y); }
}, { passive: false });
canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!painting || selectedType < 0) return;
  const touch = e.touches[0];
  const [x, y] = getCanvasCoords(touch);
  paintAt(x, y);
}, { passive: false });
canvas.addEventListener('touchend', function() { painting = false; });

// 7b. CELL TOOLTIP — mouseover species info
// ============================================================
const tooltip = document.getElementById('cell-tooltip');
let tooltipVisible = false;

canvas.addEventListener('mousemove', function(e) {
  if (painting) {
    if (tooltipVisible) { tooltip.style.display = 'none'; tooltipVisible = false; }
    return;
  }
  const [px, py] = getCanvasCoords(e);
  const cellX = (px / CELL_SIZE) | 0;
  const cellY = (py / CELL_SIZE) | 0;
  if (cellX < 0 || cellX >= gridW || cellY < 0 || cellY >= gridH) {
    tooltip.style.display = 'none'; tooltipVisible = false;
    return;
  }
  const idx = cellY * gridW + cellX;
  const sid = species[idx];
  const curDir = currents[idx];

  if (sid === 0 && !curDir) {
    tooltip.style.display = 'none'; tooltipVisible = false;
    return;
  }

  const sp = SPECIES[sid];
  let html = '<div class="tt-name" style="color:' + (sp ? sp.color : '#7EE8FA') + '">' + (sp ? sp.name : 'Empty') + '</div>';

  if (curDir) {
    const dirNames = ['', 'North', 'East', 'South', 'West'];
    html += '<div class="tt-stat">Current: ' + dirNames[curDir] + '</div>';
  }

  if (sp && sp.tier && sp.tier !== 'none' && sp.tier !== 'transient' && sp.tier !== 'environment') {
    const layerName = sp.layer >= 0 && sp.layer < LAYER_NAMES.length ? LAYER_NAMES[sp.layer] : 'All';
    html += '<div class="tt-stat">Tier: ' + sp.tier + ' | Layer: <span style="color:' + (LAYER_COLORS[sp.layer] || '#7EE8FA') + '">' + layerName + '</span></div>';
    if (sp.hungerMax) {
      const es = evo(sid);
      html += '<div class="tt-stat">Hunger: ' + hunger[idx] + '/' + es.hungerMax + '</div>';
      html += '<div class="tt-stat">Speed: ' + (es.moveRate * 100).toFixed(0) + '% | Breed: ' + (es.breedRate * 100).toFixed(1) + '%</div>';
      if (es.eats && es.eats.length) {
        const foodNames = es.eats.map(fid => SPECIES[fid] ? SPECIES[fid].name : '?').join(', ');
        html += '<div class="tt-stat">Eats: ' + foodNames + '</div>';
      }
      // Show traits
      if (es.traits && es.traits.length > 0) {
        const traitStr = es.traits.map(t => TRAITS[t] ? TRAITS[t].icon + ' ' + TRAITS[t].name : t).join(', ');
        html += '<div class="tt-trait">Traits: ' + traitStr + '</div>';
      }
    } else if (sp.breedRate) {
      const es = evo(sid);
      html += '<div class="tt-stat">Breed: ' + (es.breedRate * 100).toFixed(1) + '%</div>';
      if (es.traits && es.traits.length > 0) {
        const traitStr = es.traits.map(t => TRAITS[t] ? TRAITS[t].icon + ' ' + TRAITS[t].name : t).join(', ');
        html += '<div class="tt-trait">Traits: ' + traitStr + '</div>';
      }
    }
    if (sp.parentId !== undefined) {
      let lineage = 'Evolved from ' + (SPECIES[sp.parentId] ? SPECIES[sp.parentId].name : '?');
      if (sp.lineageDepth > 1) lineage += ' (branch depth ' + sp.lineageDepth + ')';
      html += '<div class="tt-stat" style="color:#DDBB44;">' + lineage + '</div>';
    }
  }
  if (sp && sp.desc) {
    html += '<div class="tt-stat" style="opacity:0.6;margin-top:2px;">' + sp.desc + '</div>';
  }

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  tooltipVisible = true;
  // Position near mouse
  const tx = e.clientX + 12;
  const ty = e.clientY + 12;
  tooltip.style.left = Math.min(tx, window.innerWidth - 210) + 'px';
  tooltip.style.top = Math.min(ty, window.innerHeight - 120) + 'px';
});

canvas.addEventListener('mouseleave', function() {
  tooltip.style.display = 'none';
  tooltipVisible = false;
});

// ============================================================
// 7d. EVOLUTION TREE POPUP (click on organism)
// ============================================================
(function() {
  const popup = document.getElementById('evo-tree-popup');
  const content = document.getElementById('etp-content');
  const closeBtn = document.getElementById('etp-close-btn');

  closeBtn.addEventListener('click', function() { popup.style.display = 'none'; });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') popup.style.display = 'none';
  });

  // Build lineage: walk from root ancestor down to the clicked species
  function getLineageTree(sid) {
    const sp = SPECIES[sid];
    if (!sp) return [];

    // Find root ancestor
    let rootId = sid;
    const visited = new Set();
    while (SPECIES[rootId] && SPECIES[rootId].parentId !== undefined && !visited.has(rootId)) {
      visited.add(rootId);
      rootId = SPECIES[rootId].parentId;
    }

    // BFS from root to collect full tree
    const tree = [];
    const queue = [{ id: rootId, depth: 0 }];
    const seen = new Set();
    while (queue.length > 0) {
      const { id, depth } = queue.shift();
      if (seen.has(id)) continue;
      seen.add(id);
      tree.push({ id, depth });

      // Find children of this species
      const allIds = LIVING_IDS.concat(dynamicSpeciesIds);
      for (const cid of allIds) {
        if (SPECIES[cid] && SPECIES[cid].parentId === id && !seen.has(cid)) {
          queue.push({ id: cid, depth: depth + 1 });
        }
      }
    }
    return tree;
  }

  canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (!evolveEnabled) return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const cs = CELL_SIZE;
    const cx = (mx / cs) | 0;
    const cy = (my / cs) | 0;
    if (cx < 0 || cx >= gridW || cy < 0 || cy >= gridH) return;

    const idx = cy * gridW + cx;
    const sid = species[idx];
    if (sid === 0 || sid === 1 || sid === 2) return; // ignore empty/rock/current

    const sp = SPECIES[sid];
    if (!sp || sp.breedRate === undefined) return; // not a living species

    const tree = getLineageTree(sid);
    if (tree.length === 0) return;

    let html = '';
    for (const node of tree) {
      const nsp = SPECIES[node.id];
      if (!nsp) continue;
      const es = evo(node.id);
      const isCurrent = node.id === sid;
      const indent = node.depth > 0 ? '<span class="etp-branch">' + '│ '.repeat(node.depth - 1) + '├─ </span>' : '';
      const swatch = '<span class="etp-swatch" style="background:' + nsp.color + ';"></span>';
      html += '<div class="etp-node' + (isCurrent ? ' etp-current' : '') + '">';
      html += indent + swatch + ' ' + nsp.name;
      html += '</div>';
      // Stats line
      if (es.hungerMax) {
        html += '<div class="etp-stats">' + indent.replace(/[├─│]/g, ' ');
        html += 'Spd:' + ((es.moveRate||0) * 100).toFixed(0) + '% Brd:' + ((es.breedRate||0) * 100).toFixed(1) + '% Hgr:' + es.hungerMax;
        html += '</div>';
      } else if (es.breedRate) {
        html += '<div class="etp-stats">' + indent.replace(/[├─│]/g, ' ');
        html += 'Brd:' + ((es.breedRate||0) * 100).toFixed(1) + '%';
        html += '</div>';
      }
      // Traits line
      if (es.traits && es.traits.length > 0) {
        const traitStr = es.traits.map(function(t) { return TRAITS[t] ? TRAITS[t].icon + ' ' + TRAITS[t].name : t; }).join(', ');
        html += '<div class="etp-traits">' + indent.replace(/[├─│]/g, ' ') + traitStr + '</div>';
      }
    }

    content.innerHTML = html;
    popup.style.display = 'block';

    // Position near click
    const px = Math.min(e.clientX + 10, window.innerWidth - 350);
    const py = Math.min(e.clientY + 10, window.innerHeight - 300);
    popup.style.left = Math.max(0, px) + 'px';
    popup.style.top = Math.max(0, py) + 'px';
  });

  // Close when clicking outside the popup
  document.addEventListener('mousedown', function(e) {
    if (popup.style.display === 'block' && !popup.contains(e.target)) {
      popup.style.display = 'none';
    }
  });
})();

// ============================================================
// 8. SEED
// ============================================================
function seedGrid() {
  const total = gridW * gridH;
  // Fair distribution: every species gets represented, pyramid-shaped
  const targets = [
    // Environment
    [1,  0.020],  // Rock

    // Producers — large base
    [10, 0.085],  // Phytoplankton
    [11, 0.025],  // Seaweed
    [12, 0.008],  // Coral

    // Herbivores — moderate
    [20, 0.014],  // Shrimp
    [21, 0.006],  // Snail
    [22, 0.006],  // Crab
    [23, 0.003],  // Sea Urchin

    // Consumers — smaller
    [30, 0.005],  // Small Fish
    [31, 0.003],  // Squid
    [32, 0.002],  // Pufferfish

    // Apex — small but viable
    [40, 0.002],  // Shark
    [41, 0.002],  // Octopus

    // Megafauna — rare but viable
    [42, 0.001],  // Whale
    [43, 0.0015], // Dolphin

    // Decomposers
    [50, 0.007],  // Bacteria
    [51, 0.003],  // Sea Worm
  ];
  for (const [sid, frac] of targets) {
    let count = Math.max(2, (total * frac) | 0); // at least 2 of each
    let attempts = 0;
    while (count > 0 && attempts < total * 2) {
      const idx = (Math.random() * total) | 0;
      if (species[idx] === 0) {
        species[idx] = sid;
        hunger[idx] = 0;
        age[idx] = 0;
        count--;
      }
      attempts++;
    }
  }
  // Reset season to Spring on new seed
  currentSeason = 'Spring';
  seasonTick = 0;
}

function seedBalanced() {
  const total = gridW * gridH;
  const cw = gridW, ch = gridH;

  // --- Rock reef structures (natural-looking clusters) ---
  const rockBudget = (total * 0.03) | 0;
  let rockCount = 0;
  const numReefs = 6 + ((Math.random() * 6) | 0);
  for (let r = 0; r < numReefs && rockCount < rockBudget; r++) {
    let rx = (Math.random() * cw) | 0;
    let ry = (Math.random() * ch) | 0;
    const size = 8 + ((Math.random() * 20) | 0);
    for (let s = 0; s < size && rockCount < rockBudget; s++) {
      const idx = ry * cw + rx;
      if (species[idx] === 0) {
        species[idx] = 1; rockCount++;
      }
      // Random walk to create organic shapes
      rx = wrapX(rx + ((Math.random() * 3) | 0) - 1);
      ry = wrapY(ry + ((Math.random() * 3) | 0) - 1);
    }
  }

  // --- Coral patches near reefs ---
  for (let i = 0; i < total; i++) {
    if (species[i] !== 1) continue;
    const cx = i % cw, cy = (i / cw) | 0;
    for (const [dx, dy] of NEIGHBOURS_8) {
      const ni = wrapY(cy + dy) * cw + wrapX(cx + dx);
      if (species[ni] === 0 && Math.random() < 0.15) {
        species[ni] = 12; // Coral grows near rocks
      }
    }
  }

  // --- Current channels (2-3 flowing streams) ---
  const numStreams = 2 + ((Math.random() * 2) | 0);
  for (let s = 0; s < numStreams; s++) {
    let sx = (Math.random() * cw) | 0;
    let sy = (Math.random() * ch) | 0;
    const dir = 1 + ((Math.random() * 4) | 0); // 1-4
    const cd = CARDINAL[dir - 1];
    const len = 20 + ((Math.random() * 40) | 0);
    for (let step = 0; step < len; step++) {
      // Paint a 2-wide current line
      for (let w = -1; w <= 1; w++) {
        const px = wrapX(sx + (cd[1] !== 0 ? w : 0));
        const py = wrapY(sy + (cd[0] !== 0 ? w : 0));
        currents[py * cw + px] = dir;
      }
      sx = wrapX(sx + cd[0]);
      sy = wrapY(sy + cd[1]);
      // Slight drift for natural look
      if (Math.random() < 0.15) {
        sx = wrapX(sx + ((Math.random() * 3) | 0) - 1);
        sy = wrapY(sy + ((Math.random() * 3) | 0) - 1);
      }
    }
  }

  // --- Trophic pyramid: tuned ratios for long-term stability ---
  // Large producer base, diminishing up the food chain
  const balanced = [
    // Producers — wide base
    [10, 0.100],  // Phytoplankton  (foundation)
    [11, 0.030],  // Seaweed
    // (Coral already placed near reefs above)

    // Herbivores — ~1/4 of producer biomass
    [20, 0.016],  // Shrimp  (eats phyto → needs plenty)
    [21, 0.006],  // Snail   (eats seaweed)
    [22, 0.006],  // Crab    (omnivore)
    [23, 0.003],  // Sea Urchin (eats coral — keep scarce)

    // Consumers — ~1/4 of herbivore biomass
    [30, 0.005],  // Small Fish (eats shrimp)
    [31, 0.003],  // Squid      (eats shrimp, snails)
    [32, 0.002],  // Pufferfish (eats crabs, snails)

    // Apex — small but viable
    [40, 0.002],  // Shark   (eats consumers)
    [41, 0.002],  // Octopus (eats consumers)

    // Megafauna — rare but viable
    [42, 0.001],  // Whale   (filter feeder)
    [43, 0.0015], // Dolphin (social hunter)

    // Decomposers — enough to handle death spiral
    [50, 0.008],  // Bacteria
    [51, 0.004],  // Sea Worm
  ];

  for (const [sid, frac] of balanced) {
    let count = Math.max(2, (total * frac) | 0);
    let attempts = 0;
    while (count > 0 && attempts < total * 2) {
      const idx = (Math.random() * total) | 0;
      if (species[idx] === 0) {
        species[idx] = sid;
        hunger[idx] = 0;
        age[idx] = 0;
        count--;
      }
      attempts++;
    }
  }
  // Reset season on balanced seed
  currentSeason = 'Spring';
  seasonTick = 0;
}

// Detailed biome environment seed — rich terrain + balanced ecosystem
function seedBiome() {
  const total = gridW * gridH;
  const cw = gridW, ch = gridH;
  const seed = (Math.random() * 2147483647) | 0;
  noiseSeed(seed);

  // Noise helper: sample at (x,y) with given scale
  const N = (x, y, scale) => noise2D(x / scale, y / scale);
  const F = (x, y, scale, oct) => fbm(x / scale, y / scale, oct || 5, 2.0, 0.5);

  // ====================================================================
  // 1. SEAFLOOR TOPOLOGY — noise-driven rock formations
  // ====================================================================
  // Base terrain heightmap: large-scale geological features
  const rockThresh = 0.32; // higher = less rock
  const ridgeScale = cw * 0.22; // scale of major ridges
  const detailScale = cw * 0.06; // fine rock detail

  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      // Multi-octave terrain: broad ridges + fine detail
      const broad = F(x, y, ridgeScale, 4);
      const detail = F(x + 500, y + 500, detailScale, 3) * 0.4;
      // Edge affinity: rocks more likely near top/bottom (seafloor walls)
      const edgeDist = Math.min(y, ch - 1 - y) / (ch * 0.12);
      const edgeBias = Math.max(0, 1.0 - edgeDist) * 0.45;
      const h = broad + detail + edgeBias;
      if (h > rockThresh) {
        // Probability falls off smoothly above threshold — organic edges
        const p = Math.min(1.0, (h - rockThresh) * 3.0);
        if (Math.random() < p) species[y * cw + x] = 1; // Rock
      }
    }
  }

  // Reef formations: 1-3 reef ridges using warped noise
  const numReefs = 1 + ((Math.random() * 2.5) | 0);
  for (let r = 0; r < numReefs; r++) {
    const ry0 = ch * (0.25 + Math.random() * 0.5);
    const reefAmp = ch * (0.06 + Math.random() * 0.08);
    const reefFreq = 0.02 + Math.random() * 0.03;
    const reefThick = 2 + ((Math.random() * 4) | 0);
    const offsetX = Math.random() * 1000;
    for (let x = 0; x < cw; x++) {
      // Meandering reef centerline using noise
      const centerY = ry0 + reefAmp * noise2D((x + offsetX) * reefFreq, r * 7.7);
      for (let dy = -reefThick; dy <= reefThick; dy++) {
        const wy = wrapY(Math.round(centerY + dy));
        const idx = wy * cw + x;
        // Gaps for passages and caves
        if (Math.random() < 0.12) continue;
        if (species[idx] === 0) species[idx] = 1;
      }
    }
  }

  // ====================================================================
  // 2. OCEAN CURRENTS — meandering rivers + natural gyres
  // ====================================================================
  // Flowing current streams that meander via noise displacement
  const numStreams = 4 + ((Math.random() * 4) | 0);
  for (let s = 0; s < numStreams; s++) {
    // Pick a primary flow direction and entry point
    const horizontal = Math.random() < 0.6;
    let cx0, cy0, mainDir;
    if (horizontal) {
      cx0 = 0;
      cy0 = (ch * (0.1 + Math.random() * 0.8)) | 0;
      mainDir = Math.random() < 0.5 ? 2 : 4; // E or W
    } else {
      cx0 = (cw * (0.1 + Math.random() * 0.8)) | 0;
      cy0 = 0;
      mainDir = Math.random() < 0.5 ? 3 : 1; // S or N
    }
    const cd = CARDINAL[mainDir - 1];
    const len = Math.max(cw, ch) * (0.5 + Math.random() * 0.6) | 0;
    const width = 4 + ((Math.random() * 8) | 0);
    const meander = 0.015 + Math.random() * 0.02; // noise frequency for meandering
    const amp = 6 + Math.random() * 12; // meander amplitude
    const noiseOff = Math.random() * 1000;

    for (let step = 0; step < len; step++) {
      // Displace perpendicular to flow using noise
      const perpNoise = noise2D((step + noiseOff) * meander, s * 13.3) * amp;
      for (let w = -width; w <= width; w++) {
        // Feathered edges: weaker current at edges
        const edgeFade = 1.0 - Math.abs(w) / (width + 1);
        if (Math.random() > edgeFade * 0.9 + 0.1) continue;
        let px, py;
        if (horizontal) {
          px = wrapX(cx0 + step * cd[0]);
          py = wrapY(Math.round(cy0 + step * cd[1] + perpNoise + w));
        } else {
          px = wrapX(Math.round(cx0 + step * cd[0] + perpNoise + w));
          py = wrapY(cy0 + step * cd[1]);
        }
        currents[py * cw + px] = mainDir;
      }
    }
  }

  // Natural gyres: elliptical with noise-perturbed boundaries
  const numGyres = 2 + ((Math.random() * 2) | 0);
  for (let g = 0; g < numGyres; g++) {
    const gx = (cw * (0.2 + Math.random() * 0.6)) | 0;
    const gy = (ch * (0.2 + Math.random() * 0.6)) | 0;
    const rx = 18 + ((Math.random() * 30) | 0);
    const ry = 14 + ((Math.random() * 25) | 0);
    const thick = 3 + ((Math.random() * 4) | 0);
    const cw2 = Math.random() < 0.5 ? 1 : -1; // clockwise or counter
    const noiseOff = Math.random() * 1000;

    for (let dy = -(ry + thick + 3); dy <= ry + thick + 3; dy++) {
      for (let dx = -(rx + thick + 3); dx <= rx + thick + 3; dx++) {
        const normDist = Math.sqrt((dx / rx) * (dx / rx) + (dy / ry) * (dy / ry));
        // Noise-perturbed boundary
        const nPerturb = noise2D((dx + noiseOff) * 0.08, (dy + noiseOff) * 0.08) * 0.15;
        const innerEdge = 1.0 - (thick / Math.max(rx, ry)) + nPerturb;
        const outerEdge = 1.0 + (thick / Math.max(rx, ry)) + nPerturb;
        if (normDist < innerEdge || normDist > outerEdge) continue;
        const wx = wrapX(gx + dx), wy = wrapY(gy + dy);
        // Tangent direction for circular flow
        const angle = Math.atan2(dy, dx);
        const tang = angle + cw2 * Math.PI / 2;
        const tdx = Math.cos(tang), tdy = Math.sin(tang);
        let dir;
        if (Math.abs(tdx) > Math.abs(tdy)) dir = tdx > 0 ? 2 : 4;
        else dir = tdy > 0 ? 3 : 1;
        currents[wy * cw + wx] = dir;
      }
    }
  }

  // ====================================================================
  // 3. CORAL — grows naturally around rock formations
  // ====================================================================
  // Two-pass: first mark rock adjacency, then place with noise modulation
  const coralNoise = (x, y) => F(x + 1234, y + 5678, cw * 0.12, 3);
  for (let i = 0; i < total; i++) {
    if (species[i] !== 1) continue;
    const cx3 = i % cw, cy3 = (i / cw) | 0;
    for (const [dx, dy] of NEIGHBOURS_8) {
      const nx = wrapX(cx3 + dx), ny = wrapY(cy3 + dy);
      const ni = ny * cw + nx;
      if (species[ni] !== 0) continue;
      // Coral density modulated by noise — creates patchy reef clusters
      const cn = (coralNoise(nx, ny) + 1) * 0.5; // 0..1
      if (Math.random() < cn * 0.30) species[ni] = 12;
    }
  }
  // Extra coral in reef-favorable zones (warm shallow areas via noise)
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const idx = y * cw + x;
      if (species[idx] !== 0) continue;
      const warmZone = (F(x + 2000, y + 2000, cw * 0.18, 3) + 1) * 0.5;
      if (warmZone > 0.72 && Math.random() < 0.04) species[idx] = 12;
    }
  }

  // ====================================================================
  // 4. KELP FORESTS — noise-field growth with natural clustering
  // ====================================================================
  const kelpNoise = (x, y) => F(x + 3456, y + 7890, cw * 0.10, 4);
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const idx = y * cw + x;
      if (species[idx] !== 0) continue;
      const kn = (kelpNoise(x, y) + 1) * 0.5; // 0..1
      // Kelp grows in distinct forest patches where noise > threshold
      if (kn > 0.62) {
        // Density increases toward patch centers
        const density = (kn - 0.62) / 0.38;
        if (Math.random() < density * 0.55) species[idx] = 11;
      }
    }
  }

  // ====================================================================
  // 5. PHYTOPLANKTON — gradient bloom zones with soft edges
  // ====================================================================
  const plankNoise = (x, y) => F(x + 6789, y + 1234, cw * 0.16, 5);
  // Also influenced by currents (nutrients concentrate along current paths)
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const idx = y * cw + x;
      if (species[idx] !== 0) continue;
      let pn = (plankNoise(x, y) + 1) * 0.5; // 0..1
      // Boost near currents (upwelling nutrients)
      if (currents[idx] > 0) pn += 0.12;
      // Avoid rock-heavy areas
      if (pn > 0.52) {
        const density = (pn - 0.52) / 0.48;
        if (Math.random() < density * 0.45) species[idx] = 10;
      }
    }
  }

  // ====================================================================
  // 6. ANIMAL PLACEMENT — habitat-aware seeding
  // ====================================================================
  // Build quick lookup of nearby terrain for habitat preference
  function nearbyHas(idx, sid, radius) {
    const cx4 = idx % cw, cy4 = (idx / cw) | 0;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        if (dx === 0 && dy === 0) continue;
        const ni = wrapY(cy4 + dy) * cw + wrapX(cx4 + dx);
        if (species[ni] === sid) return true;
      }
    }
    return false;
  }

  const animalSeeds = [
    // [speciesId, fraction, habitatPreference]
    // habitatPreference: null = anywhere empty, or [nearbySid, radius, boostFactor]
    [20, 0.018, [10, 4, 3.0]],  // Shrimp near phytoplankton
    [21, 0.008, [11, 4, 3.0]],  // Snail near seaweed
    [22, 0.006, [1,  5, 2.0]],  // Crab near rocks
    [23, 0.003, [12, 4, 3.0]],  // Sea Urchin near coral
    [30, 0.008, [10, 5, 2.0]],  // Small Fish near plankton
    [31, 0.005, null],           // Squid — open water
    [32, 0.004, [12, 5, 2.0]],  // Pufferfish near reef
    [40, 0.003, null],           // Shark — open water
    [41, 0.003, [1, 5, 2.5]],   // Octopus near rocks
    [42, 0.002, null],           // Whale — open water
    [43, 0.003, null],           // Dolphin — open water
    [50, 0.010, null],           // Bacteria — everywhere
    [51, 0.005, [1, 4, 2.0]],   // Sea Worm near rocks
  ];

  for (const [sid, frac, habitat] of animalSeeds) {
    let count = Math.max(4, (total * frac) | 0);
    let attempts = 0;
    const maxAttempts = total * 3;
    while (count > 0 && attempts < maxAttempts) {
      const idx = (Math.random() * total) | 0;
      if (species[idx] !== 0) { attempts++; continue; }
      // Habitat preference: more likely to place near preferred terrain
      if (habitat) {
        const [hSid, hRad, hBoost] = habitat;
        const near = nearbyHas(idx, hSid, hRad);
        if (!near && Math.random() > 1.0 / hBoost) { attempts++; continue; }
      }
      species[idx] = sid; hunger[idx] = 0; age[idx] = 0;
      count--;
      attempts++;
    }
  }

  currentSeason = 'Spring';
  seasonTick = 0;
}

// ============================================================
// 9. BOOT
// ============================================================
(function boot() {
  // Auto-size grid to fill viewport
  const wrap = document.getElementById('canvas-wrap');
  const availW = wrap.clientWidth;
  const availH = wrap.clientHeight;
  let cw = Math.floor(availW / CELL_SIZE);
  let ch = Math.floor(availH / CELL_SIZE);
  // Enforce minimums
  cw = Math.max(MIN_GRID_PX / CELL_SIZE, cw);
  ch = Math.max(MIN_GRID_PX / CELL_SIZE, ch);
  // Enforce maximums
  cw = Math.min(MAX_GRID_PX / CELL_SIZE, cw);
  ch = Math.min(MAX_GRID_PX / CELL_SIZE, ch);

  allocGrid(cw, ch);
  initCanvas();

  // Set config inputs to current size
  document.getElementById('cfg-w').value = canvasW;
  document.getElementById('cfg-h').value = canvasH;

  initEvoStats();
  buildPalette();
  selectType(10);
  seedGrid();
  render();
  updateStats();
})();

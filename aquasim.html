        seasonBreedMult *= 1.4; seasonMoveMult *= 1.4;
      } else {
        seasonBreedMult *= 0.8; seasonMoveMult *= 0.8;
      }
    }

    // 1. Increment hunger (metabolic scaling + seasonal modifier)
    const metab = METABOLISM[sp.tier] || 1.0;
    const hungerChance = metab * seasonHungerMult;
    if (Math.random() < hungerChance) hunger[idx]++;

    // Symbiosis: heal hunger if adjacent to a producer
    if (hasTrait('symbiosis') && hunger[idx] > 2) {
      for (let n = 0; n < 4; n++) {
        const dir = CARDINAL[n];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ns = species[ny * cw + nx];
        const nsp = SPECIES[ns];
        if (nsp && nsp.tier === 'producer') {
          hunger[idx] = Math.max(0, hunger[idx] - 2);
          break;
        }
      }
    }

    // Regeneration: heal 1 hunger every 3 ticks
    if (hasTrait('regen') && age[idx] % 3 === 0 && hunger[idx] > 0) {
      hunger[idx]--;
    }

    // Photosynthetic: herbivore slowly restores hunger in open water
    if (hasTrait('photosyn') && hunger[idx] > 0 && age[idx] % 4 === 0) {
      // Only works if no rock adjacent (open water)
      let hasRock = false;
      for (let n = 0; n < 4; n++) {
        const dir = CARDINAL[n];
        if (species[wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0])] === 1) { hasRock = true; break; }
      }
      if (!hasRock) hunger[idx]--;
    }

    // Parasitic: steal 2 hunger from adjacent non-same species
    if (hasTrait('parasite') && hunger[idx] > 3) {
      for (let n = 0; n < 4; n++) {
        const dir = CARDINAL[n];
        const pnx = wrapX(cx + dir[0]), pny = wrapY(cy + dir[1]);
        const pni = pny * cw + pnx;
        const pSid = species[pni];
        if (pSid > 0 && pSid !== sid && SPECIES[pSid] && SPECIES[pSid].hungerMax) {
          hunger[idx] = Math.max(0, hunger[idx] - 2);
          hunger[pni] = Math.min(hunger[pni] + 2, (evoStats[pSid] || {}).hungerMax || 30);
          break;
        }
      }
    }

    // Filter Feeder: passively feeds from any producer within 2 tiles
    if (hasTrait('filterfeeder') && hunger[idx] > 2 && Math.random() < 0.3) {
      for (let fdy = -2; fdy <= 2; fdy++) {
        let fed = false;
        for (let fdx = -2; fdx <= 2; fdx++) {
          if (fdx === 0 && fdy === 0) continue;
          const fni = wrapY(cy + fdy) * cw + wrapX(cx + fdx);
          const fsp = SPECIES[species[fni]];
          if (fsp && fsp.tier === 'producer') {
            hunger[idx] = Math.max(0, hunger[idx] - 2);
            fed = true; break;
          }
        }
        if (fed) break;
      }
    }

    // Colonial: average hunger with adjacent same-species (once per 2 ticks)
    if (hasTrait('colonial') && age[idx] % 2 === 0) {
      let totalH = hunger[idx], cnt = 1;
      for (let n = 0; n < 8; n++) {
        const dir = NEIGHBOURS_8[n];
        const cni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
        if (species[cni] === sid) { totalH += hunger[cni]; cnt++; }
      }
      if (cnt > 1) {
        const avg = (totalH / cnt) | 0;
        hunger[idx] = avg;
        for (let n = 0; n < 8; n++) {
          const dir = NEIGHBOURS_8[n];
          const cni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
          if (species[cni] === sid) hunger[cni] = avg;
        }
      }
    }

    // Biofilm: damage reduction tracked via biofilm flag (used during predation checks)

    // 2. Starvation check
    if (hunger[idx] >= es.hungerMax) {
      spawnDeathParticles(idx, sid);
      species[idx] = 3; hunger[idx] = 0; age[idx] = 0; // become Dead
      continue;
    }

    // 3. Eat: scan neighbours for food (layer-aware)
    // Apex/megafauna scan 2-tile radius; others scan 8 immediate neighbours
    const eats = es.eats;
    const eatsSet = new Set(eats);
    let ate = false;
    const huntRange = (sp.tier === 'apex' || sp.tier === 'megafauna') ? 2 : 1;
    const isPackHunter = hasTrait('packhunter');
    const isTrapJaw = hasTrait('trapjaw');
    const isVenomous = hasTrait('venomous');
    let trapJawUsed = false; // trap jaw only works once per tick

    if (eats && eats.length) {
      const scanCells = huntRange >= 2 ? _scanRange2 : _scanRange1;
      shuffleSmall(scanCells);

      // Pack hunter: count allies near self
      let packAllyCount = 0;
      if (isPackHunter) {
        for (let pn = 0; pn < 8; pn++) {
          const pdir = NEIGHBOURS_8[pn];
          const pni = wrapY(cy + pdir[1]) * cw + wrapX(cx + pdir[0]);
          if (species[pni] === sid) packAllyCount++;
        }
      }
      const packActive = isPackHunter && packAllyCount >= 2;

      for (let n = 0; n < scanCells.length; n++) {
        const [dx, dy] = scanCells[n];
        const nx = wrapX(cx + dx);
        const ny = wrapY(cy + dy);
        const ni = ny * cw + nx;
        const foodId = species[ni];
        if (eatsSet.has(foodId) && layersCanReach(sid, layerOf(foodId))) {
          const preyEs = evo(foodId);
          const preyTraits = preyEs.traits || [];

          // Trap Jaw: first attack ignores ALL prey defenses
          if (isTrapJaw && !trapJawUsed) {
            trapJawUsed = true;
            // Skip all defensive checks — instant kill
          } else {
            // Mimicry: 45% chance predator avoids this prey (scaled by gene strength)
            if (preyTraits.indexOf('mimicry') !== -1 && !packActive && Math.random() < 0.45 * traitStr(foodId, 'mimicry')) continue;
            // Camouflage: prey has 40% chance to evade (pack hunters ignore)
            if (preyTraits.indexOf('camouflage') !== -1 && !packActive && Math.random() < 0.4 * traitStr(foodId, 'camouflage')) continue;
            // Pod Defense: 50% miss if 2+ same species nearby (pack hunters ignore)
            if (preyTraits.indexOf('poddefense') !== -1 && !packActive) {
              let podCount = 0;
              for (let pn = 0; pn < 8; pn++) {
                const pdir = NEIGHBOURS_8[pn];
                const pni = wrapY(ny + pdir[1]) * cw + wrapX(nx + pdir[0]);
                if (species[pni] === foodId) podCount++;
              }
              if (podCount >= 2 && Math.random() < 0.5 * traitStr(foodId, 'poddefense')) continue;
            }
            // Gigantism: 30% miss chance
            if (preyTraits.indexOf('gigantism') !== -1 && Math.random() < 0.3 * traitStr(foodId, 'gigantism')) continue;
            // Ink Cloud: 50% dodge + teleport 2 tiles
            if (preyTraits.indexOf('inkcloud') !== -1 && Math.random() < 0.5 * traitStr(foodId, 'inkcloud')) {
              // Teleport prey 2 tiles in random direction
              const tDir = CARDINAL[(Math.random() * 4) | 0];
              const tnx = wrapX(nx + tDir[0] * 2), tny = wrapY(ny + tDir[1] * 2);
              const tni = tny * cw + tnx;
              if (species[tni] === 0) {
                species[tni] = foodId; hunger[tni] = hunger[ni]; age[tni] = age[ni];
                species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
                processed[tni] = 1;
              }
              continue;
            }
            // Biofilm: 35% damage reduction when 3+ same species adjacent
            if (preyTraits.indexOf('biofilm') !== -1) {
              let bfCount = 0;
              for (let bn = 0; bn < 8; bn++) {
                const bdir = NEIGHBOURS_8[bn];
                if (species[wrapY(ny + bdir[1]) * cw + wrapX(nx + bdir[0])] === foodId) bfCount++;
              }
              if (bfCount >= 3 && Math.random() < 0.35 * traitStr(foodId, 'biofilm')) continue;
            }
          }

          // Toxic: predator takes hunger damage
          if (preyTraits.indexOf('toxic') !== -1) {
            hunger[idx] += Math.round(4 * traitStr(foodId, 'toxic'));
          }
          // Thorns: predator takes heavy hunger penalty
          if (preyTraits.indexOf('thorns') !== -1) {
            hunger[idx] += Math.round(7 * traitStr(foodId, 'thorns'));
          }
          // Venomous predator: extra damage to prey's neighbors (area denial)
          if (isVenomous) {
            for (let vn = 0; vn < 4; vn++) {
              const vdir = CARDINAL[vn];
              const vni = wrapY(ny + vdir[1]) * cw + wrapX(nx + vdir[0]);
              const vSid = species[vni];
              if (vSid === foodId && SPECIES[vSid] && SPECIES[vSid].hungerMax) {
                hunger[vni] = Math.min(hunger[vni] + 3, (evoStats[vSid] || {}).hungerMax || 30);
              }
            }
          }
          // Deep Root: producer has 35% chance to survive being eaten
          if (preyTraits.indexOf('deeproot') !== -1 && Math.random() < 0.35 * traitStr(foodId, 'deeproot')) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true;
            break;
          }
          // Armored: animal has 30% chance to survive being eaten
          if (preyTraits.indexOf('armored') !== -1 && Math.random() < 0.3 * traitStr(foodId, 'armored')) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true;
            break;
          }
          // Rapid Regrowth: when eaten, spreads to up to 2 adjacent empty tiles
          if (preyTraits.indexOf('regrowth') !== -1) {
            let rg = 0;
            for (let rd = 0; rd < 4 && rg < 2; rd++) {
              const rdir = CARDINAL[rd];
              const rx = wrapX(nx + rdir[0]), ry = wrapY(ny + rdir[1]);
              const ri = ry * cw + rx;
              if (species[ri] === 0) {
                species[ri] = foodId; hunger[ri] = 0; age[ri] = 0;
                processed[ri] = 1; rg++;
              }
            }
          }
          spawnDeathParticles(ni, foodId);
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Softshell / Dwarfism: same-tier species can eat neighbours with softshell or dwarfism
    if (!ate && sp.hungerMax) {
      const nbrs2 = shuffleDirs8();
      for (let n = 0; n < 8 && !ate; n++) {
        const dir = NEIGHBOURS_8[nbrs2[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        const nSid = species[ni];
        if (nSid === 0 || nSid === sid) continue;
        const nSp = SPECIES[nSid];
        if (!nSp || !nSp.hungerMax) continue;
        const nEs = evo(nSid);
        const nTraits = nEs.traits || [];
        const vulnerable = nTraits.indexOf('softshell') !== -1 || nTraits.indexOf('dwarfism') !== -1;
        if (vulnerable && nSp.tier === sp.tier && layersCanReach(sid, nSp.layer)) {
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac) | 0));
          processed[ni] = 1;
          ate = true;
        }
      }
    }

    // Bulk Feeder: megafauna eats up to 3 prey in one tick
    if (ate && hasTrait('bulkfeeder') && eats && eats.length) {
      let extraEats = 0;
      const nbrs3 = shuffleDirs8();
      for (let n = 0; n < 8 && extraEats < 2; n++) {
        const dir = NEIGHBOURS_8[nbrs3[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (eatsSet.has(species[ni]) && layersCanReach(sid, layerOf(species[ni]))) {
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * 0.3) | 0));
          processed[ni] = 1;
          extraEats++;
        }
      }
    }

    // Lithivore: if didn't eat normally, try eating adjacent rock
    if (!ate && hasTrait('lithivore')) {
      const rdirs = shuffleDirs4();
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[rdirs[d]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (species[ni] === 1) { // Rock
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * 0.5) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Scavenger: if didn't eat normally, eat adjacent dead matter
    if (!ate && hasTrait('scavenger')) {
      const sdirs = shuffleDirs8();
      for (let d = 0; d < 8; d++) {
        const dir = NEIGHBOURS_8[sdirs[d]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (species[ni] === 3) { // Dead
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * 0.6) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Ambush: if didn't eat normally, check 2-tile range on cardinal axes
    if (!ate && hasTrait('ambush') && eats && eats.length) {
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[d];
        const nx = wrapX(cx + dir[0] * 2);
        const ny = wrapY(cy + dir[1] * 2);
        const ni = ny * cw + nx;
        const foodId = species[ni];
        if (eatsSet.has(foodId) && layersCanReach(sid, layerOf(foodId))) {
          const preyEs = evo(foodId);
          const aPT = preyEs.traits || [];
          if (aPT.indexOf('mimicry') !== -1 && Math.random() < 0.45) continue;
          if (aPT.indexOf('camouflage') !== -1 && Math.random() < 0.4) continue;
          if (aPT.indexOf('gigantism') !== -1 && Math.random() < 0.3) continue;
          if (aPT.indexOf('inkcloud') !== -1 && Math.random() < 0.5) {
            const tDir2 = CARDINAL[(Math.random() * 4) | 0];
            const tnx2 = wrapX(nx + tDir2[0] * 2), tny2 = wrapY(ny + tDir2[1] * 2);
            const tni2 = tny2 * cw + tnx2;
            if (species[tni2] === 0) {
              species[tni2] = foodId; hunger[tni2] = hunger[ni]; age[tni2] = age[ni];
              species[ni] = 0; hunger[ni] = 0; age[ni] = 0; processed[tni2] = 1;
            }
            continue;
          }
          if (aPT.indexOf('toxic') !== -1) hunger[idx] += 4;
          if (aPT.indexOf('thorns') !== -1) hunger[idx] += 7;
          if (aPT.indexOf('deeproot') !== -1 && Math.random() < 0.35) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true; break;
          }
          if (aPT.indexOf('armored') !== -1 && Math.random() < 0.3) {
            hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac * 0.4) | 0));
            ate = true; break;
          }
          if (aPT.indexOf('regrowth') !== -1) {
            let rg = 0;
            for (let rd = 0; rd < 4 && rg < 2; rd++) {
              const rdir = CARDINAL[rd];
              const rx = wrapX(nx + rdir[0]), ry = wrapY(ny + rdir[1]);
              const ri = ry * cw + rx;
              if (species[ri] === 0) { species[ri] = foodId; hunger[ri] = 0; age[ri] = 0; processed[ri] = 1; rg++; }
            }
          }
          spawnDeathParticles(ni, foodId);
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
          hunger[idx] = Math.max(0, hunger[idx] - ((es.hungerMax * restoreFrac) | 0));
          processed[ni] = 1;
          ate = true;
          break;
        }
      }
    }

    // Bioluminescent: attract prey within 3 tiles toward self
    if (hasTrait('bioluminesc') && eats && eats.length && Math.random() < 0.3) {
      for (let dy = -3; dy <= 3; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
          if (dx === 0 && dy === 0) continue;
          if (dx * dx + dy * dy > 9) continue;
          const px = wrapX(cx + dx);
          const py = wrapY(cy + dy);
          const pi = py * cw + px;
          if (eatsSet.has(species[pi]) && !processed[pi] && layersCanReach(sid, layerOf(species[pi]))) {
            // Move prey one step closer to this predator
            const stepX = dx > 0 ? -1 : dx < 0 ? 1 : 0;
            const stepY = dy > 0 ? -1 : dy < 0 ? 1 : 0;
            const tnx = wrapX(px + stepX);
            const tny = wrapY(py + stepY);
            const tni = tny * cw + tnx;
            if (species[tni] === 0) {
              species[tni] = species[pi]; hunger[tni] = hunger[pi]; age[tni] = age[pi];
              species[pi] = 0; hunger[pi] = 0; age[pi] = 0;
              processed[tni] = 1;
            }
            break;
          }
        }
      }
    }

    // 4. Current sweep — if standing on a current, get pushed in its direction
    const curDir = currents[idx];
    if (curDir) {
      const cd = CARDINAL[curDir - 1];
      const sx = wrapX(cx + cd[0]);
      const sy = wrapY(cy + cd[1]);
      const si = sy * cw + sx;
      if (species[si] === 0) {
        species[si] = sid; hunger[si] = hunger[idx]; age[si] = age[idx];
        species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
        processed[si] = 1;
        continue; // swept — skip voluntary movement
      }
    }

    // 5. Movement (with seasonal modifier)
    const effectiveMoveRate = Math.min(0.98, es.moveRate * seasonMoveMult);
    if (Math.random() < effectiveMoveRate) {
      let moved = false;

      // Echolocation: directed movement toward nearest prey within 4 tiles
      if (!moved && hasTrait('echoloc') && eats && eats.length) {
        let bestDist = 999, bestDx = 0, bestDy = 0;
        for (let dy = -4; dy <= 4; dy++) {
          for (let dx = -4; dx <= 4; dx++) {
            if (dx === 0 && dy === 0) continue;
            const dist = dx * dx + dy * dy;
            if (dist > 16 || dist >= bestDist) continue;
            const px = wrapX(cx + dx), py = wrapY(cy + dy);
            const echoSid = species[py * cw + px];
            if (eatsSet.has(echoSid) && layersCanReach(sid, layerOf(echoSid))) {
              bestDist = dist; bestDx = dx; bestDy = dy;
            }
          }
        }
        if (bestDist < 999) {
          const stepX = bestDx > 0 ? 1 : bestDx < 0 ? -1 : 0;
          const stepY = bestDy > 0 ? 1 : bestDy < 0 ? -1 : 0;
          const tnx = wrapX(cx + stepX), tny = wrapY(cy + stepY);
          const tni = tny * cw + tnx;
          if (species[tni] === 0) {
            species[tni] = sid; hunger[tni] = hunger[idx]; age[tni] = age[idx];
            species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
            processed[tni] = 1; moved = true;
          }
        }
      }

      // Stalker: move 2 tiles toward nearest prey (within 3 tiles)
      if (!moved && hasTrait('stalker') && eats && eats.length) {
        let bestDist = 999, bestDx = 0, bestDy = 0;
        for (let dy = -3; dy <= 3; dy++) {
          for (let dx = -3; dx <= 3; dx++) {
            if (dx === 0 && dy === 0) continue;
            const dist = dx * dx + dy * dy;
            if (dist > 9 || dist >= bestDist) continue;
            const px = wrapX(cx + dx), py = wrapY(cy + dy);
            const stSid = species[py * cw + px];
            if (eatsSet.has(stSid) && layersCanReach(sid, layerOf(stSid))) {
              bestDist = dist; bestDx = dx; bestDy = dy;
            }
          }
        }
        if (bestDist < 999) {
          const s1x = bestDx > 0 ? 1 : bestDx < 0 ? -1 : 0;
          const s1y = bestDy > 0 ? 1 : bestDy < 0 ? -1 : 0;
          // First step
          const m1x = wrapX(cx + s1x), m1y = wrapY(cy + s1y);
          const m1i = m1y * cw + m1x;
          if (species[m1i] === 0) {
            // Second step
            const m2x = wrapX(m1x + s1x), m2y = wrapY(m1y + s1y);
            const m2i = m2y * cw + m2x;
            const dest = (species[m2i] === 0) ? m2i : m1i;
            species[dest] = sid; hunger[dest] = hunger[idx]; age[dest] = age[idx];
            species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
            processed[dest] = 1; moved = true;
          }
        }
      }

      if (!moved) {
        const dirs = shuffleDirs4();
        for (let d = 0; d < 4; d++) {
          const dir = CARDINAL[dirs[d]];
          let nx = wrapX(cx + dir[0]);
          let ny = wrapY(cy + dir[1]);
          let ni = ny * cw + nx;
          const targetSid = species[ni];

          if (targetSid === 0) {
            species[ni] = sid; hunger[ni] = hunger[idx]; age[ni] = age[idx];
            species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
            processed[ni] = 1;
            break;
          }
        }
      }
    }

    // 6. Breed (with seasonal modifier)
    // Schooling: boost breed rate if 3+ same species adjacent
    let breedRate = es.breedRate * seasonBreedMult;
    let sameAdjacentCount = 0;
    for (let n = 0; n < 8; n++) {
      const dir = NEIGHBOURS_8[n];
      const ni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
      if (species[ni] === sid) sameAdjacentCount++;
    }
    if (hasTrait('schooling') && sameAdjacentCount >= 3) breedRate *= 1 + 0.5 * traitStr(sid, 'schooling');

    // Territorial: kill adjacent same-species when crowded, breed faster when alone
    if (hasTrait('territorial')) {
      if (sameAdjacentCount >= 4 && Math.random() < 0.3) {
        // Too crowded — kill a random neighbor of same species
        const tNbrs = shuffleDirs8();
        for (let tn = 0; tn < 8; tn++) {
          const tdir = NEIGHBOURS_8[tNbrs[tn]];
          const tni = wrapY(cy + tdir[1]) * cw + wrapX(cx + tdir[0]);
          if (species[tni] === sid) {
            species[tni] = 3; hunger[tni] = 0; age[tni] = 0; // becomes dead
            processed[tni] = 1;
            break;
          }
        }
      } else if (sameAdjacentCount <= 1) {
        breedRate *= 1 + 0.6 * traitStr(sid, 'territorial');
      }
    }

    if (Math.random() < breedRate) {
      const nbrs = shuffleDirs8();
      for (let n = 0; n < 8; n++) {
        const dir = NEIGHBOURS_8[nbrs[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        if (species[ni] === 0) {
          species[ni] = sid;
          // Maternal: offspring start well-fed
          hunger[ni] = hasTrait('maternal') ? 0 : Math.min(hunger[idx], ((es.hungerMax * 0.3) | 0));
          age[ni] = 0;
          processed[ni] = 1;
          break;
        }
      }
    }

    // 7. Competitive displacement: evolved species can outcompete parent/ancestor
    if (sp.parentId !== undefined && evolveEnabled && Math.random() < 0.06) {
      const parentId = sp.parentId;
      const rootId = sp.rootAncestor || parentId;
      const nbrs4 = shuffleDirs8();
      for (let n = 0; n < 8; n++) {
        const dir = NEIGHBOURS_8[nbrs4[n]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        const nSid = species[ni];
        // Can displace parent or any ancestor in same lineage
        if (nSid === parentId || nSid === rootId) {
          // Fitness check: only displace if we're healthier
          if (hunger[idx] < hunger[ni] || (hunger[ni] > es.hungerMax * 0.5)) {
            species[ni] = sid; hunger[ni] = 0; age[ni] = 0;
            processed[ni] = 1;
            break;
          }
        }
      }
    }
  }

  // Active volcanic vents: emit lava each tick
  for (let vi = activeVents.length - 1; vi >= 0; vi--) {
    const v = activeVents[vi];
    v.ticksLeft--;
    if (v.ticksLeft <= 0) { activeVents.splice(vi, 1); continue; }
    const emitCount = v.ticksLeft > 60 ? 3 : v.ticksLeft > 30 ? 2 : 1;
    for (let e = 0; e < emitCount; e++) {
      const a = v.angles[(Math.random() * v.angles.length) | 0] + (Math.random() - 0.5) * 0.8;
      const dist = v.coreR + 1 + ((Math.random() * 3) | 0);
      const lx = wrapX(v.x + Math.round(Math.cos(a) * dist));
      const ly = wrapY(v.y + Math.round(Math.sin(a) * dist));
      const li = ly * gridW + lx;
      if (species[li] !== 1 && species[li] !== 7) {
        if (species[li] >= 10) spawnDeathParticles(li, species[li]);
        species[li] = 7; hunger[li] = 0; age[li] = 0;
      }
    }
  }

  generation++;

  // Adaptive radiation: detect mass death events (>15% population loss in one gen)
  if (evolveEnabled) {
    let livingNow = 0;
    const total = gridW * gridH;
    for (let i = 0; i < total; i++) { if (species[i] >= 10) livingNow++; }
    if (prevLivingCount > 0 && livingNow < prevLivingCount * 0.85) {
      radiationBoost = 5;
      addEvoEvent('Mass extinction detected — adaptive radiation triggered!');
    }
    prevLivingCount = livingNow;
  }

  // Evolution: record population snapshots periodically
  if (evolveEnabled && generation % POP_SNAPSHOT_INTERVAL === 0) {
    recordPopSnapshot();
  }

  // Evolution: random trigger with cooldown
  if (evolveEnabled) {
    if (evoCooldown > 0) {
      evoCooldown--;
    } else if (popHistory.length >= 3 && Math.random() < EVO_CHANCE_PER_GEN) {
      evolve();
      speciate();
      nicheShift();
      for (const k in _creatureCache) delete _creatureCache[k];
      lastEvoGen = generation;
      evoCooldown = EVO_COOLDOWN_MIN + ((Math.random() * (EVO_COOLDOWN_MAX - EVO_COOLDOWN_MIN)) | 0);
    }

    // Extinction cleanup: free slots for extinct evolved species
    if (generation % 50 === 0 && popHistory.length >= 2) {
      const now = popHistory[popHistory.length - 1];
      const prev = popHistory.length >= 2 ? popHistory[popHistory.length - 2] : {};
      for (let di = dynamicSpeciesIds.length - 1; di >= 0; di--) {
        const did = dynamicSpeciesIds[di];
        if ((now[did] || 0) === 0 && (prev[did] || 0) === 0) {
          // Species is extinct — remove from active systems but keep in SPECIES for family tree
          SPECIES[did]._extinct = true;
          const li = LIVING_IDS.indexOf(did);
          if (li !== -1) LIVING_IDS.splice(li, 1);
          dynamicSpeciesIds.splice(di, 1);
          removeFromTierGroups(did);
          // Remove from all species' eats lists
          for (const oid of LIVING_IDS) {
            if (evoStats[oid] && evoStats[oid].eats) {
              const ei = evoStats[oid].eats.indexOf(did);
              if (ei !== -1) evoStats[oid].eats.splice(ei, 1);
            }
          }
          addEvoEvent(SPECIES[did].name + ' went extinct');
        }
      }
    }
  }
}

function tick() {
  step();
  render();
  tickParticles();
  drawParticles();
  updateStats();
}

function startLoop() {
  stopLoop();
  if (running) {
    tickTimer = setInterval(tick, tickInterval);
  }
}

function stopLoop() {
  if (tickTimer !== null) { clearInterval(tickTimer); tickTimer = null; }
}

// ============================================================
// 5. STATS
// ============================================================
const statsEl = document.getElementById('stats-list');
const genEl = document.getElementById('gen-counter');
const seasonEl = document.getElementById('season-display');
const _evoEntriesEl = document.getElementById('evo-entries');
const _bioScoreEl = document.getElementById('bio-score-value');
const _popGraphCanvas = document.getElementById('pop-graph');
const _popGraphCtx = _popGraphCanvas ? _popGraphCanvas.getContext('2d') : null;

function calcBiodiversity(counts) {
  let score = 0;
  const livePops = [];
  const tiersPresent = new Set();
  const allTraits = new Set();
  let totalPop = 0;

  for (const id of LIVING_IDS) {
    const c = counts[id] || 0;
    if (c <= 0) continue;
    livePops.push(c);
    totalPop += c;
    const sp = SPECIES[id];
    if (sp && BIO_TIERS.indexOf(sp.tier) !== -1) tiersPresent.add(sp.tier);
    score += dynamicSpeciesIds.indexOf(id) !== -1 ? 15 : 10;
    const es = evoStats[id];
    if (es && es.traits) {
      for (let t = 0; t < es.traits.length; t++) allTraits.add(es.traits[t]);
    }
  }

  score += allTraits.size * 5;
  score += tiersPresent.size * 25;

  if (livePops.length >= 2 && totalPop > 0) {
    let H = 0;
    for (let i = 0; i < livePops.length; i++) {
      const pi = livePops[i] / totalPop;
      if (pi > 0) H -= pi * Math.log(pi);
    }
    const J = H / Math.log(livePops.length);
    score += (J * 100) | 0;
  }

  return score;
}

function scoreColour(score) {
  if (score < 100) return '#FF4444';
  if (score < 250) return '#FF8844';
  if (score < 450) return '#FFDD44';
  if (score < 650) return '#88FF88';
  return '#00FF88';
}

function drawPopGraph() {
  const cv = _popGraphCanvas;
  const ctx = _popGraphCtx;
  if (!cv || !ctx || graphHistory.length < 2) return;

  const rect = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(rect.width);
  const h = 80;
  cv.width = w * dpr;
  cv.height = h * dpr;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = '#04090F';
  ctx.fillRect(0, 0, w, h);

  const hist = graphHistory;
  const len = hist.length;

  const sidSet = new Set();
  for (let i = 0; i < len; i++) {
    const snap = hist[i];
    for (const sid in snap) {
      const n = parseInt(sid);
      if (n >= 10 && snap[sid] > 0) sidSet.add(n);
    }
  }

  const tierRank = {};
  for (let ti = 0; ti < TIER_ORDER.length; ti++) {
    for (const id of TIER_ORDER[ti].ids) tierRank[id] = ti * 100 + id;
  }
  for (const did of dynamicSpeciesIds) {
    if (!tierRank[did]) {
      const sp = SPECIES[did];
      const parentTi = sp && sp.parentId ? (tierRank[sp.parentId] || 500) : 500;
      tierRank[did] = parentTi + 0.5;
    }
  }

  const sids = Array.from(sidSet).sort((a, b) => (tierRank[a] || 999) - (tierRank[b] || 999));
  if (sids.length === 0) return;

  let maxTotal = 0;
  for (let i = 0; i < len; i++) {
    let t = 0;
    const snap = hist[i];
    for (let s = 0; s < sids.length; s++) t += snap[sids[s]] || 0;
    if (t > maxTotal) maxTotal = t;
  }
  if (maxTotal === 0) return;

  const colW = w / len;

  for (let si = 0; si < sids.length; si++) {
    const sid = sids[si];
    const rgb = COLOR_RGB[sid];
    if (!rgb) continue;
    ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.7)';
    ctx.beginPath();

    ctx.moveTo(0, h);
    for (let i = 0; i < len; i++) {
      const snap = hist[i];
      let stackBelow = 0;
      for (let s = 0; s < si; s++) stackBelow += snap[sids[s]] || 0;
      const stackTop = stackBelow + (snap[sid] || 0);
      const x = i * colW + colW * 0.5;
      const y = h - (stackTop / maxTotal) * (h - 2);
      if (i === 0) ctx.lineTo(x, y);
      else ctx.lineTo(x, y);
    }

    for (let i = len - 1; i >= 0; i--) {
      const snap = hist[i];
      let stackBelow = 0;
      for (let s = 0; s < si; s++) stackBelow += snap[sids[s]] || 0;
      const x = i * colW + colW * 0.5;
      const y = h - (stackBelow / maxTotal) * (h - 2);
      ctx.lineTo(x, y);
    }

    ctx.closePath();
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(12,45,64,0.6)';
  ctx.lineWidth = 0.5;
  for (let q = 1; q <= 3; q++) {
    const y = h * q / 4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
}

function updateStats() {
  genEl.textContent = 'GEN ' + generation;
  if (seasonEl) {
    const progress = ((seasonTick / SEASON_LENGTH) * 100) | 0;
    seasonEl.textContent = currentSeason + ' ' + progress + '%';
    seasonEl.style.color = SEASON_COLORS[currentSeason] || '#7EE8FA';
  }
  const counts = {};
  const total = gridW * gridH;
  for (let i = 0; i < total; i++) {
    const s = species[i];
    if (s !== 0) counts[s] = (counts[s] || 0) + 1;
    if (currents[i]) counts[2] = (counts[2] || 0) + 1;
  }
  const parts = [];
  for (const tier of TIER_ORDER) {
    for (const id of tier.ids) {
      if (id === 0) continue;
      const c = counts[id] || 0;
      if (c > 0) {
        let geneBar = '';
        const sEs = evoStats[id];
        if (evolveEnabled && sEs && sEs.genes) {
          geneBar = '<div style="display:flex;gap:1px;height:3px;margin-top:1px;pointer-events:none;">';
          for (const g of GENE_KEYS) {
            const v = sEs.genes[g] || 0;
            geneBar += '<div style="flex:1;background:' + GENE_COLORS[g] + ';opacity:' + (0.3 + v * 0.7).toFixed(2) + ';height:' + Math.round(v * 3) + 'px;align-self:flex-end;border-radius:1px;"></div>';
          }
          geneBar += '</div>';
        }
        parts.push('<div class="stat-row" data-sid="' + id + '" style="cursor:pointer;"><span class="stat-name" style="color:' +
          SPECIES[id].color + '">' + SPECIES[id].name +
          '</span><span class="stat-count">' + c + '</span>' + geneBar + '</div>');
      }
    }
  }
  // Show transient counts
  const transients = [[3,'#8B7355','Dead'],[4,'#2A1800','Oil'],[5,'#AADDFF','Ice'],[6,'#99FF00','Toxic Bloom'],[7,'#FF4400','Lava']];
  for (const [tid, col, name] of transients) {
    if (counts[tid]) parts.push('<div class="stat-row" data-sid="' + tid + '"><span class="stat-name" style="color:' + col + '">' + name + '</span><span class="stat-count">' + counts[tid] + '</span></div>');
  }
  statsEl.innerHTML = parts.join('');

  // Biodiversity score
  const bioScore = calcBiodiversity(counts);
  _bioScoreEl.textContent = bioScore;
  _bioScoreEl.style.color = scoreColour(bioScore);

  // Population graph recording
  if (generation % GRAPH_RECORD_INTERVAL === 0) {
    const snap = {};
    for (const sid in counts) {
      const n = parseInt(sid);
      if (n >= 10) snap[n] = counts[n];
    }
    graphHistory.push(snap);
    if (graphHistory.length > GRAPH_HISTORY_MAX) graphHistory.shift();
    drawPopGraph();
  }

  // Update evolution log
  const evoEl = _evoEntriesEl;
  if (evolveEnabled && evoLog.length > 0) {
    evoEl.innerHTML = evoLog.map(e => '<div class="evo-entry">' + e + '</div>').join('');
  } else if (!evolveEnabled) {
    evoEl.innerHTML = '<div class="evo-entry" style="opacity:0.4;">EVO OFF</div>';
  } else {
    evoEl.innerHTML = '<div class="evo-entry" style="opacity:0.4;">Waiting...</div>';
  }
}

// ============================================================
// 5b. SPECIES INFO PANEL + CREATURE PORTRAITS
// ============================================================
const _creatureCache = {};

function _seedRng(seed) {
  let s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function _portraitPalette(rgb, genes) {
  const dark = [Math.max(0, rgb[0] - 60), Math.max(0, rgb[1] - 60), Math.max(0, rgb[2] - 60)];
  const light = [Math.min(255, rgb[0] + 50), Math.min(255, rgb[1] + 50), Math.min(255, rgb[2] + 50)];
  const secHue = { v: [40,200,80], s: [60,180,220], f: [200,160,60], a: [160,160,200], p: [220,60,80], o: [180,120,220] };
  let highG = 'v', highV = 0;
  for (const g of GENE_KEYS) { if (genes[g] > highV) { highV = genes[g]; highG = g; } }
  const sh = secHue[highG];
  const secondary = [Math.round(rgb[0]*0.55+sh[0]*0.45), Math.round(rgb[1]*0.55+sh[1]*0.45), Math.round(rgb[2]*0.55+sh[2]*0.45)];
  const belly = [Math.min(255, rgb[0]+70), Math.min(255, rgb[1]+70), Math.min(255, rgb[2]+50)];
  return { base: rgb, dark, light, secondary, belly };
}

function generateCreaturePortrait(sid) {
  if (_creatureCache[sid]) return _creatureCache[sid];
  const sp = SPECIES[sid];
  if (!sp) return null;
  const es = evoStats[sid];
  const rgb = COLOR_RGB[sid] || [128, 128, 128];
  const size = 64;
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const cx = cv.getContext('2d');
  const genes = es && es.genes ? es.genes : { v: 0.5, s: 0.5, f: 0.5, a: 0.5, p: 0.5, o: 0.5 };
  const rng = _seedRng(sid * 2654435761);
  const pal = _portraitPalette(rgb, genes);
  const mid = size / 2;

  function px(x, y, c, a) {
    if (x < 0 || x >= size || y < 0 || y >= size) return;
    cx.fillStyle = a !== undefined ? 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')' : 'rgb('+c[0]+','+c[1]+','+c[2]+')';
    cx.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
  function rect(x, y, w, h, c, a) {
    if (a !== undefined) cx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
    else cx.fillStyle = 'rgb('+c[0]+','+c[1]+','+c[2]+')';
    cx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  // Gene amplification for evolved species
  const baseGenes = es && es.baseGenes ? es.baseGenes : genes;
  let driftSum = 0;
  for (const g of GENE_KEYS) { const d = genes[g] - baseGenes[g]; driftSum += d * d; }
  const drift = Math.sqrt(driftSum);
  const ampFactor = 1 + drift * 4;
  const ag = {};
  for (const g of GENE_KEYS) {
    ag[g] = clamp(baseGenes[g] + (genes[g] - baseGenes[g]) * ampFactor, 0, 1);
  }
  const ld = sp.lineageDepth || 0;
  const evoScale = 1 + drift * 0.3;

  const baseId = sp.rootAncestor || sid;

  function resolveBody(bid, tier) {
    if ([10,11,12,20,21,22,23,30,31,32,40,41,42,43,50,51].includes(bid)) return bid;
    const maps = {
      producer: [10,11,12], herbivore: [20,21,22,23], consumer: [30,31,32],
      apex: [40,41], megafauna: [42,43], decomposer: [50,51]
    };
    const arr = maps[tier] || maps.consumer;
    return arr[bid % arr.length];
  }
  const bodyPlan = resolveBody(baseId, sp.tier);

  function line(x0, y0, x1, y1, c, a) {
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy, cx0 = x0, cy0 = y0;
    for (let i = 0; i < 64; i++) {
      px(cx0, cy0, c, a);
      if (cx0 === x1 && cy0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; cx0 += sx; }
      if (e2 < dx) { err += dx; cy0 += sy; }
    }
  }

  function fillCircle(cx0, cy0, r, c, a) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx*dx + dy*dy <= r*r) px(cx0 + dx, cy0 + dy, c, a);
      }
    }
  }

  function outlineCircle(cx0, cy0, r, c, a) {
    for (let dy = -r - 1; dy <= r + 1; dy++) {
      for (let dx = -r - 1; dx <= r + 1; dx++) {
        const d2 = dx*dx + dy*dy;
        if (d2 >= (r-0.5)*(r-0.5) && d2 <= (r+1.2)*(r+1.2)) px(cx0 + dx, cy0 + dy, c, a);
      }
    }
  }

  if (bodyPlan === 50) {
    // Bacteria: cluster of small cells
    const cellCount = Math.round(5 + ag.v * 3);
    const spread = Math.round(8 * evoScale);
    for (let i = 0; i < cellCount; i++) {
      const cx0 = mid + Math.round((rng() - 0.5) * spread * 2);
      const cy0 = mid + Math.round((rng() - 0.5) * spread * 2);
      const cr = Math.round(3 + rng() * 2 * evoScale);
      fillCircle(cx0, cy0, cr, pal.base);
      outlineCircle(cx0, cy0, cr, pal.dark, 0.5);
      if (rng() < 0.4) px(cx0, cy0, pal.secondary, 0.6);
    }
    const flagCount = 2 + Math.round(ag.s * 2);
    for (let i = 0; i < flagCount; i++) {
      const a0 = rng() * Math.PI * 2;
      const len = Math.round(4 + ag.v * 4);
      const sx = mid + Math.round(Math.cos(a0) * 4);
      const sy = mid + Math.round(Math.sin(a0) * 4);
      for (let s = 0; s < len; s++) {
        const wx = sx + Math.round(Math.cos(a0) * s + Math.sin(s * 1.5) * 1.5);
        const wy = sy + Math.round(Math.sin(a0) * s + Math.cos(s * 1.5) * 1.5);
        px(wx, wy, pal.dark, 0.6);
      }
    }
    const dotCount = 2 + Math.round(ag.o * 5);
    for (let d = 0; d < dotCount; d++) {
      const dx = mid + Math.round((rng() - 0.5) * spread);
      const dy = mid + Math.round((rng() - 0.5) * spread);
      px(dx, dy, pal.secondary, 0.7);
    }

  } else if (bodyPlan === 51) {
    // Sea Worm: elongated segmented body
    const wormLen = Math.round((28 + ag.v * 8) * evoScale);
    const wormW = Math.round((3 + ag.f * 2) * evoScale);
    const segLen = 3 + Math.round(ag.f);
    const startX = mid - Math.round(wormLen / 2);
    for (let x = 0; x < wormLen; x++) {
      const t = x / wormLen;
      const yOff = Math.round(Math.sin(x * 0.25) * (2 + ag.s * 2));
      const w = t < 0.1 ? Math.round(wormW * t * 10) : t > 0.85 ? Math.round(wormW * (1 - t) * 6.67) : wormW;
      const seg = Math.floor(x / segLen);
      const col = seg % 2 === 0 ? pal.base : pal.dark;
      for (let dy = -w; dy <= w; dy++) {
        px(startX + x, mid + yOff + dy, col);
      }
      px(startX + x, mid + yOff - w - 1, pal.dark);
      px(startX + x, mid + yOff + w + 1, pal.dark);
      if (x % segLen === 0 && x > 2 && x < wormLen - 3) {
        const side = seg % 2 === 0 ? -1 : 1;
        const pLen = 1 + Math.round(ag.s * 2);
        for (let p = 1; p <= pLen; p++) {
          px(startX + x, mid + yOff + side * (w + p), pal.light);
        }
      }
    }
    const headX = startX + wormLen - 1;
    const headY = mid + Math.round(Math.sin((wormLen - 1) * 0.25) * (2 + ag.s * 2));
    px(headX + 1, headY - 1, [0,0,0]);
    px(headX + 1, headY + 1, [0,0,0]);

  } else if (bodyPlan === 10) {
    // Phytoplankton: floating cell cluster
    const mainR = Math.round((8 + ag.v * 3) * evoScale);
    fillCircle(mid, mid, mainR, pal.base);
    outlineCircle(mid, mid, mainR, pal.dark);
    const orgCount = 3 + Math.round(ag.o * 4);
    for (let i = 0; i < orgCount; i++) {
      const oa = rng() * Math.PI * 2;
      const od = rng() * (mainR - 2);
      px(mid + Math.round(Math.cos(oa) * od), mid + Math.round(Math.sin(oa) * od), pal.secondary, 0.7);
    }
    fillCircle(mid, mid, Math.max(1, Math.round(mainR * 0.3)), pal.light, 0.4);
    const satCount = 3 + Math.round(ag.f * 3);
    for (let i = 0; i < satCount; i++) {
      const sa = (i / satCount) * Math.PI * 2 + rng() * 0.5;
      const sd = mainR + 3 + Math.round(rng() * 3);
      const sr = 2 + Math.round(rng() * 2);
      const sx = mid + Math.round(Math.cos(sa) * sd);
      const sy = mid + Math.round(Math.sin(sa) * sd);
      fillCircle(sx, sy, sr, pal.base);
      outlineCircle(sx, sy, sr, pal.dark, 0.6);
      if (rng() < 0.5) px(sx, sy, pal.secondary, 0.5);
    }
    const ciliaCount = 4 + Math.round(ag.s * 4);
    for (let i = 0; i < ciliaCount; i++) {
      const ca = rng() * Math.PI * 2;
      const len = 3 + Math.round(ag.v * 4);
      for (let s = 0; s < len; s++) {
        const cx0 = mid + Math.round(Math.cos(ca) * (mainR + 1 + s));
        const cy0 = mid + Math.round(Math.sin(ca) * (mainR + 1 + s));
        px(cx0, cy0, pal.light, 0.5 - s * 0.05);
      }
    }

  } else if (bodyPlan === 11) {
    // Seaweed: tall wavy kelp
    const stemH = Math.round((30 + ag.v * 10) * evoScale);
    const stemBase = mid + Math.round(stemH * 0.4);
    const stemTop = stemBase - stemH;
    const amp = 3 + Math.round(ag.s * 2);
    const period = 18 + Math.round(ag.f * 6);
    for (let y = 0; y < stemH; y++) {
      const yy = stemBase - y;
      const xOff = Math.round(Math.sin(y * Math.PI * 2 / period) * amp);
      const w = 1 + (y < stemH * 0.2 ? Math.round((stemH * 0.2 - y) / (stemH * 0.2) * 2) : 0);
      for (let dx = -w; dx <= w; dx++) {
        px(mid + xOff + dx, yy, dx === -w || dx === w ? pal.dark : pal.base);
      }
    }
    const bladeCount = 4 + Math.round(ag.v * 4);
    for (let i = 0; i < bladeCount; i++) {
      const by = stemBase - Math.round((i + 1) * stemH / (bladeCount + 1));
      const bxBase = mid + Math.round(Math.sin((stemBase - by) * Math.PI * 2 / period) * amp);
      const side = i % 2 === 0 ? 1 : -1;
      const bLen = 5 + Math.round(ag.f * 4 + rng() * 3);
      const bW = 2 + Math.round(ag.v * 2);
      for (let s = 0; s < bLen; s++) {
        const bx = bxBase + side * (1 + s);
        const droop = Math.round(s * s * 0.04);
        const cw = Math.max(1, Math.round(bW * (1 - s / bLen)));
        for (let dw = 0; dw < cw; dw++) {
          px(bx, by + droop + dw, s === 0 ? pal.dark : (dw === 0 ? pal.light : pal.base));
        }
      }
    }
    const holdCount = 3 + Math.round(ag.f * 2);
    for (let r = 0; r < holdCount; r++) {
      const rx = mid + Math.round((rng() - 0.5) * 8);
      const rLen = 2 + Math.round(rng() * 4);
      for (let rl = 0; rl < rLen; rl++) {
        px(rx + Math.round((rng() - 0.5) * 2), stemBase + 1 + rl, pal.dark);
      }
    }
    if (ag.o > 0.3) {
      for (let i = 0; i < 3; i++) {
        const ty = stemTop + Math.round(rng() * 8);
        const tx = mid + Math.round(Math.sin((stemBase - ty) * Math.PI * 2 / period) * amp);
        px(tx, ty, pal.secondary, 0.8);
        px(tx + 1, ty, pal.secondary, 0.5);
      }
    }

  } else if (bodyPlan === 12) {
    // Coral: branching reef structure
    const baseY = mid + Math.round(12 * evoScale);
    const trunkH = Math.round((10 + ag.v * 4) * evoScale);
    const trunkW = Math.round(2 + ag.f * 2);
    for (let y = 0; y < trunkH; y++) {
      for (let dx = -trunkW; dx <= trunkW; dx++) {
        px(mid + dx, baseY - y, Math.abs(dx) === trunkW ? pal.dark : pal.base);
      }
    }
    function drawBranch(bx, by, angle, len, depth) {
      if (depth > 3 || len < 3) return;
      const endX = bx + Math.round(Math.cos(angle) * len);
      const endY = by - Math.round(Math.sin(angle) * len);
      line(bx, by, endX, endY, pal.base);
      if (depth < 2) {
        line(bx + 1, by, endX + 1, endY, pal.base);
        px(bx - 1, by, pal.dark); px(bx + 2, by, pal.dark);
      }
      px(endX, endY, pal.dark);
      px(endX + 1, endY, pal.dark);
      if (depth >= 1) {
        fillCircle(endX, endY, 2, pal.light);
        px(endX, endY, pal.secondary, 0.7);
      }
      const branches = 2 + (depth < 1 ? 1 : 0);
      for (let b = 0; b < branches; b++) {
        const spread = 0.4 + rng() * 0.5;
        const newAngle = angle + (b - (branches - 1) / 2) * spread;
        const newLen = Math.round(len * (0.55 + rng() * 0.25));
        drawBranch(endX, endY, newAngle, newLen, depth + 1);
      }
    }
    const topY = baseY - trunkH;
    const branchCount = 2 + Math.round(ag.f * 2);
    for (let b = 0; b < branchCount; b++) {
      const angle = Math.PI / 2 + (b - (branchCount - 1) / 2) * (0.4 + rng() * 0.3);
      const bLen = Math.round((8 + ag.v * 5) * evoScale);
      drawBranch(mid + Math.round((b - (branchCount - 1) / 2) * 2), topY, angle, bLen, 0);
    }
    const dotCount = 3 + Math.round(ag.o * 5);
    for (let d = 0; d < dotCount; d++) {
      const dx = mid + Math.round((rng() - 0.5) * trunkW * 2);
      const dy = baseY - Math.round(rng() * trunkH);
      px(dx, dy, pal.secondary, 0.5);
    }
    for (let dx = -trunkW - 2; dx <= trunkW + 2; dx++) {
      px(mid + dx, baseY + 1, pal.dark);
    }

  } else if (bodyPlan === 20) {
    // Shrimp: segmented crustacean
    const bLen = Math.round((20 + ag.f * 4) * evoScale);
    const bH = Math.round((5 + ag.f * 2) * evoScale);
    const startX = mid - Math.round(bLen * 0.4);
    const segCount = 5 + Math.round(ag.a * 2);
    const segW = bLen / segCount;
    for (let x = 0; x < bLen; x++) {
      const t = x / bLen;
      const curve = Math.round(Math.sin(t * Math.PI) * (2 + ag.s * 2));
      const h = t < 0.15 ? Math.round(bH * 0.5) : t > 0.85 ? Math.round(bH * (1 - t) * 3) : bH;
      const seg = Math.floor(x / segW);
      const col = seg % 2 === 0 ? pal.base : pal.light;
      for (let dy = -Math.floor(h / 2); dy <= Math.floor(h / 2); dy++) {
        px(startX + x, mid + curve + dy, col);
      }
      px(startX + x, mid + curve - Math.floor(h / 2) - 1, pal.dark);
      px(startX + x, mid + curve + Math.floor(h / 2) + 1, pal.dark);
    }
    const headX = startX + bLen;
    const headY = mid + Math.round(Math.sin(Math.PI) * (2 + ag.s * 2));
    const antLen = Math.round(6 + ag.s * 4);
    for (let a = 0; a < antLen; a++) {
      px(headX + a, headY - 2 - Math.round(a * 0.4), pal.dark, 0.7);
      px(headX + a, headY + 1 + Math.round(a * 0.3), pal.dark, 0.7);
    }
    px(headX - 1, headY - 1, [0,0,0]);
    const legPairs = 3 + Math.round(ag.f);
    for (let l = 0; l < legPairs; l++) {
      const lx = startX + Math.round((l + 1) * bLen / (legPairs + 1));
      const lt = (l + 1) / (legPairs + 1);
      const lCurve = Math.round(Math.sin(lt * Math.PI) * (2 + ag.s * 2));
      const lh = Math.floor(bH / 2);
      px(lx, mid + lCurve + lh + 2, pal.dark);
      px(lx, mid + lCurve + lh + 3, pal.dark);
    }
    const tailY = mid + Math.round(Math.sin(0) * (2 + ag.s * 2));
    px(startX - 1, tailY - 2, pal.base);
    px(startX - 2, tailY - 3, pal.dark);
    px(startX - 1, tailY + 1, pal.base);
    px(startX - 2, tailY + 2, pal.dark);
    px(startX - 1, tailY, pal.base);
    px(startX - 2, tailY, pal.dark);

  } else if (bodyPlan === 21) {
    // Snail: shelled gastropod
    const shellR = Math.round((9 + ag.a * 3) * evoScale);
    const shellX = mid - 3;
    const shellY = mid - 2;
    fillCircle(shellX, shellY, shellR, pal.light);
    outlineCircle(shellX, shellY, shellR, pal.dark);
    for (let r = shellR - 2; r >= 2; r -= 3) {
      outlineCircle(shellX + Math.round((shellR - r) * 0.3), shellY + Math.round((shellR - r) * 0.15), r, pal.dark, 0.4);
    }
    const bodyX = shellX + shellR - 2;
    const bodyY = shellY + shellR - 3;
    const bodyW = Math.round((8 + ag.f * 3) * evoScale);
    const bodyH2 = Math.round((4 + ag.f * 2) * evoScale);
    for (let x = 0; x < bodyW; x++) {
      const t = x / bodyW;
      const h = Math.round(bodyH2 * Math.sin(t * Math.PI));
      for (let dy = 0; dy < Math.max(1, h); dy++) {
        px(bodyX + x, bodyY + dy, dy === 0 ? pal.base : pal.belly);
      }
      px(bodyX + x, bodyY + Math.max(1, h), pal.dark);
    }
    const stalkLen = Math.round(4 + ag.s * 3);
    const headX = bodyX + bodyW - 2;
    for (let s = 0; s < stalkLen; s++) {
      px(headX - 1, bodyY - 1 - s, pal.base);
      px(headX + 2, bodyY - 1 - s, pal.base);
    }
    px(headX - 1, bodyY - 1 - stalkLen, [0,0,0]);
    px(headX + 2, bodyY - 1 - stalkLen, [0,0,0]);
    px(bodyX + bodyW, bodyY + 1, pal.dark);

  } else if (bodyPlan === 22) {
    // Crab: flat body with claws
    const cW = Math.round((8 + ag.f * 3) * evoScale);
    const cH = Math.round((5 + ag.f * 2) * evoScale);
    const cY = mid + 1;
    for (let y = -cH; y <= cH; y++) {
      const t = Math.abs(y) / cH;
      const w = Math.round(cW * (1 - t * 0.3));
      for (let x = -w; x <= w; x++) {
        px(mid + x, cY + y, y < 0 ? pal.base : pal.belly);
      }
      px(mid - w - 1, cY + y, pal.dark);
      px(mid + w + 1, cY + y, pal.dark);
    }
    for (let x = -cW; x <= cW; x++) {
      px(mid + x, cY - cH - 1, pal.dark);
      px(mid + x, cY + cH + 1, pal.dark);
    }
    if (ag.a > 0.3) {
      const ridgeGap = Math.max(2, 5 - Math.round(ag.a * 3));
      for (let y = -cH + ridgeGap; y < cH; y += ridgeGap) {
        const t = Math.abs(y) / cH;
        const w = Math.round(cW * (1 - t * 0.3));
        rect(mid - w + 1, cY + y, w * 2 - 1, 1, pal.dark, 0.3);
      }
    }
    const clawArm = Math.round(4 + ag.p * 3);
    const clawOpen = Math.round(2 + ag.p * 2);
    for (const side of [-1, 1]) {
      const ax = mid + side * (cW + 1);
      const ay = cY - cH + 2;
      for (let a = 0; a < clawArm; a++) {
        px(ax + side * a, ay - Math.round(a * 0.5), pal.base);
        px(ax + side * a, ay - Math.round(a * 0.5) + 1, pal.base);
        px(ax + side * a, ay - Math.round(a * 0.5) - 1, pal.dark);
      }
      const tipX = ax + side * (clawArm - 1);
      const tipY = ay - Math.round((clawArm - 1) * 0.5);
      for (let c = 0; c < clawOpen; c++) {
        px(tipX + side * c, tipY - 1 - c, pal.dark);
        px(tipX + side * c, tipY + 2 + c, pal.dark);
        px(tipX + side * c, tipY, pal.base);
      }
    }
    const legPairs = 4;
    for (let l = 0; l < legPairs; l++) {
      const lx = mid + Math.round((l - 1.5) * cW * 0.5);
      for (const side of [-1, 1]) {
        for (let s = 0; s < 3; s++) {
          px(lx + side * s, cY + cH + 1 + s, pal.dark);
        }
      }
    }
    const eyeStalk = 2;
    for (const side of [-1, 1]) {
      const ex = mid + side * Math.round(cW * 0.5);
      for (let s = 0; s < eyeStalk; s++) px(ex, cY - cH - 2 - s, pal.base);
      px(ex, cY - cH - 2 - eyeStalk, [0,0,0]);
    }

  } else if (bodyPlan === 23) {
    // Sea Urchin: spiny sphere
    const uR = Math.round((8 + ag.f * 2) * evoScale);
    fillCircle(mid, mid, uR, pal.base);
    outlineCircle(mid, mid, uR, pal.dark);
    const dotC = 4 + Math.round(ag.o * 4);
    for (let i = 0; i < dotC; i++) {
      const da = rng() * Math.PI * 2;
      const dd = rng() * (uR - 2);
      px(mid + Math.round(Math.cos(da) * dd), mid + Math.round(Math.sin(da) * dd), pal.secondary, 0.5);
    }
    for (let a = 0; a < 5; a++) {
      const pa = a * Math.PI * 2 / 5 + 0.3;
      const pr = Math.round(uR * 0.5);
      px(mid + Math.round(Math.cos(pa) * pr), mid + Math.round(Math.sin(pa) * pr), pal.light, 0.5);
    }
    const spineCount = 12 + Math.round(ag.a * 6);
    const spineLen = Math.round((4 + ag.a * 4) * evoScale);
    for (let i = 0; i < spineCount; i++) {
      const sa = (i / spineCount) * Math.PI * 2 + rng() * 0.2;
      const sLen = spineLen + Math.round((rng() - 0.5) * 3);
      for (let s = 0; s < sLen; s++) {
        const sx = mid + Math.round(Math.cos(sa) * (uR + s));
        const sy = mid + Math.round(Math.sin(sa) * (uR + s));
        px(sx, sy, s < 2 ? pal.dark : pal.light);
      }
    }

  } else if (bodyPlan === 30) {
    // Small Fish: classic schooling fish
    const bW = Math.round((12 + ag.f * 4) * evoScale);
    const bH = Math.round((6 + ag.f * 2) * evoScale);
    const bodyOff = Math.round(mid + bW * 0.05);
    const startY = Math.round(mid - bH / 2);
    const rows = [];
    for (let y = 0; y < bH; y++) {
      const t = y / Math.max(1, bH - 1);
      rows.push(Math.max(1, Math.round(bW * Math.sin(t * Math.PI) * 0.5)));
    }
    for (let y = 0; y < bH; y++) {
      const w = rows[y];
      const col = y >= bH * 0.6 ? pal.belly : pal.base;
      rect(bodyOff - w, startY + y, w * 2, 1, col);
    }
    for (let y = 0; y < bH; y++) {
      const w = rows[y];
      px(bodyOff - w - 1, startY + y, pal.dark);
      px(bodyOff + w, startY + y, pal.dark);
    }
    for (let x = -rows[0]; x < rows[0]; x++) px(bodyOff + x, startY - 1, pal.dark);
    for (let x = -rows[bH-1]; x < rows[bH-1]; x++) px(bodyOff + x, startY + bH, pal.dark);
    const tailLen = 2 + Math.round(ag.s * 4);
    const forkD = Math.round(ag.s * 4);
    const tailX = bodyOff - rows[Math.round(bH / 2)] - 1;
    for (let t = 0; t < tailLen; t++) {
      if (forkD > 1 && t >= tailLen - forkD) {
        const fs = (t - (tailLen - forkD)) + 1;
        px(tailX - t, mid - fs, pal.base); px(tailX - t, mid + fs - 1, pal.base);
        px(tailX - t - 1, mid - fs, pal.dark); px(tailX - t - 1, mid + fs - 1, pal.dark);
      } else {
        rect(tailX - t, mid - 1, 1, 2, pal.base);
        px(tailX - t, mid - 2, pal.dark); px(tailX - t, mid + 1, pal.dark);
      }
    }
    const finH = 1 + Math.round(ag.s * 3);
    if (finH > 1) {
      for (let f = 0; f < 3; f++) {
        const fh = Math.round(finH * (1 - f / 3));
        rect(bodyOff - 1 + f, startY - fh, 1, fh, pal.base);
        px(bodyOff - 1 + f, startY - fh - 1, pal.dark);
      }
    }
    const pFY = startY + Math.round(bH * 0.55);
    const pFX = bodyOff + Math.round(rows[Math.min(Math.round(bH * 0.55), bH - 1)] * 0.3);
    for (let f = 0; f < 2 + Math.round(ag.s); f++) {
      px(pFX + f, pFY + f, f === 0 ? pal.dark : pal.base);
      px(pFX + f, pFY + f + 1, pal.base);
    }
    if (ag.o > 0.25) {
      const patRng2 = _seedRng((sp.rootAncestor || sid) * 1337);
      const pT = Math.floor(patRng2() * 4);
      const alpha = 0.2 + (ag.o - 0.25) * 0.4;
      if (pT === 0) {
        for (let y = 2; y < bH - 1; y += 3) { const w = rows[y]; if (w > 1) rect(bodyOff - w + 1, startY + y, w * 2 - 2, 1, pal.secondary, alpha); }
      } else if (pT === 2) {
        for (let s = 0; s < 4 + Math.round(ag.o * 5); s++) { const sy = Math.round(rng() * (bH - 2)) + 1; const w = rows[Math.min(sy, bH - 1)]; rect(bodyOff + Math.round((rng() - 0.5) * w), startY + sy, 2, 2, pal.secondary, alpha); }
      } else {
        for (let y = 0; y < bH; y++) { const w = rows[y]; for (let x = -w + 3; x < w; x += 3) px(bodyOff + x, startY + y, pal.secondary, alpha); }
      }
    }
    const eyeX = bodyOff + rows[Math.min(2, bH - 1)] - 2;
    const eyeY = startY + Math.round(bH * 0.25);
    rect(eyeX, eyeY, 2, 2, [255,255,255]);
    px(eyeX + 1, eyeY + 1, [0,0,0]);

  } else if (bodyPlan === 31) {
    // Squid: torpedo-shaped cephalopod
    const mLen = Math.round((12 + ag.f * 4) * evoScale);
    const mW = Math.round((4 + ag.f * 2) * evoScale);
    const headW = Math.round(mW * 1.3);
    const headX = mid + Math.round(mLen * 0.2);
    for (let x = -mLen / 2; x < mLen / 2; x++) {
      const t = (x + mLen / 2) / mLen;
      const w = t < 0.3 ? Math.round(mW * t * 3.3 * 0.8) : Math.round(mW * (1 - (t - 0.3) * 0.5) * 0.8);
      const xx = headX - Math.round(mLen / 2) + Math.round(x);
      for (let dy = -w; dy <= w; dy++) {
        px(xx, mid + dy, dy === -w || dy === w ? pal.dark : (dy > 0 ? pal.belly : pal.base));
      }
    }
    const finW = Math.round(3 + ag.s * 3);
    const finH2 = Math.round(2 + ag.s * 2);
    const finX = headX - Math.round(mLen * 0.45);
    for (let f = 0; f < finW; f++) {
      const fh = Math.round(finH2 * (1 - f / finW));
      for (let dy = 0; dy < fh; dy++) {
        px(finX - f, mid - mW - 1 - dy, pal.base);
        px(finX - f, mid + mW + 1 + dy, pal.base);
      }
      px(finX - f, mid - mW - 2 - fh, pal.dark);
      px(finX - f, mid + mW + 2 + fh, pal.dark);
    }
    const armCount = 8;
    const tentCount = 2;
    const armBaseX = headX + Math.round(mLen * 0.15);
    for (let a = 0; a < armCount; a++) {
      const spread = (a - 3.5) * (1.2 + ag.v * 0.5);
      const aLen = Math.round((4 + rng() * 2) * evoScale);
      for (let s = 0; s < aLen; s++) {
        const ax = armBaseX + s;
        const ay = mid + Math.round(spread * (0.6 + s * 0.15));
        px(ax, ay, s % 2 === 0 ? pal.base : pal.dark);
      }
    }
    for (let t = 0; t < tentCount; t++) {
      const tSpread = (t === 0 ? -2.5 : 2.5);
      const tLen = Math.round((7 + ag.p * 3) * evoScale);
      for (let s = 0; s < tLen; s++) {
        const tx = armBaseX + s;
        const ty = mid + Math.round(tSpread * (0.6 + s * 0.12));
        px(tx, ty, pal.base);
        if (s >= tLen - 2) { px(tx, ty - 1, pal.secondary); px(tx, ty + 1, pal.secondary); }
      }
    }
    for (let a = 0; a < armCount; a++) {
      const spread = (a - 3.5) * (1.2 + ag.v * 0.5);
      const aLen = Math.round((4 + rng() * 2) * evoScale);
      for (let s = 1; s < aLen; s += 2) {
        const ax = armBaseX + s;
        const ay = mid + Math.round(spread * (0.6 + s * 0.15));
        px(ax, ay + 1, pal.secondary, 0.5);
      }
    }
    const eyeX = headX + 1;
    const eyeY = mid - Math.round(mW * 0.4);
    rect(eyeX, eyeY, 3, 3, [255,255,255]);
    px(eyeX + 1, eyeY + 1, [0,0,0]);
    px(eyeX + 1, eyeY, pal.secondary);

  } else if (bodyPlan === 32) {
    // Pufferfish: round inflated body
    const pR = Math.round((10 + ag.f * 2) * evoScale);
    for (let dy = -pR; dy <= pR; dy++) {
      for (let dx = -pR; dx <= pR; dx++) {
        if (dx*dx + dy*dy <= pR*pR) {
          px(mid + dx, mid + dy, dy > pR * 0.2 ? pal.belly : pal.base);
        }
      }
    }
    outlineCircle(mid, mid, pR, pal.dark);
    const spikeC = 10 + Math.round(ag.a * 8);
    for (let i = 0; i < spikeC; i++) {
      const sa = (i / spikeC) * Math.PI * 2 + rng() * 0.3;
      const sLen = 1 + Math.round(ag.a * 2);
      for (let s = 0; s < sLen; s++) {
        px(mid + Math.round(Math.cos(sa) * (pR + 1 + s)), mid + Math.round(Math.sin(sa) * (pR + 1 + s)), pal.dark);
      }
    }
    const tailLen = 2 + Math.round(ag.s * 2);
    for (let t = 0; t < tailLen; t++) {
      px(mid - pR - 1 - t, mid - 1, pal.base);
      px(mid - pR - 1 - t, mid, pal.base);
      px(mid - pR - 1 - t, mid + 1, pal.base);
    }
    px(mid - pR - tailLen - 1, mid - 2, pal.dark);
    px(mid - pR - tailLen - 1, mid + 2, pal.dark);
    px(mid + pR + 1, mid, pal.dark);
    px(mid + pR + 2, mid, pal.dark);
    px(mid + pR + 1, mid + 1, pal.dark);
    const eyeX = mid + Math.round(pR * 0.3);
    const eyeY = mid - Math.round(pR * 0.35);
    rect(eyeX, eyeY, 3, 3, [255,255,255]);
    px(eyeX + 1, eyeY + 1, [0,0,0]);
    px(eyeX + 1, eyeY, pal.secondary);
    if (ag.o > 0.25) {
      const spotC = 3 + Math.round(ag.o * 5);
      for (let s = 0; s < spotC; s++) {
        const sa = rng() * Math.PI * 2;
        const sd = rng() * (pR - 3);
        rect(mid + Math.round(Math.cos(sa) * sd), mid + Math.round(Math.sin(sa) * sd), 2, 2, pal.secondary, 0.35);
      }
    }

  } else if (bodyPlan === 40) {
    // Shark: torpedo body with dorsal fin
    const bW = Math.round((18 + ag.f * 5) * evoScale);
    const bH = Math.round((7 + ag.f * 3) * evoScale);
    const bodyOff = Math.round(mid + bW * 0.05);
    const startY = Math.round(mid - bH / 2);
    const rows = [];
    for (let y = 0; y < bH; y++) {
      const t = y / Math.max(1, bH - 1);
      const sine = Math.sin(t * Math.PI);
      const f2 = t < 0.5 ? 0.3 + 0.7 * sine : sine;
      rows.push(Math.max(1, Math.round(bW * f2 * 0.5)));
    }
    const bellyLine = Math.round(bH * 0.45);
    for (let y = 0; y < bH; y++) {
      const w = rows[y];
      rect(bodyOff - w, startY + y, w * 2, 1, y >= bellyLine ? pal.belly : pal.base);
    }
    for (let y = 0; y < bH; y++) {
      const w = rows[y]; px(bodyOff - w - 1, startY + y, pal.dark); px(bodyOff + w, startY + y, pal.dark);
    }
    for (let x = -rows[0]; x < rows[0]; x++) px(bodyOff + x, startY - 1, pal.dark);
    for (let x = -rows[bH-1]; x < rows[bH-1]; x++) px(bodyOff + x, startY + bH, pal.dark);
    const snoutLen = Math.round(2 + ag.p * 3);
    const snoutY = startY + Math.round(bH * 0.4);
    for (let s = 0; s < snoutLen; s++) {
      px(bodyOff + rows[Math.round(bH * 0.4)] + s, snoutY, pal.base);
      px(bodyOff + rows[Math.round(bH * 0.4)] + s, snoutY + 1, pal.dark);
    }
    const dorsalH = Math.round((5 + ag.s * 4) * evoScale);
    const dorsalW = Math.round(3 + ag.s * 2);
    for (let f = 0; f < dorsalW; f++) {
      const fh = Math.round(dorsalH * (1 - f / (dorsalW + 1)));
      const fx = bodyOff - Math.round(bW * 0.05) + f;
      rect(fx, startY - fh, 1, fh, pal.base);
      px(fx, startY - fh - 1, pal.dark);
    }
    const tailH = Math.round((5 + ag.s * 3) * evoScale);
    const tailX = bodyOff - rows[Math.round(bH / 2)] - 1;
    for (let t = 0; t < 4; t++) {
      const topH = Math.round(tailH * (1 - t / 5));
      const botH = Math.round(tailH * 0.6 * (1 - t / 5));
      px(tailX - t, mid - topH, pal.dark);
      for (let h = topH - 1; h >= 1; h--) px(tailX - t, mid - h, pal.base);
      px(tailX - t, mid + botH, pal.dark);
      for (let h = botH - 1; h >= 1; h--) px(tailX - t, mid + h, pal.base);
      rect(tailX - t, mid - 1, 1, 2, pal.base);
    }
    const pFinY = startY + Math.round(bH * 0.6);
    const pFinX = bodyOff + Math.round(rows[Math.round(bH * 0.6)] * 0.3);
    for (let f = 0; f < 3; f++) {
      px(pFinX + f, pFinY + f, pal.dark);
      px(pFinX + f, pFinY + f + 1, pal.base);
      px(pFinX + f, pFinY + f + 2, pal.base);
    }
    const gillX = bodyOff + rows[3] - 3;
    const gillY = startY + 3;
    for (let g = 0; g < 3; g++) { px(gillX - g * 2, gillY, pal.dark, 0.5); px(gillX - g * 2, gillY + 1, pal.dark, 0.5); }
    const eyeX = bodyOff + rows[2] - 3;
    const eyeY = startY + 2;
    px(eyeX, eyeY, [255,255,255]);
    px(eyeX + 1, eyeY, [0,0,0]);
    const jawLen = Math.round(ag.p * 5);
    if (jawLen > 0) {
      const jawY = startY + Math.round(bH * 0.55);
      const jawX = bodyOff + rows[Math.round(bH * 0.55)];
      rect(jawX, jawY, jawLen, 1, pal.dark);
      if (ag.p > 0.4) {
        for (let t = 0; t < Math.round(ag.p * 3); t++) {
          px(jawX + 1 + t * 2, jawY + 1, pal.light);
          px(jawX + 1 + t * 2, jawY - 1, pal.light);
        }
      }
    }

  } else if (bodyPlan === 41) {
    // Octopus: bulbous head with eight arms
    const headR = Math.round((8 + ag.f * 3) * evoScale);
    const headY = mid - Math.round(headR * 0.5);
    fillCircle(mid, headY, headR, pal.base);
    for (let dy = 0; dy < headR; dy++) {
      const w = Math.round(Math.sqrt(headR * headR - dy * dy));
      for (let dx = -w; dx <= w; dx++) {
        if (dy > headR * 0.4) px(mid + dx, headY + dy, pal.belly);
      }
    }
    outlineCircle(mid, headY, headR, pal.dark);
    const armAngles = [];
    for (let a = 0; a < 8; a++) {
      armAngles.push(Math.PI * 0.1 + a * Math.PI * 0.8 / 7);
    }
    for (let a = 0; a < 8; a++) {
      const angle = armAngles[a];
      const aLen = Math.round((7 + rng() * 4 + ag.v * 3) * evoScale);
      const baseX = mid + Math.round(Math.cos(angle - Math.PI / 2) * (headR - 1));
      const baseY = headY + headR - 1;
      for (let s = 0; s < aLen; s++) {
        const t = s / aLen;
        const curl = Math.sin(s * 0.5 + a) * (2 + t * 3);
        const ax = baseX + Math.round(curl + (a - 3.5) * t * 1.5);
        const ay = baseY + s;
        const aw = Math.max(1, Math.round((1 - t) * 2.5));
        for (let dx = -aw; dx <= aw; dx++) {
          px(ax + dx, ay, Math.abs(dx) === aw ? pal.dark : pal.base);
        }
        if (s % 2 === 0 && s > 0) px(ax, ay + 1, pal.secondary, 0.5);
      }
    }
    const eyeS = 3;
    for (const side of [-1, 1]) {
      const ex = mid + side * Math.round(headR * 0.45);
      const ey = headY - 1;
      rect(ex, ey, eyeS, eyeS, [255,255,255]);
      px(ex + 1, ey + 1, [0,0,0]);
      px(ex + 1, ey, pal.secondary);
    }
    if (ag.o > 0.25) {
      const spotC = 3 + Math.round(ag.o * 5);
      for (let s = 0; s < spotC; s++) {
        const sa = rng() * Math.PI * 2;
        const sd = rng() * (headR - 2);
        rect(mid + Math.round(Math.cos(sa) * sd), headY + Math.round(Math.sin(sa) * sd), 2, 2, pal.secondary, 0.35);
      }
    }

  } else if (bodyPlan === 42) {
    // Whale: massive body with flukes
    const bW = Math.round((22 + ag.f * 5) * evoScale);
    const bH = Math.round((10 + ag.f * 3) * evoScale);
    const bodyOff = Math.round(mid + bW * 0.05);
    const startY = Math.round(mid - bH / 2);
    const rows = [];
    for (let y = 0; y < bH; y++) {
      const t = y / Math.max(1, bH - 1);
      const w = Math.round(bW * 0.5 * Math.sin(t * Math.PI) * (t < 0.4 ? 0.6 + t * 1.0 : 1));
      rows.push(Math.max(1, w));
    }
    const bellyLine = Math.round(bH * 0.5);
    for (let y = 0; y < bH; y++) {
      const w = rows[y];
      rect(bodyOff - w, startY + y, w * 2, 1, y >= bellyLine ? pal.belly : pal.base);
    }
    for (let y = 0; y < bH; y++) {
      const w = rows[y]; px(bodyOff - w - 1, startY + y, pal.dark); px(bodyOff + w, startY + y, pal.dark);
    }
    for (let x = -rows[0]; x < rows[0]; x++) px(bodyOff + x, startY - 1, pal.dark);
    for (let x = -rows[bH-1]; x < rows[bH-1]; x++) px(bodyOff + x, startY + bH, pal.dark);
    const grooveCount = 3 + Math.round(ag.f * 3);
    for (let g = 0; g < grooveCount; g++) {
      const gy = bellyLine + 1 + Math.round(g * (bH - bellyLine - 2) / grooveCount);
      if (gy < bH) {
        const w = rows[gy];
        rect(bodyOff - w + 2, startY + gy, w * 2 - 4, 1, pal.dark, 0.2);
      }
    }
    const headX = bodyOff + rows[Math.round(bH * 0.4)];
    px(headX, mid, pal.dark); px(headX + 1, mid, pal.dark);
    px(bodyOff, startY - 2, pal.light);
    const flukeW = Math.round(5 + ag.s * 3);
    const flukeH = Math.round(3 + ag.s * 2);
    const flukeX = bodyOff - rows[Math.round(bH / 2)] - 1;
    for (let t = 0; t < 3; t++) { rect(flukeX - t, mid - 1, 1, 2, pal.base); }
    for (let f = 0; f < flukeW; f++) {
      const fh = Math.round(flukeH * (1 - f / flukeW * 0.5));
      px(flukeX - 3 - f, mid - fh, pal.dark);
      px(flukeX - 3 - f, mid + fh, pal.dark);
      for (let h = -fh + 1; h < fh; h++) px(flukeX - 3 - f, mid + h, pal.base);
    }
    const flipLen = Math.round(3 + ag.s * 2);
    const flipY = startY + Math.round(bH * 0.6);
    const flipX = bodyOff + Math.round(rows[Math.round(bH * 0.6)] * 0.3);
    for (let f = 0; f < flipLen; f++) {
      px(flipX + f, flipY + f, pal.dark);
      px(flipX + f, flipY + f + 1, pal.base);
    }
    const eyeX = bodyOff + rows[3] - 2;
    const eyeY = startY + 3;
    px(eyeX, eyeY, [255,255,255]);
    px(eyeX, eyeY + 1, [0,0,0]);
    if (ag.p > 0.3) {
      const baleenC = 2 + Math.round(ag.p * 3);
      for (let b = 0; b < baleenC; b++) {
        px(headX, mid - Math.floor(baleenC / 2) + b, pal.light, 0.6);
      }
    }

  } else if (bodyPlan === 43) {
    // Dolphin: sleek body with beak and curved fin
    const bW = Math.round((18 + ag.f * 5) * evoScale);
    const bH = Math.round((6 + ag.f * 3) * evoScale);
    const bodyOff = Math.round(mid + bW * 0.05);
    const startY = Math.round(mid - bH / 2);
    const rows = [];
    for (let y = 0; y < bH; y++) {
      const t = y / Math.max(1, bH - 1);
      const arch = Math.sin(t * Math.PI) * (1 + 0.2 * Math.sin(t * Math.PI * 2));
      rows.push(Math.max(1, Math.round(bW * 0.5 * arch)));
    }
    const bellyLine = Math.round(bH * 0.5);
    for (let y = 0; y < bH; y++) {
      const w = rows[y];
      rect(bodyOff - w, startY + y, w * 2, 1, y >= bellyLine ? pal.belly : pal.base);
    }
    for (let y = 0; y < bH; y++) {
      const w = rows[y]; px(bodyOff - w - 1, startY + y, pal.dark); px(bodyOff + w, startY + y, pal.dark);
    }
    for (let x = -rows[0]; x < rows[0]; x++) px(bodyOff + x, startY - 1, pal.dark);
    for (let x = -rows[bH-1]; x < rows[bH-1]; x++) px(bodyOff + x, startY + bH, pal.dark);
    const beakLen = Math.round((3 + ag.p * 3) * evoScale);
    const beakY = startY + Math.round(bH * 0.4);
    const beakX = bodyOff + rows[Math.round(bH * 0.4)];
    for (let b = 0; b < beakLen; b++) {
      px(beakX + b, beakY, pal.base);
      px(beakX + b, beakY + 1, pal.dark);
    }
    px(beakX + beakLen, beakY, pal.dark);
    const smileY = beakY + 1;
    for (let s = 0; s < Math.round(beakLen * 0.7); s++) {
      px(beakX + s, smileY, pal.dark, 0.4);
    }
    const dorsalH = Math.round((4 + ag.s * 4) * evoScale);
    const dorsalW = Math.round(3 + ag.s * 2);
    const dorsalX = bodyOff - Math.round(bW * 0.05);
    for (let f = 0; f < dorsalW; f++) {
      const curve = Math.round(f * f * 0.15);
      const fh = Math.round(dorsalH * (1 - f / (dorsalW + 1)));
      rect(dorsalX + f + curve, startY - fh, 1, fh, pal.base);
      px(dorsalX + f + curve, startY - fh - 1, pal.dark);
    }
    const flukeW = Math.round(3 + ag.s * 2);
    const flukeH = Math.round(2 + ag.s * 2);
    const tailX = bodyOff - rows[Math.round(bH / 2)] - 1;
    for (let t = 0; t < 2; t++) { rect(tailX - t, mid - 1, 1, 2, pal.base); }
    for (let f = 0; f < flukeW; f++) {
      const fh = Math.round(flukeH * (1 - f / flukeW * 0.3));
      px(tailX - 2 - f, mid - fh, pal.dark);
      px(tailX - 2 - f, mid + fh, pal.dark);
      for (let h = -fh + 1; h < fh; h++) px(tailX - 2 - f, mid + h, pal.base);
    }
    const flipY = startY + Math.round(bH * 0.6);
    const flipX = bodyOff + Math.round(rows[Math.round(bH * 0.6)] * 0.3);
    for (let f = 0; f < 2; f++) { px(flipX + f, flipY + f, pal.dark); px(flipX + f, flipY + f + 1, pal.base); }
    const eyeX = bodyOff + rows[2] - 2;
    const eyeY = startY + 2;
    rect(eyeX, eyeY, 2, 2, [255,255,255]);
    px(eyeX + 1, eyeY + 1, [0,0,0]);

  } else {
    // Fallback: generic oval creature
    const bW = Math.round(10 * evoScale);
    const bH = Math.round(8 * evoScale);
    const startY = Math.round(mid - bH / 2);
    for (let y = 0; y < bH; y++) {
      const t = y / Math.max(1, bH - 1);
      const w = Math.max(1, Math.round(bW * Math.sin(t * Math.PI) * 0.5));
      rect(mid - w, startY + y, w * 2, 1, y > bH * 0.5 ? pal.belly : pal.base);
      px(mid - w - 1, startY + y, pal.dark); px(mid + w, startY + y, pal.dark);
    }
    px(mid + 3, mid - 1, [255,255,255]); px(mid + 4, mid - 1, [0,0,0]);
  }

  // Evolution markers for descendants
  if (ld >= 1 && drift > 0.02) {
    const markCount = Math.min(4, ld);
    const markRng = _seedRng(sid * 9973);
    for (let m = 0; m < markCount; m++) {
      const mx = mid + Math.round((markRng() - 0.5) * 16);
      const my = mid + Math.round((markRng() - 0.5) * 16);
      rect(mx, my, 2, 2, pal.secondary, 0.45 + drift * 0.3);
    }
  }

  const dataUrl = cv.toDataURL();
  _creatureCache[sid] = dataUrl;
  return dataUrl;
}

function buildFamilyTree(sid) {
  const sp = SPECIES[sid];
  if (!sp) return null;
  const rootId = sp.rootAncestor || sid;
  const members = [];
  for (const id in SPECIES) {
    const s = SPECIES[id];
    if (!s || s.tier === 'transient') continue;
    const numId = parseInt(id);
    if (numId === rootId || s.rootAncestor === rootId) members.push(numId);
  }
  if (members.length <= 1 && members[0] === sid) return null;
  const childMap = {};
  for (const m of members) childMap[m] = [];
  for (const m of members) {
    const p = SPECIES[m].parentId;
    if (p !== undefined && childMap[p]) childMap[p].push(m);
  }
  for (const k in childMap) childMap[k].sort((a, b) => a - b);
  return { rootId, members, childMap };
}

function openSpeciesInfo(sid) {
  const sp = SPECIES[sid];
  if (!sp) return;
  const es = evoStats[sid];
  const panel = document.getElementById('species-info-panel');
  const body = document.getElementById('sip-body');
  const portrait = generateCreaturePortrait(sid);
  const genes = es && es.genes ? es.genes : null;
  const traits = es && es.traits ? es.traits : [];
  const strengths = es && es.traitStrengths ? es.traitStrengths : {};
  const eats = es ? es.eats : (sp.eats || []);
  const total = gridW * gridH;
  let popCount = 0;
  for (let i = 0; i < total; i++) { if (species[i] === sid) popCount++; }

  let html = '<div class="sip-header">';
  if (portrait) html += '<img class="sip-portrait" src="' + portrait + '" alt="' + sp.name + '">';
  html += '<div class="sip-title-area">';
  html += '<div class="sip-name" style="color:' + sp.color + ';">' + sp.name + '</div>';
  html += '<div class="sip-tier">' + sp.tier + (sp.lineageDepth ? ' (depth ' + sp.lineageDepth + ')' : '') + '</div>';
  html += '<div class="sip-pop">Population: ' + popCount + '</div>';
  html += '</div></div>';

  if (genes) {
    html += '<div class="sip-section"><div class="sip-section-title">GENOME</div>';
    for (const g of GENE_KEYS) {
      const val = genes[g] || 0;
      const pct = (val * 100).toFixed(0);
      const col = GENE_COLORS[g];
      const variance = es.geneVar ? es.geneVar[g] : 0;
      const varLabel = variance > 0.2 ? ' (diverse)' : variance < 0.05 ? ' (bottleneck)' : '';
      html += '<div class="sip-gene-row">';
      const gLabel = (TIER_GENE_NAMES[sp.tier] && TIER_GENE_NAMES[sp.tier][g]) || GENE_NAMES[g];
      html += '<span class="sip-gene-label" style="color:' + col + ';">' + gLabel + '</span>';
      html += '<div class="sip-gene-bar"><div class="sip-gene-fill" style="width:' + pct + '%;background:' + col + ';"></div></div>';
      html += '<span class="sip-gene-val">' + val.toFixed(2) + varLabel + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  if (traits.length > 0) {
    html += '<div class="sip-section"><div class="sip-section-title">ACTIVE TRAITS</div>';
    html += '<div class="sip-traits">';
    for (const t of traits) {
      const tr = TRAITS[t];
      if (!tr) continue;
      const str = strengths[t] ? strengths[t].toFixed(2) : '1.00';
      html += '<span class="sip-trait-badge" title="' + tr.desc + '">' + tr.icon + ' ' + tr.name;
      html += '<span class="sip-trait-strength"> x' + str + '</span></span>';
    }
    html += '</div></div>';
  }

  html += '<div class="sip-section"><div class="sip-section-title">STATS</div>';
  html += '<div class="sip-stats-grid">';
  html += '<span class="sip-stat-label">Breed Rate</span><span class="sip-stat-val">' + (es ? es.breedRate.toFixed(4) : sp.breedRate.toFixed(4)) + '</span>';
  if (sp.moveRate !== undefined) html += '<span class="sip-stat-label">Move Rate</span><span class="sip-stat-val">' + (es ? es.moveRate.toFixed(3) : sp.moveRate.toFixed(3)) + '</span>';
  if (sp.hungerMax !== undefined) html += '<span class="sip-stat-label">Hunger Max</span><span class="sip-stat-val">' + (es ? es.hungerMax : sp.hungerMax) + '</span>';
  html += '</div></div>';

  if (eats && eats.length > 0) {
    html += '<div class="sip-section"><div class="sip-section-title">DIET</div>';
    html += '<div class="sip-diet-list"><strong>Eats:</strong> ';
    for (const eid of eats) {
      const esp = SPECIES[eid];
      if (!esp) continue;
      html += '<span class="sip-diet-item"><span class="sip-diet-dot" style="background:' + esp.color + ';"></span>' + esp.name + '</span>';
    }
    html += '</div>';
    const predatorList = [];
    for (const oid of LIVING_IDS) {
      const oe = evoStats[oid];
      if (oe && oe.eats && oe.eats.indexOf(sid) !== -1) predatorList.push(oid);
    }
    if (predatorList.length > 0) {
      html += '<div class="sip-diet-list" style="margin-top:4px;"><strong>Eaten by:</strong> ';
      for (const pid of predatorList) {
        const psp = SPECIES[pid];
        if (!psp) continue;
        html += '<span class="sip-diet-item"><span class="sip-diet-dot" style="background:' + psp.color + ';"></span>' + psp.name + '</span>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  const tree = buildFamilyTree(sid);
  if (tree && tree.members.length > 1) {
    html += '<div class="sip-section"><div class="sip-section-title">FAMILY TREE</div>';
    html += '<div class="sip-lineage">';
    const total = gridW * gridH;
    function popOf(id) { let c = 0; for (let i = 0; i < total; i++) { if (species[i] === id) c++; } return c; }
    function renderNode(id, prefix, isLast, depth) {
      const nsp = SPECIES[id];
      if (!nsp) return '';
      const pop = popOf(id);
      const isCurrent = id === sid;
      const isExtinct = pop === 0 && id >= 100;
      const cls = 'sip-tree-node' + (isCurrent ? ' sip-current' : '') + (isExtinct ? ' sip-extinct' : '');
      let h = '<div class="' + cls + '" data-sid="' + id + '">';
      h += '<span class="sip-tree-prefix">' + prefix + (isLast ? '&#x2514;' : '&#x251C;') + '&#x2500;' + '</span>';
      h += '<span class="sip-lineage-swatch" style="background:' + nsp.color + ';"></span> ';
      h += nsp.name;
      if (nsp.tier !== SPECIES[tree.rootId].tier) h += '<span class="sip-tree-tier">[' + nsp.tier + ']</span>';
      if (pop > 0) h += '<span class="sip-tree-pop">(' + pop + ')</span>';
      else if (id >= 100) h += '<span class="sip-tree-pop">(extinct)</span>';
      h += '</div>';
      const children = tree.childMap[id] || [];
      const nextPrefix = prefix + (isLast ? '&nbsp;&nbsp;' : '&#x2502;&nbsp;');
      for (let i = 0; i < children.length; i++) {
        h += renderNode(children[i], nextPrefix, i === children.length - 1, depth + 1);
      }
      return h;
    }
    const rootChildren = tree.childMap[tree.rootId] || [];
    const rootSp = SPECIES[tree.rootId];
    const rootPop = popOf(tree.rootId);
    const rootCls = 'sip-tree-node' + (tree.rootId === sid ? ' sip-current' : '') + (rootPop === 0 && tree.rootId >= 100 ? ' sip-extinct' : '');
    html += '<div class="' + rootCls + '" data-sid="' + tree.rootId + '">';
    html += '<span class="sip-lineage-swatch" style="background:' + rootSp.color + ';"></span> ';
    html += rootSp.name;
    if (rootPop > 0) html += '<span class="sip-tree-pop">(' + rootPop + ')</span>';
    html += '</div>';
    for (let i = 0; i < rootChildren.length; i++) {
      html += renderNode(rootChildren[i], '', i === rootChildren.length - 1, 1);
    }
    html += '</div></div>';
  }

  if (sp.desc) html += '<div class="sip-desc">' + sp.desc + '</div>';

  body.innerHTML = html;
  panel.classList.add('visible');
}

  selectedType = id;

  if (sp.layer >= 0 && sp.layer < LAYER_NAMES.length) desc = '[' + LAYER_NAMES[sp.layer] + '] ' + desc;
  document.getElementById('info-text').textContent = desc;
}

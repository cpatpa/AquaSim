let painting = false;
let lastPaintX = -1, lastPaintY = -1; // for drag-direction currents
let currentDir = 2; // default direction: E (1=N, 2=E, 3=S, 4=W)

function dragDirection(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  if (dx === 0 && dy === 0) return 0; // no movement
  if (Math.abs(dx) >= Math.abs(dy)) {
    return dx > 0 ? 2 : 4; // E or W
  } else {
    return dy > 0 ? 3 : 1; // S or N
  }
}

// Shockwave animation state
let shockwaves = []; // active shockwave animations

function startShockwave(cx, cy, maxRadius) {
  shockwaves.push({
    cx, cy, maxRadius: maxRadius * 1.3,
    startTime: performance.now(), duration: 600
  });
  if (shockwaves.length === 1 && whirlpools.length === 0 && iceWaves.length === 0 && toxicPulses.length === 0 && volcanoEffects.length === 0) {
    requestAnimationFrame(drawAllEffects);
  }
}

// Whirlpool animation
let whirlpools = [];
function startWhirlpool(cx, cy, maxRadius) {
  whirlpools.push({ cx, cy, maxRadius, startTime: performance.now(), duration: 900 });
  if (whirlpools.length === 1 && !shockwaves.length && !iceWaves.length && !toxicPulses.length && !volcanoEffects.length) requestAnimationFrame(drawAllEffects);
}
function drawWhirlpools(now) {
  for (let i = whirlpools.length - 1; i >= 0; i--) {
    const wp = whirlpools[i];
    const t = Math.min(1, (now - wp.startTime) / wp.duration);
    const alpha = (1 - t) * 0.8;
    const rotation = t * Math.PI * 6; // 3 full spins
    // Draw spiral arms
    for (let arm = 0; arm < 3; arm++) {
      const armOffset = (arm / 3) * Math.PI * 2;
      ctx.beginPath();
      for (let s = 0; s < 40; s++) {
        const frac = s / 40;
        const r = frac * wp.maxRadius * (1 - t * 0.5);
        const angle = rotation + armOffset + frac * Math.PI * 3;
        const px = wp.cx + Math.cos(angle) * r;
        const py = wp.cy + Math.sin(angle) * r;
        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(0, 180, 255, ${alpha * (1 - t * 0.3)})`;
      ctx.lineWidth = Math.max(1, (1 - t) * 4);
      ctx.stroke();
    }
    // Center vortex glow
    if (t < 0.7) {
      const grad = ctx.createRadialGradient(wp.cx, wp.cy, 0, wp.cx, wp.cy, wp.maxRadius * 0.3);
      grad.addColorStop(0, `rgba(0, 200, 255, ${(1 - t / 0.7) * 0.4})`);
      grad.addColorStop(1, 'rgba(0, 100, 200, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(wp.cx, wp.cy, wp.maxRadius * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    if (t >= 1) whirlpools.splice(i, 1);
  }
}

// Ice wave animation
let iceWaves = [];
function startIceWave(cx, cy, maxRadius) {
  iceWaves.push({ cx, cy, maxRadius: maxRadius * 1.2, startTime: performance.now(), duration: 800 });
  if (iceWaves.length === 1 && !shockwaves.length && !whirlpools.length && !toxicPulses.length && !volcanoEffects.length) requestAnimationFrame(drawAllEffects);
}
function drawIceWaves(now) {
  for (let i = iceWaves.length - 1; i >= 0; i--) {
    const iw = iceWaves[i];
    const t = Math.min(1, (now - iw.startTime) / iw.duration);
    const eased = 1 - (1 - t) * (1 - t);
    const radius = eased * iw.maxRadius;
    const alpha = 1 - t;
    // Expanding frost ring
    ctx.beginPath();
    ctx.arc(iw.cx, iw.cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(170, 220, 255, ${alpha * 0.9})`;
    ctx.lineWidth = Math.max(2, (1 - t) * 10);
    ctx.stroke();
    // Inner crystalline ring
    ctx.beginPath();
    ctx.arc(iw.cx, iw.cy, radius * 0.7, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200, 240, 255, ${alpha * 0.5})`;
    ctx.lineWidth = Math.max(1, (1 - t) * 5);
    ctx.stroke();
    // Central flash
    if (t < 0.25) {
      const flashAlpha = (1 - t / 0.25) * 0.6;
      const grad = ctx.createRadialGradient(iw.cx, iw.cy, 0, iw.cx, iw.cy, radius * 0.5);
      grad.addColorStop(0, `rgba(220, 240, 255, ${flashAlpha})`);
      grad.addColorStop(0.6, `rgba(150, 200, 255, ${flashAlpha * 0.4})`);
      grad.addColorStop(1, 'rgba(100, 180, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(iw.cx, iw.cy, radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // Frost particle sparkles
    if (t < 0.8) {
      for (let p = 0; p < 12; p++) {
        const angle = (p / 12) * Math.PI * 2 + t * 2;
        const pr = radius * (0.8 + Math.sin(p * 3 + t * 10) * 0.2);
        const px = iw.cx + Math.cos(angle) * pr;
        const py = iw.cy + Math.sin(angle) * pr;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.7})`;
        ctx.fillRect(px - 1, py - 1, 2, 2);
      }
    }
    if (t >= 1) iceWaves.splice(i, 1);
  }
}

// Toxic pulse animation
let toxicPulses = [];
function startToxicPulse(cx, cy, maxRadius) {
  toxicPulses.push({ cx, cy, maxRadius: maxRadius * 1.2, startTime: performance.now(), duration: 700 });
  if (toxicPulses.length === 1 && !shockwaves.length && !whirlpools.length && !iceWaves.length && !volcanoEffects.length) requestAnimationFrame(drawAllEffects);
}
function drawToxicPulses(now) {
  for (let i = toxicPulses.length - 1; i >= 0; i--) {
    const tp = toxicPulses[i];
    const t = Math.min(1, (now - tp.startTime) / tp.duration);
    const eased = 1 - (1 - t) * (1 - t);
    const radius = eased * tp.maxRadius;
    const alpha = 1 - t;
    // Expanding toxic ring
    ctx.beginPath();
    ctx.arc(tp.cx, tp.cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(150, 255, 0, ${alpha * 0.8})`;
    ctx.lineWidth = Math.max(2, (1 - t) * 8);
    ctx.stroke();
    // Inner sickly glow
    ctx.beginPath();
    ctx.arc(tp.cx, tp.cy, radius * 0.6, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200, 255, 50, ${alpha * 0.4})`;
    ctx.lineWidth = Math.max(1, (1 - t) * 4);
    ctx.stroke();
    // Center toxic cloud
    if (t < 0.4) {
      const grad = ctx.createRadialGradient(tp.cx, tp.cy, 0, tp.cx, tp.cy, radius * 0.5);
      grad.addColorStop(0, `rgba(150, 255, 0, ${(1 - t / 0.4) * 0.4})`);
      grad.addColorStop(0.7, `rgba(100, 200, 0, ${(1 - t / 0.4) * 0.2})`);
      grad.addColorStop(1, 'rgba(50, 150, 0, 0)');

    }

    if (t < 0.8) {

        const px = tp.cx + Math.cos(angle) * pr;
        const py = tp.cy + Math.sin(angle) * pr;
        ctx.fillStyle = `rgba(180, 255, 0, ${alpha * 0.6})`;
        ctx.beginPath();

// Volcano eruption animation
let volcanoEffects = [];
function startVolcanoEruption(cx, cy, maxRadius) {
  // Pre-generate ember particles for the eruption
  const embers = [];
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.3 + Math.random() * 1.2;
    const maxDist = maxRadius * (0.5 + Math.random() * 0.8);
    const size = 1 + Math.random() * 3;
    const hue = Math.random() < 0.3 ? 0 : (20 + Math.random() * 30); // red or orange
    const life = 0.4 + Math.random() * 0.6; // how long this ember lives (0-1)
    embers.push({ angle, speed, maxDist, size, hue, life });
  }
  volcanoEffects.push({
    cx, cy, maxRadius, embers,
    startTime: performance.now(), duration: 1800
  });
  if (volcanoEffects.length === 1 && !shockwaves.length && !whirlpools.length && !iceWaves.length && !toxicPulses.length) requestAnimationFrame(drawAllEffects);
}
function drawVolcanoEffects(now) {
  for (let i = volcanoEffects.length - 1; i >= 0; i--) {
    const ve = volcanoEffects[i];
    const t = Math.min(1, (now - ve.startTime) / ve.duration);

    // Phase 1 (0-0.2): initial flash and magma plume rising
    // Phase 2 (0.1-0.7): lava wave expanding, embers flying
    // Phase 3 (0.4-1.0): cooling glow, embers fading

    // Central magma glow — bright at start, dims over time
    if (t < 0.6) {
      const glowT = t / 0.6;
      const glowRadius = ve.maxRadius * 0.3 * (1 + glowT * 0.5);
      const grad = ctx.createRadialGradient(ve.cx, ve.cy, 0, ve.cx, ve.cy, glowRadius);
      const intensity = (1 - glowT * glowT) * 0.8;
      grad.addColorStop(0, `rgba(255, 255, 200, ${intensity})`);
      grad.addColorStop(0.2, `rgba(255, 180, 50, ${intensity * 0.8})`);
      grad.addColorStop(0.5, `rgba(255, 80, 0, ${intensity * 0.5})`);
      grad.addColorStop(1, 'rgba(200, 30, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ve.cx, ve.cy, glowRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Initial flash (first 15%)
    if (t < 0.15) {
      const flashAlpha = (1 - t / 0.15) * 0.7;
      const flashR = ve.maxRadius * 0.5 * (t / 0.15);
      ctx.fillStyle = `rgba(255, 255, 220, ${flashAlpha})`;
      ctx.beginPath();
      ctx.arc(ve.cx, ve.cy, flashR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Expanding lava wave rings
    if (t > 0.05 && t < 0.8) {
      const waveT = (t - 0.05) / 0.75;
      const waveAlpha = (1 - waveT) * 0.7;
      // Outer lava ring
      const ring1R = waveT * ve.maxRadius;
      ctx.beginPath();
      ctx.arc(ve.cx, ve.cy, ring1R, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 100, 0, ${waveAlpha})`;
      ctx.lineWidth = Math.max(3, (1 - waveT) * 12);
      ctx.stroke();
      // Inner heat ring
      const ring2R = waveT * ve.maxRadius * 0.7;
      ctx.beginPath();
      ctx.arc(ve.cx, ve.cy, ring2R, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 200, 50, ${waveAlpha * 0.6})`;
      ctx.lineWidth = Math.max(2, (1 - waveT) * 6);
      ctx.stroke();
    }

    // Ember particles — the star of the show
    for (const ember of ve.embers) {
      if (t > ember.life) continue; // this ember has burnt out
      const et = t / ember.life; // normalized time for this ember
      const dist = ember.speed * et * ember.maxDist;
      // Embers arc upward slightly (negative Y bias) then fall
      const arcY = -Math.sin(et * Math.PI) * ember.maxDist * 0.3;
      const px = ve.cx + Math.cos(ember.angle) * dist;
      const py = ve.cy + Math.sin(ember.angle) * dist + arcY;
      const alpha = et < 0.3 ? et / 0.3 : (1 - (et - 0.3) / 0.7);
      const size = ember.size * (1 - et * 0.5);
      // Ember color shifts from white-yellow to orange to red as it cools
      let r, g, b;
      if (et < 0.2) {
        r = 255; g = 255; b = 200 - et * 500; // white-hot
      } else if (et < 0.5) {
        const ct = (et - 0.2) / 0.3;
        r = 255; g = 255 - ct * 155; b = Math.max(0, 100 - ct * 100); // yellow to orange
      } else {
        const ct = (et - 0.5) / 0.5;
        r = 255 - ct * 55; g = 100 - ct * 80; b = 0; // orange to deep red
      }
      ctx.fillStyle = `rgba(${r|0}, ${g|0}, ${b|0}, ${alpha * 0.9})`;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.5, size), 0, Math.PI * 2);
      ctx.fill();
      // Bright core for larger embers
      if (size > 1.5 && alpha > 0.3) {
        ctx.fillStyle = `rgba(255, 255, 200, ${alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(px, py, size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Heat shimmer / distortion rings (late phase)
    if (t > 0.3 && t < 0.95) {
      const shimmerT = (t - 0.3) / 0.65;
      for (let ring = 0; ring < 3; ring++) {
        const ringT = (shimmerT + ring * 0.15) % 1;
        const ringR = ringT * ve.maxRadius * 1.1;
        const ringAlpha = Math.sin(ringT * Math.PI) * 0.12;
        ctx.beginPath();
        ctx.arc(ve.cx, ve.cy, ringR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 120, 30, ${ringAlpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // Smoke wisps rising from center (late phase)
    if (t > 0.5) {
      const smokeT = (t - 0.5) / 0.5;
      for (let s = 0; s < 5; s++) {
        const sAngle = (s / 5) * Math.PI * 2 + t * 2;
        const sR = ve.maxRadius * 0.15 * (1 + smokeT);
        const sx = ve.cx + Math.cos(sAngle) * sR;
        const sy = ve.cy - smokeT * ve.maxRadius * 0.4 + Math.sin(sAngle * 2) * 5;
        const sAlpha = (1 - smokeT) * 0.2;
        const sSize = 3 + smokeT * 8;
        const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sSize);
        grad.addColorStop(0, `rgba(80, 60, 50, ${sAlpha})`);
        grad.addColorStop(1, 'rgba(40, 30, 25, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(sx, sy, sSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (t >= 1) volcanoEffects.splice(i, 1);
  }
}

// Unified animation loop for all effects
function drawAllEffects(now) {
  const anyActive = shockwaves.length || whirlpools.length || iceWaves.length || toxicPulses.length || volcanoEffects.length;
  if (!anyActive) return;
  render();
  if (shockwaves.length) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      const elapsed = now - sw.startTime;
      const t = Math.min(1, elapsed / sw.duration);
      const eased = 1 - (1 - t) * (1 - t);
      const radius = eased * sw.maxRadius;
      const alpha = 1 - t;
      const ringWidth = Math.max(2, (1 - t) * 8);
      ctx.beginPath();
      ctx.arc(sw.cx, sw.cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 200, 80, ${alpha * 0.9})`;
      ctx.lineWidth = ringWidth;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sw.cx, sw.cy, radius * 0.85, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 100, 20, ${alpha * 0.6})`;
      ctx.lineWidth = ringWidth * 0.6;
      ctx.stroke();
      if (t < 0.3) {
        const flashAlpha = (1 - t / 0.3) * 0.5;
        const grad = ctx.createRadialGradient(sw.cx, sw.cy, 0, sw.cx, sw.cy, radius * 0.6);
        grad.addColorStop(0, `rgba(255, 255, 200, ${flashAlpha})`);
        grad.addColorStop(0.5, `rgba(255, 120, 20, ${flashAlpha * 0.5})`);
        grad.addColorStop(1, `rgba(255, 68, 0, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(sw.cx, sw.cy, radius * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      if (t > 0.2 && t < 0.9) {
        const hazeAlpha = Math.sin((t - 0.2) / 0.7 * Math.PI) * 0.15;
        ctx.beginPath();
        ctx.arc(sw.cx, sw.cy, radius * 1.1, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 150, 50, ${hazeAlpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (t >= 1) shockwaves.splice(i, 1);
    }
  }
  drawWhirlpools(now);
  drawIceWaves(now);
  drawToxicPulses(now);
  drawVolcanoEffects(now);
  if (shockwaves.length || whirlpools.length || iceWaves.length || toxicPulses.length || volcanoEffects.length) {
    requestAnimationFrame(drawAllEffects);
  }
}

function triggerDisaster(canvasX, canvasY) {
  const cellX = (canvasX / CELL_SIZE) | 0;
  const cellY = (canvasY / CELL_SIZE) | 0;
  // Disasters use a larger radius (brush × 2, min 5)
  const r = Math.max(5, brushSize * 2) - 1;
  const r2 = r * r + r;

  if (selectedType === -1) {
    // BOMB — obliterate everything in a large radius
    const bombRadius = Math.max(12, brushSize * 4) - 1;
    const bombR2 = bombRadius * bombRadius + bombRadius;
    for (let dy = -bombRadius; dy <= bombRadius; dy++) {
      for (let dx = -bombRadius; dx <= bombRadius; dx++) {
        if (dx * dx + dy * dy > bombR2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
        currents[idx] = 0;
      }
    }
    // Launch shockwave animation
    startShockwave(cellX * CELL_SIZE + CELL_SIZE / 2, cellY * CELL_SIZE + CELL_SIZE / 2, bombRadius * CELL_SIZE);
  } else if (selectedType === -2) {
    // OIL SPILL — place Oil cells
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        if (species[idx] !== 1) { // don't overwrite rock
          species[idx] = 4; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
  } else if (selectedType === -3) {
    // HEATWAVE — kill all animals, leave plants and environment
    // Warm Adapted species survive; Cold Adapted extra vulnerable; Shell/Armored get a chance
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        const sp = SPECIES[sid];
        if (sp && sp.hungerMax) {
          const traits = evoStats[sid] ? evoStats[sid].traits || [] : [];
          if (traits.indexOf('warmadapt') !== -1) continue; // heat-loving — immune
          if (traits.indexOf('shell') !== -1 && Math.random() < 0.5) continue;
          if (traits.indexOf('armored') !== -1 && Math.random() < 0.4) continue;
          species[idx] = 3; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
    startShockwave(cellX * CELL_SIZE + CELL_SIZE / 2, cellY * CELL_SIZE + CELL_SIZE / 2, r * CELL_SIZE);
  } else if (selectedType === -4) {
    // RED TIDE — flood with phytoplankton, suffocate animals
    // Toxic species immune; Biofilm clusters resist
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        if (sid === 1) continue;
        const sp = SPECIES[sid];
        if (sp && sp.hungerMax) {
          const traits = evoStats[sid] ? evoStats[sid].traits || [] : [];
          if (traits.indexOf('toxic') !== -1) continue;
          if (traits.indexOf('biofilm') !== -1 && Math.random() < 0.35) continue;
          species[idx] = 3; hunger[idx] = 0; age[idx] = 0;
        } else if (sid === 0 || sid === 3) {
          species[idx] = 10; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
  } else if (selectedType === -5) {
    // WHIRLPOOL — vortex pulls creatures toward center, scrambles positions
    const whirlR = Math.max(8, brushSize * 3) - 1;
    const whirlR2 = whirlR * whirlR + whirlR;
    // Collect all movable creatures, sort by distance (outermost first)
    const movables = [];
    for (let dy = -whirlR; dy <= whirlR; dy++) {
      for (let dx = -whirlR; dx <= whirlR; dx++) {
        const dist2 = dx * dx + dy * dy;
        if (dist2 > whirlR2 || dist2 === 0) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        if (sid <= 1 || sid === 5) continue; // skip empty, rock, ice
        const sp = SPECIES[sid];
        if (!sp) continue;
        const traits = evoStats[sid] ? evoStats[sid].traits || [] : [];
        // Resistance checks
        if (traits.indexOf('shell') !== -1 && Math.random() < 0.6) continue;
        if (traits.indexOf('armored') !== -1 && Math.random() < 0.5) continue;
        if (traits.indexOf('deeproot') !== -1) continue; // anchored
        if (sp.tier === 'producer' && traits.indexOf('biofilm') !== -1 && Math.random() < 0.5) continue;
        movables.push({ x, y, idx, dx, dy, dist2, sid, h: hunger[idx], a: age[idx], c: currents[idx] });
      }
    }
    // Sort outermost first, pull each toward center
    movables.sort((a, b) => b.dist2 - a.dist2);
    for (const m of movables) {
      // Calculate direction toward center
      const stepX = m.dx > 0 ? -1 : m.dx < 0 ? 1 : 0;
      const stepY = m.dy > 0 ? -1 : m.dy < 0 ? 1 : 0;
      const pullDist = Math.max(1, Math.round(Math.sqrt(m.dist2) * 0.4));
      let nx = m.x, ny = m.y;
      for (let s = 0; s < pullDist; s++) {
        const tx = wrapX(nx + stepX);
        const ty = wrapY(ny + stepY);
        const ti = ty * gridW + tx;
        if (species[ti] === 0 || species[ti] === 3) {
          // Clear old position
          species[ny * gridW + nx] = 0; hunger[ny * gridW + nx] = 0; age[ny * gridW + nx] = 0;
          nx = tx; ny = ty;
        } else break;
      }
      // Place at new position
      const ni = ny * gridW + nx;
      species[ni] = m.sid; hunger[ni] = m.h; age[ni] = m.a; currents[ni] = m.c;
    }
    // Creatures at the very center take damage
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        const sp = SPECIES[sid];
        if (sp && sp.hungerMax) {
          hunger[idx] += 10;
          if (hunger[idx] >= (evoStats[sid] ? evoStats[sid].hungerMax : sp.hungerMax)) {
            species[idx] = 3; hunger[idx] = 0; age[idx] = 0;
          }
        }
      }
    }
    startWhirlpool(cellX * CELL_SIZE + CELL_SIZE / 2, cellY * CELL_SIZE + CELL_SIZE / 2, whirlR * CELL_SIZE);
  } else if (selectedType === -6) {
    // ICE AGE — freezing wave, turns water to ice, freezes animals
    // Cold Adapted survive; Warm Adapted extra vulnerable; Deep Root plants survive
    const iceR = Math.max(8, brushSize * 3) - 1;
    const iceR2 = iceR * iceR + iceR;
    for (let dy = -iceR; dy <= iceR; dy++) {
      for (let dx = -iceR; dx <= iceR; dx++) {
        if (dx * dx + dy * dy > iceR2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        if (sid === 1 || sid === 5) continue; // skip rock and existing ice
        const sp = SPECIES[sid];
        const traits = evoStats[sid] ? evoStats[sid].traits || [] : [];
        if (traits.indexOf('coldadapt') !== -1) continue; // cold-loving — immune
        if (sp && sp.hungerMax) {
          // Animals: freeze (become ice or dead based on distance)
          if (traits.indexOf('shell') !== -1 && Math.random() < 0.4) continue;
          if (traits.indexOf('armored') !== -1 && Math.random() < 0.3) continue;
          species[idx] = 5; hunger[idx] = 0; age[idx] = 0;
        } else if (sp && sp.breedRate !== undefined) {
          // Producer: deep root survives, others frozen
          if (traits.indexOf('deeproot') !== -1) continue;
          species[idx] = 5; hunger[idx] = 0; age[idx] = 0;
        } else if (sid === 0 || sid === 3 || sid === 4) {
          // Empty/dead/oil — freeze
          species[idx] = 5; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
    startIceWave(cellX * CELL_SIZE + CELL_SIZE / 2, cellY * CELL_SIZE + CELL_SIZE / 2, iceR * CELL_SIZE);
  } else if (selectedType === -7) {
    // TOXIC BLOOM — seed toxic algae that spreads and damages non-toxic species
    // Toxic trait species are immune and get breed boost; Biofilm resists
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        if (sid === 1) continue;
        const sp = SPECIES[sid];
        const traits = evoStats[sid] ? evoStats[sid].traits || [] : [];
        if (traits.indexOf('toxic') !== -1) {
          // Toxic species thrive — restore hunger
          if (sp && sp.hungerMax) hunger[idx] = Math.max(0, hunger[idx] - 10);
          continue;
        }
        if (sp && sp.hungerMax) {
          // Animals take heavy damage
          hunger[idx] += 12;
          if (hunger[idx] >= (evoStats[sid] ? evoStats[sid].hungerMax : sp.hungerMax)) {
            species[idx] = 6; hunger[idx] = 0; age[idx] = 0;
          }
        } else if (sid !== 5 && sid !== 6) {
          // Non-animals (plants, empty, dead) become toxic bloom
          species[idx] = 6; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
    startToxicPulse(cellX * CELL_SIZE + CELL_SIZE / 2, cellY * CELL_SIZE + CELL_SIZE / 2, r * CELL_SIZE);
  } else if (selectedType === -8) {
    // VOLCANO — subsea eruption with active vent that emits lava over time
    const volcR = Math.max(8, brushSize * 3);
    const coreR = Math.max(2, Math.floor(volcR * 0.2));
    const coreR2 = coreR * coreR + coreR;
    // Phase 1: small rock core (the vent)
    for (let dy = -coreR; dy <= coreR; dy++) {
      for (let dx = -coreR; dx <= coreR; dx++) {
        if (dx * dx + dy * dy > coreR2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        if (species[idx] >= 10) spawnDeathParticles(idx, species[idx]);
        species[idx] = 1; hunger[idx] = 0; age[idx] = 0;
      }
    }
    // Phase 2: initial short lava burst (3-5 fingers, shorter than before)
    const numFingers = 3 + Math.floor(Math.random() * 3);
    const fingerLen = Math.max(3, Math.floor(volcR * 0.35));
    const fingerAngles = [];
    for (let f = 0; f < numFingers; f++) {
      const angle = (f / numFingers) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
      fingerAngles.push(angle);
      let fx = cellX + Math.round(Math.cos(angle) * (coreR + 1));
      let fy = cellY + Math.round(Math.sin(angle) * (coreR + 1));
      const drift = (Math.random() - 0.5) * 0.6;
      for (let step = 0; step < fingerLen; step++) {
        const wx = wrapX(fx);
        const wy = wrapY(fy);
        const wi = wy * gridW + wx;
        if (species[wi] !== 1) {
          if (species[wi] >= 10) spawnDeathParticles(wi, species[wi]);
          species[wi] = 7; hunger[wi] = 0;
          age[wi] = Math.floor(Math.random() * 4);
        }
        const stepAngle = angle + drift + (Math.random() - 0.5) * 1.2;
        fx += Math.round(Math.cos(stepAngle));
        fy += Math.round(Math.sin(stepAngle));
      }
    }
    // Phase 3: heat zone — kill all nearby life (plants and animals)
    const heatR = Math.max(5, Math.floor(volcR * 0.7));
    const heatR2 = heatR * heatR;
    for (let dy = -heatR; dy <= heatR; dy++) {
      for (let dx = -heatR; dx <= heatR; dx++) {
        const dist2 = dx * dx + dy * dy;
        if (dist2 > heatR2) continue;
        const x = wrapX(cellX + dx);
        const y = wrapY(cellY + dy);
        const idx = y * gridW + x;
        const sid = species[idx];
        if (sid <= 1 || sid === 7) continue;
        const sp = SPECIES[sid];
        if (!sp) continue;
        const traits = evoStats[sid] ? evoStats[sid].traits || [] : [];
        if (traits.indexOf('warmadapt') !== -1 && Math.random() < 0.6) continue;
        if (traits.indexOf('shell') !== -1 && Math.random() < 0.3) continue;
        const dist = Math.sqrt(dist2);
        const killChance = (1 - dist / heatR) * 0.7 + 0.15;
        if (Math.random() < killChance) {
          if (sid >= 10) spawnDeathParticles(idx, sid);
          species[idx] = 3; hunger[idx] = 0; age[idx] = 0;
        }
      }
    }
    // Register active vent: emits lava for 80-120 ticks
    activeVents.push({
      x: cellX, y: cellY, coreR: coreR,
      ticksLeft: 80 + ((Math.random() * 40) | 0),
      angles: fingerAngles
    });
    startVolcanoEruption(cellX * CELL_SIZE + CELL_SIZE / 2, cellY * CELL_SIZE + CELL_SIZE / 2, volcR * CELL_SIZE);
  }
  render();
  updateStats();
}

function paintAt(canvasX, canvasY) {
  const cellX = (canvasX / CELL_SIZE) | 0;
  const cellY = (canvasY / CELL_SIZE) | 0;

  // Update drag direction for currents
  if (selectedType === 2 && lastPaintX >= 0) {
    const dir = dragDirection(lastPaintX, lastPaintY, canvasX, canvasY);
    if (dir !== 0) currentDir = dir;
  }
  lastPaintX = canvasX;
  lastPaintY = canvasY;

  const r = brushSize - 1;
  const r2 = r * r + r; // circular approximation
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r2) continue;
      const x = wrapX(cellX + dx);
      const y = wrapY(cellY + dy);
      const idx = y * gridW + x;
      if (selectedType === 2) {
        // Current overlay with direction from drag
        currents[idx] = currentDir;
      } else {
        species[idx] = selectedType;
        hunger[idx] = 0;
        age[idx] = 0;
        // Erase also clears current overlay
        if (selectedType === 0) currents[idx] = 0;
      }
    }
  }
  render();
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  return [x, y];
}

canvas.addEventListener('mousedown', function(e) {
  painting = true;
  lastPaintX = -1; lastPaintY = -1;
  const [x, y] = getCanvasCoords(e);
  if (selectedType < 0) { triggerDisaster(x, y); }
  else { paintAt(x, y); }
});
canvas.addEventListener('mousemove', function(e) {
  if (!painting || selectedType < 0) return;
  const [x, y] = getCanvasCoords(e);
  paintAt(x, y);
});
window.addEventListener('mouseup', function() { painting = false; });

// Touch support
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  painting = true;
  lastPaintX = -1; lastPaintY = -1;
  const touch = e.touches[0];
  const [x, y] = getCanvasCoords(touch);
  if (selectedType < 0) { triggerDisaster(x, y); }
  else { paintAt(x, y); }
}, { passive: false });
canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!painting || selectedType < 0) return;
  const touch = e.touches[0];
  const [x, y] = getCanvasCoords(touch);
  paintAt(x, y);
}, { passive: false });
canvas.addEventListener('touchend', function() { painting = false; });

// 7b. CELL TOOLTIP — mouseover species info
// ============================================================
const tooltip = document.getElementById('cell-tooltip');
let tooltipVisible = false;

canvas.addEventListener('mousemove', function(e) {
  if (painting) {
    if (tooltipVisible) { tooltip.style.display = 'none'; tooltipVisible = false; }
    return;
  }
  const [px, py] = getCanvasCoords(e);
  const cellX = (px / CELL_SIZE) | 0;
  const cellY = (py / CELL_SIZE) | 0;
  if (cellX < 0 || cellX >= gridW || cellY < 0 || cellY >= gridH) {
    tooltip.style.display = 'none'; tooltipVisible = false;
    return;
  }
  const idx = cellY * gridW + cellX;
  const sid = species[idx];
  const curDir = currents[idx];

  if (sid === 0 && !curDir) {
    tooltip.style.display = 'none'; tooltipVisible = false;
    return;
  }

  const sp = SPECIES[sid];
  let html = '<div class="tt-name" style="color:' + (sp ? sp.color : '#7EE8FA') + '">' + (sp ? sp.name : 'Empty') + '</div>';

  if (curDir) {
    const dirNames = ['', 'North', 'East', 'South', 'West'];
    html += '<div class="tt-stat">Current: ' + dirNames[curDir] + '</div>';
  }

  if (sp && sp.tier && sp.tier !== 'none' && sp.tier !== 'transient' && sp.tier !== 'environment') {
    const layerName = sp.layer >= 0 && sp.layer < LAYER_NAMES.length ? LAYER_NAMES[sp.layer] : 'All';
    html += '<div class="tt-stat">Tier: ' + sp.tier + ' | Layer: <span style="color:' + (LAYER_COLORS[sp.layer] || '#7EE8FA') + '">' + layerName + '</span></div>';
    if (sp.hungerMax) {
      const es = evo(sid);
      html += '<div class="tt-stat">Hunger: ' + hunger[idx] + '/' + es.hungerMax + '</div>';
      html += '<div class="tt-stat">Speed: ' + (es.moveRate * 100).toFixed(0) + '% | Breed: ' + (es.breedRate * 100).toFixed(1) + '%</div>';
      if (es.eats && es.eats.length) {
        const foodNames = es.eats.map(fid => SPECIES[fid] ? SPECIES[fid].name : '?').join(', ');
        html += '<div class="tt-stat">Eats: ' + foodNames + '</div>';
      }
      // Show traits
      if (es.traits && es.traits.length > 0) {
        const traitStr = es.traits.map(t => TRAITS[t] ? TRAITS[t].icon + ' ' + TRAITS[t].name : t).join(', ');
        html += '<div class="tt-trait">Traits: ' + traitStr + '</div>';
      }
    } else if (sp.breedRate) {
      const es = evo(sid);
      html += '<div class="tt-stat">Breed: ' + (es.breedRate * 100).toFixed(1) + '%</div>';
      if (es.traits && es.traits.length > 0) {
        const traitStr = es.traits.map(t => TRAITS[t] ? TRAITS[t].icon + ' ' + TRAITS[t].name : t).join(', ');
        html += '<div class="tt-trait">Traits: ' + traitStr + '</div>';
      }
    }
    if (sp.parentId !== undefined) {
      let lineage = 'Evolved from ' + (SPECIES[sp.parentId] ? SPECIES[sp.parentId].name : '?');
      if (sp.lineageDepth > 1) lineage += ' (branch depth ' + sp.lineageDepth + ')';
      html += '<div class="tt-stat" style="color:#DDBB44;">' + lineage + '</div>';
    }
  }
  if (sp && sp.desc) {
    html += '<div class="tt-stat" style="opacity:0.6;margin-top:2px;">' + sp.desc + '</div>';
  }

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  tooltipVisible = true;
  // Position near mouse
  const tx = e.clientX + 12;
  const ty = e.clientY + 12;
  tooltip.style.left = Math.min(tx, window.innerWidth - 210) + 'px';
  tooltip.style.top = Math.min(ty, window.innerHeight - 120) + 'px';
});

canvas.addEventListener('mouseleave', function() {
  tooltip.style.display = 'none';
  tooltipVisible = false;
});

// ============================================================
// 7d. EVOLUTION TREE POPUP (click on organism)
// ============================================================
(function() {
  const popup = document.getElementById('evo-tree-popup');
  const content = document.getElementById('etp-content');
  const closeBtn = document.getElementById('etp-close-btn');

  closeBtn.addEventListener('click', function() { popup.style.display = 'none'; });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') popup.style.display = 'none';
  });

  // Build lineage: walk from root ancestor down to the clicked species
  function getLineageTree(sid) {
    const sp = SPECIES[sid];
    if (!sp) return [];

    // Find root ancestor
    let rootId = sid;
    const visited = new Set();
    while (SPECIES[rootId] && SPECIES[rootId].parentId !== undefined && !visited.has(rootId)) {
      visited.add(rootId);
      rootId = SPECIES[rootId].parentId;
    }

    // BFS from root to collect full tree
    const tree = [];
    const queue = [{ id: rootId, depth: 0 }];
    const seen = new Set();
    while (queue.length > 0) {
      const { id, depth } = queue.shift();
      if (seen.has(id)) continue;
      seen.add(id);
      tree.push({ id, depth });

      // Find children of this species
      const allIds = LIVING_IDS.concat(dynamicSpeciesIds);
      for (const cid of allIds) {
        if (SPECIES[cid] && SPECIES[cid].parentId === id && !seen.has(cid)) {
          queue.push({ id: cid, depth: depth + 1 });
        }
      }
    }
    return tree;
  }

  canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (!evolveEnabled) return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const cs = CELL_SIZE;
    const cx = (mx / cs) | 0;
    const cy = (my / cs) | 0;
    if (cx < 0 || cx >= gridW || cy < 0 || cy >= gridH) return;

    const idx = cy * gridW + cx;
    const sid = species[idx];
    if (sid === 0 || sid === 1 || sid === 2) return; // ignore empty/rock/current

    const sp = SPECIES[sid];
    if (!sp || sp.breedRate === undefined) return; // not a living species

    const tree = getLineageTree(sid);
    if (tree.length === 0) return;

    let html = '';
    for (const node of tree) {
      const nsp = SPECIES[node.id];
      if (!nsp) continue;
      const es = evo(node.id);
      const isCurrent = node.id === sid;
      const indent = node.depth > 0 ? '<span class="etp-branch">' + '│ '.repeat(node.depth - 1) + '├─ </span>' : '';
      const swatch = '<span class="etp-swatch" style="background:' + nsp.color + ';"></span>';
      html += '<div class="etp-node' + (isCurrent ? ' etp-current' : '') + '">';
      html += indent + swatch + ' ' + nsp.name;
      html += '</div>';
      // Stats line
      if (es.hungerMax) {
        html += '<div class="etp-stats">' + indent.replace(/[├─│]/g, ' ');
        html += 'Spd:' + ((es.moveRate||0) * 100).toFixed(0) + '% Brd:' + ((es.breedRate||0) * 100).toFixed(1) + '% Hgr:' + es.hungerMax;
        html += '</div>';
      } else if (es.breedRate) {
        html += '<div class="etp-stats">' + indent.replace(/[├─│]/g, ' ');
        html += 'Brd:' + ((es.breedRate||0) * 100).toFixed(1) + '%';
        html += '</div>';
      }
      // Traits line
      if (es.traits && es.traits.length > 0) {
        const tStr = es.traits.map(function(t) { return TRAITS[t] ? TRAITS[t].icon + ' ' + TRAITS[t].name : t; }).join(', ');
        html += '<div class="etp-traits">' + indent.replace(/[├─│]/g, ' ') + tStr + '</div>';
      }
      // Gene bar
      if (es.genes) {
        html += '<div style="display:flex;gap:1px;height:4px;margin:1px 0 2px 18px;">';
        for (const g of GENE_KEYS) {
          const gv = es.genes[g] || 0;
          const gn = (TIER_GENE_NAMES[sp.tier] && TIER_GENE_NAMES[sp.tier][g]) || GENE_NAMES[g];
          html += '<div style="flex:1;background:' + GENE_COLORS[g] + ';opacity:' + (0.3 + gv * 0.7).toFixed(2) + ';height:' + Math.round(gv * 4) + 'px;align-self:flex-end;border-radius:1px;" title="' + gn + ': ' + gv.toFixed(2) + '"></div>';
        }
        html += '</div>';
      }
    }

    content.innerHTML = html;
    popup.style.display = 'block';

    // Position near click
    const px = Math.min(e.clientX + 10, window.innerWidth - 350);
    const py = Math.min(e.clientY + 10, window.innerHeight - 300);
    popup.style.left = Math.max(0, px) + 'px';
    popup.style.top = Math.max(0, py) + 'px';
  });

  // Close when clicking outside the popup
  document.addEventListener('mousedown', function(e) {
    if (popup.style.display === 'block' && !popup.contains(e.target)) {
      popup.style.display = 'none';
    }
  });
})();

// ============================================================
// 8. SEED
// ============================================================
function seedGrid() {
  const total = gridW * gridH;
  // Fair distribution: every species gets represented, pyramid-shaped
  const targets = [
    // Environment
    [1,  0.020],  // Rock

    // Producers — large base
    [10, 0.085],  // Phytoplankton
    [11, 0.025],  // Seaweed
    [12, 0.008],  // Coral

    // Herbivores — moderate
    [20, 0.014],  // Shrimp
    [21, 0.006],  // Snail
    [22, 0.006],  // Crab
    [23, 0.003],  // Sea Urchin

    // Consumers — smaller
    [30, 0.005],  // Small Fish
    [31, 0.003],  // Squid
    [32, 0.002],  // Pufferfish

    // Apex — small but viable
    [40, 0.002],  // Shark
    [41, 0.002],  // Octopus

    // Megafauna — rare but viable
    [42, 0.001],  // Whale
    [43, 0.0015], // Dolphin

    // Decomposers
    [50, 0.007],  // Bacteria
    [51, 0.003],  // Sea Worm
  ];
  for (const [sid, frac] of targets) {
    let count = Math.max(2, (total * frac) | 0); // at least 2 of each
    let attempts = 0;
    while (count > 0 && attempts < total * 2) {
      const idx = (Math.random() * total) | 0;
      if (species[idx] === 0) {
        species[idx] = sid;
        hunger[idx] = 0;
        age[idx] = 0;
        count--;
      }
      attempts++;
    }
  }
  // Reset season to Spring on new seed
  currentSeason = 'Spring';
  seasonTick = 0;
}

function seedBalanced() {
  const total = gridW * gridH;
  const cw = gridW, ch = gridH;

  // --- Rock reef structures (natural-looking clusters) ---
  const rockBudget = (total * 0.03) | 0;
  let rockCount = 0;
  const numReefs = 6 + ((Math.random() * 6) | 0);
  for (let r = 0; r < numReefs && rockCount < rockBudget; r++) {
    let rx = (Math.random() * cw) | 0;
    let ry = (Math.random() * ch) | 0;
    const size = 8 + ((Math.random() * 20) | 0);
    for (let s = 0; s < size && rockCount < rockBudget; s++) {
      const idx = ry * cw + rx;
      if (species[idx] === 0) {
        species[idx] = 1; rockCount++;
      }
      // Random walk to create organic shapes
      rx = wrapX(rx + ((Math.random() * 3) | 0) - 1);
      ry = wrapY(ry + ((Math.random() * 3) | 0) - 1);
    }
  }

  // --- Coral patches near reefs ---
  for (let i = 0; i < total; i++) {
    if (species[i] !== 1) continue;
    const cx = i % cw, cy = (i / cw) | 0;
    for (const [dx, dy] of NEIGHBOURS_8) {
      const ni = wrapY(cy + dy) * cw + wrapX(cx + dx);
      if (species[ni] === 0 && Math.random() < 0.15) {
        species[ni] = 12; // Coral grows near rocks
      }
    }
  }

  // --- Current channels (2-3 flowing streams) ---
  const numStreams = 2 + ((Math.random() * 2) | 0);
  for (let s = 0; s < numStreams; s++) {
    let sx = (Math.random() * cw) | 0;
    let sy = (Math.random() * ch) | 0;
    const dir = 1 + ((Math.random() * 4) | 0); // 1-4
    const cd = CARDINAL[dir - 1];
    const len = 20 + ((Math.random() * 40) | 0);
    for (let step = 0; step < len; step++) {
      // Paint a 2-wide current line
      for (let w = -1; w <= 1; w++) {
        const px = wrapX(sx + (cd[1] !== 0 ? w : 0));
        const py = wrapY(sy + (cd[0] !== 0 ? w : 0));
        currents[py * cw + px] = dir;
      }
      sx = wrapX(sx + cd[0]);
      sy = wrapY(sy + cd[1]);
      // Slight drift for natural look
      if (Math.random() < 0.15) {
        sx = wrapX(sx + ((Math.random() * 3) | 0) - 1);
        sy = wrapY(sy + ((Math.random() * 3) | 0) - 1);
      }
    }
  }

  // --- Trophic pyramid: tuned ratios for long-term stability ---
  // Large producer base, diminishing up the food chain
  const balanced = [
    // Producers — wide base
    [10, 0.100],  // Phytoplankton  (foundation)
    [11, 0.030],  // Seaweed
    // (Coral already placed near reefs above)

    // Herbivores — ~1/4 of producer biomass
    [20, 0.016],  // Shrimp  (eats phyto → needs plenty)
    [21, 0.006],  // Snail   (eats seaweed)
    [22, 0.006],  // Crab    (omnivore)
    [23, 0.003],  // Sea Urchin (eats coral — keep scarce)

    // Consumers — ~1/4 of herbivore biomass
    [30, 0.005],  // Small Fish (eats shrimp)
    [31, 0.003],  // Squid      (eats shrimp, snails)
    [32, 0.002],  // Pufferfish (eats crabs, snails)

    // Apex — small but viable
    [40, 0.002],  // Shark   (eats consumers)
    [41, 0.002],  // Octopus (eats consumers)

    // Megafauna — rare but viable
    [42, 0.001],  // Whale   (filter feeder)
    [43, 0.0015], // Dolphin (social hunter)

    // Decomposers — enough to handle death spiral
    [50, 0.008],  // Bacteria
    [51, 0.004],  // Sea Worm
  ];

  for (const [sid, frac] of balanced) {
    let count = Math.max(2, (total * frac) | 0);
    let attempts = 0;
    while (count > 0 && attempts < total * 2) {
      const idx = (Math.random() * total) | 0;
      if (species[idx] === 0) {
        species[idx] = sid;
        hunger[idx] = 0;
        age[idx] = 0;
        count--;
      }
      attempts++;
    }
  }
  // Reset season on balanced seed
  currentSeason = 'Spring';
  seasonTick = 0;
}

// Detailed biome environment seed — rich terrain + balanced ecosystem
function seedBiome() {
  const total = gridW * gridH;
  const cw = gridW, ch = gridH;
  const seed = (Math.random() * 2147483647) | 0;
  noiseSeed(seed);

  // Noise helper: sample at (x,y) with given scale
  const N = (x, y, scale) => noise2D(x / scale, y / scale);
  const F = (x, y, scale, oct) => fbm(x / scale, y / scale, oct || 5, 2.0, 0.5);

  // ====================================================================
  // 1. SEAFLOOR TOPOLOGY — noise-driven rock formations
  // ====================================================================
  // Base terrain heightmap: large-scale geological features
  const rockThresh = 0.32; // higher = less rock
  const ridgeScale = cw * 0.22; // scale of major ridges
  const detailScale = cw * 0.06; // fine rock detail

  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      // Multi-octave terrain: broad ridges + fine detail
      const broad = F(x, y, ridgeScale, 4);
      const detail = F(x + 500, y + 500, detailScale, 3) * 0.4;
      // Edge affinity: rocks more likely near top/bottom (seafloor walls)
      const edgeDist = Math.min(y, ch - 1 - y) / (ch * 0.12);
      const edgeBias = Math.max(0, 1.0 - edgeDist) * 0.45;
      const h = broad + detail + edgeBias;
      if (h > rockThresh) {
        // Probability falls off smoothly above threshold — organic edges
        const p = Math.min(1.0, (h - rockThresh) * 3.0);
        if (Math.random() < p) species[y * cw + x] = 1; // Rock
      }
    }
  }

  // Reef formations: 1-3 reef ridges using warped noise
  const numReefs = 1 + ((Math.random() * 2.5) | 0);
  for (let r = 0; r < numReefs; r++) {
    const ry0 = ch * (0.25 + Math.random() * 0.5);
    const reefAmp = ch * (0.06 + Math.random() * 0.08);
    const reefFreq = 0.02 + Math.random() * 0.03;
    const reefThick = 2 + ((Math.random() * 4) | 0);
    const offsetX = Math.random() * 1000;
    for (let x = 0; x < cw; x++) {
      // Meandering reef centerline using noise
      const centerY = ry0 + reefAmp * noise2D((x + offsetX) * reefFreq, r * 7.7);
      for (let dy = -reefThick; dy <= reefThick; dy++) {
        const wy = wrapY(Math.round(centerY + dy));
        const idx = wy * cw + x;
        // Gaps for passages and caves
        if (Math.random() < 0.12) continue;
        if (species[idx] === 0) species[idx] = 1;
      }
    }
  }

  // ====================================================================
  // 2. OCEAN CURRENTS — meandering rivers + natural gyres
  // ====================================================================
  // Flowing current streams that meander via noise displacement
  const numStreams = 4 + ((Math.random() * 4) | 0);
  for (let s = 0; s < numStreams; s++) {
    // Pick a primary flow direction and entry point
    const horizontal = Math.random() < 0.6;
    let cx0, cy0, mainDir;
    if (horizontal) {
      cx0 = 0;
      cy0 = (ch * (0.1 + Math.random() * 0.8)) | 0;
      mainDir = Math.random() < 0.5 ? 2 : 4; // E or W
    } else {
      cx0 = (cw * (0.1 + Math.random() * 0.8)) | 0;
      cy0 = 0;
      mainDir = Math.random() < 0.5 ? 3 : 1; // S or N
    }
    const cd = CARDINAL[mainDir - 1];
    const len = Math.max(cw, ch) * (0.5 + Math.random() * 0.6) | 0;
    const width = 4 + ((Math.random() * 8) | 0);
    const meander = 0.015 + Math.random() * 0.02; // noise frequency for meandering
    const amp = 6 + Math.random() * 12; // meander amplitude
    const noiseOff = Math.random() * 1000;

    for (let step = 0; step < len; step++) {
      // Displace perpendicular to flow using noise
      const perpNoise = noise2D((step + noiseOff) * meander, s * 13.3) * amp;
      for (let w = -width; w <= width; w++) {
        // Feathered edges: weaker current at edges
        const edgeFade = 1.0 - Math.abs(w) / (width + 1);
        if (Math.random() > edgeFade * 0.9 + 0.1) continue;
        let px, py;
        if (horizontal) {
          px = wrapX(cx0 + step * cd[0]);
          py = wrapY(Math.round(cy0 + step * cd[1] + perpNoise + w));
        } else {
          px = wrapX(Math.round(cx0 + step * cd[0] + perpNoise + w));
          py = wrapY(cy0 + step * cd[1]);
        }
        currents[py * cw + px] = mainDir;
      }
    }
  }

  // Natural gyres: elliptical with noise-perturbed boundaries
  const numGyres = 2 + ((Math.random() * 2) | 0);
  for (let g = 0; g < numGyres; g++) {
    const gx = (cw * (0.2 + Math.random() * 0.6)) | 0;
    const gy = (ch * (0.2 + Math.random() * 0.6)) | 0;
    const rx = 18 + ((Math.random() * 30) | 0);
    const ry = 14 + ((Math.random() * 25) | 0);
    const thick = 3 + ((Math.random() * 4) | 0);
    const cw2 = Math.random() < 0.5 ? 1 : -1; // clockwise or counter
    const noiseOff = Math.random() * 1000;

    for (let dy = -(ry + thick + 3); dy <= ry + thick + 3; dy++) {
      for (let dx = -(rx + thick + 3); dx <= rx + thick + 3; dx++) {
        const normDist = Math.sqrt((dx / rx) * (dx / rx) + (dy / ry) * (dy / ry));
        // Noise-perturbed boundary
        const nPerturb = noise2D((dx + noiseOff) * 0.08, (dy + noiseOff) * 0.08) * 0.15;
        const innerEdge = 1.0 - (thick / Math.max(rx, ry)) + nPerturb;
        const outerEdge = 1.0 + (thick / Math.max(rx, ry)) + nPerturb;
        if (normDist < innerEdge || normDist > outerEdge) continue;
        const wx = wrapX(gx + dx), wy = wrapY(gy + dy);
        // Tangent direction for circular flow
        const angle = Math.atan2(dy, dx);
        const tang = angle + cw2 * Math.PI / 2;
        const tdx = Math.cos(tang), tdy = Math.sin(tang);
        let dir;
        if (Math.abs(tdx) > Math.abs(tdy)) dir = tdx > 0 ? 2 : 4;
        else dir = tdy > 0 ? 3 : 1;
        currents[wy * cw + wx] = dir;
      }
    }
  }

  // ====================================================================
  // 3. CORAL — grows naturally around rock formations
  // ====================================================================
  // Two-pass: first mark rock adjacency, then place with noise modulation
  const coralNoise = (x, y) => F(x + 1234, y + 5678, cw * 0.12, 3);
  for (let i = 0; i < total; i++) {
    if (species[i] !== 1) continue;
    const cx3 = i % cw, cy3 = (i / cw) | 0;
    for (const [dx, dy] of NEIGHBOURS_8) {
      const nx = wrapX(cx3 + dx), ny = wrapY(cy3 + dy);
      const ni = ny * cw + nx;
      if (species[ni] !== 0) continue;
      // Coral density modulated by noise — creates patchy reef clusters
      const cn = (coralNoise(nx, ny) + 1) * 0.5; // 0..1
      if (Math.random() < cn * 0.30) species[ni] = 12;
    }
  }
  // Extra coral in reef-favorable zones (warm shallow areas via noise)
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const idx = y * cw + x;
      if (species[idx] !== 0) continue;
      const warmZone = (F(x + 2000, y + 2000, cw * 0.18, 3) + 1) * 0.5;
      if (warmZone > 0.72 && Math.random() < 0.04) species[idx] = 12;
    }
  }

  // ====================================================================
  // 4. KELP FORESTS — noise-field growth with natural clustering
  // ====================================================================
  const kelpNoise = (x, y) => F(x + 3456, y + 7890, cw * 0.10, 4);
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const idx = y * cw + x;
      if (species[idx] !== 0) continue;
      const kn = (kelpNoise(x, y) + 1) * 0.5; // 0..1
      // Kelp grows in distinct forest patches where noise > threshold
      if (kn > 0.62) {
        // Density increases toward patch centers
        const density = (kn - 0.62) / 0.38;
        if (Math.random() < density * 0.55) species[idx] = 11;
      }
    }
  }

  // ====================================================================
  // 5. PHYTOPLANKTON — gradient bloom zones with soft edges
  // ====================================================================
  const plankNoise = (x, y) => F(x + 6789, y + 1234, cw * 0.16, 5);
  // Also influenced by currents (nutrients concentrate along current paths)
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const idx = y * cw + x;
      if (species[idx] !== 0) continue;
      let pn = (plankNoise(x, y) + 1) * 0.5; // 0..1
      // Boost near currents (upwelling nutrients)
      if (currents[idx] > 0) pn += 0.12;
      // Avoid rock-heavy areas
      if (pn > 0.52) {
        const density = (pn - 0.52) / 0.48;
        if (Math.random() < density * 0.45) species[idx] = 10;
      }
    }
  }

  // ====================================================================
  // 6. ANIMAL PLACEMENT — habitat-aware seeding
  // ====================================================================
  // Build quick lookup of nearby terrain for habitat preference
  function nearbyHas(idx, sid, radius) {
    const cx4 = idx % cw, cy4 = (idx / cw) | 0;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        if (dx === 0 && dy === 0) continue;
        const ni = wrapY(cy4 + dy) * cw + wrapX(cx4 + dx);
        if (species[ni] === sid) return true;
      }
    }
    return false;
  }

  const animalSeeds = [
    // [speciesId, fraction, habitatPreference]
    // habitatPreference: null = anywhere empty, or [nearbySid, radius, boostFactor]
    [20, 0.018, [10, 4, 3.0]],  // Shrimp near phytoplankton
    [21, 0.008, [11, 4, 3.0]],  // Snail near seaweed
    [22, 0.006, [1,  5, 2.0]],  // Crab near rocks
    [23, 0.003, [12, 4, 3.0]],  // Sea Urchin near coral
    [30, 0.008, [10, 5, 2.0]],  // Small Fish near plankton
    [31, 0.005, null],           // Squid — open water
    [32, 0.004, [12, 5, 2.0]],  // Pufferfish near reef
    [40, 0.003, null],           // Shark — open water
    [41, 0.003, [1, 5, 2.5]],   // Octopus near rocks
    [42, 0.002, null],           // Whale — open water
    [43, 0.003, null],           // Dolphin — open water
    [50, 0.010, null],           // Bacteria — everywhere
    [51, 0.005, [1, 4, 2.0]],   // Sea Worm near rocks
  ];

  for (const [sid, frac, habitat] of animalSeeds) {
    let count = Math.max(4, (total * frac) | 0);
    let attempts = 0;
    const maxAttempts = total * 3;
    while (count > 0 && attempts < maxAttempts) {
      const idx = (Math.random() * total) | 0;
      if (species[idx] !== 0) { attempts++; continue; }
      // Habitat preference: more likely to place near preferred terrain
      if (habitat) {
        const [hSid, hRad, hBoost] = habitat;
        const near = nearbyHas(idx, hSid, hRad);
        if (!near && Math.random() > 1.0 / hBoost) { attempts++; continue; }
      }
      species[idx] = sid; hunger[idx] = 0; age[idx] = 0;
      count--;
      attempts++;
    }
  }

  currentSeason = 'Spring';
  seasonTick = 0;
}

// ============================================================
// 9. BOOT
// ============================================================
(function boot() {
  // Auto-size grid to fill viewport
  const wrap = document.getElementById('canvas-wrap');
  const availW = wrap.clientWidth;
  const availH = wrap.clientHeight;
  let cw = Math.floor(availW / CELL_SIZE);
  let ch = Math.floor(availH / CELL_SIZE);
  // Enforce minimums
  cw = Math.max(MIN_GRID_PX / CELL_SIZE, cw);
  ch = Math.max(MIN_GRID_PX / CELL_SIZE, ch);
  // Enforce maximums
  cw = Math.min(MAX_GRID_PX / CELL_SIZE, cw);
  ch = Math.min(MAX_GRID_PX / CELL_SIZE, ch);

  allocGrid(cw, ch);
  initCanvas();

  // Set config inputs to current size
  document.getElementById('cfg-w').value = canvasW;
  document.getElementById('cfg-h').value = canvasH;

  initEvoStats();
  buildPalette();
  selectType(10);
  seedGrid();
  render();
  updateStats();
})();
</script>

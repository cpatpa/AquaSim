<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaSim — Pixel Ecosystem Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #04090F; color: #7EE8FA; font-family: 'Share Tech Mono', monospace; font-size: 13px; }
#app { display: flex; width: 100%; height: 100%; }

/* Left Panel */
#left-panel {
  width: 168px; min-width: 168px; max-width: 168px;
  background: #04090F; border-right: 1px solid #0C2D40;
  display: flex; flex-direction: column; overflow: hidden;
}
#left-panel h1 {
  font-family: 'Orbitron', monospace; font-weight: 600; font-size: 1.1rem;
  text-align: center; padding: 10px 0 6px; color: #00E5FF; letter-spacing: 2px;
}
.tier-label {
  font-family: 'Orbitron', monospace; font-weight: 600; font-size: 0.55rem;
  color: #0C2D40; text-transform: uppercase; padding: 6px 8px 2px; letter-spacing: 1px;
}
#species-list { flex: 1; overflow-y: auto; padding: 0 6px; }
#species-list::-webkit-scrollbar { width: 4px; }
#species-list::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 2px; }
.sp-btn {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 4px 6px; margin: 2px 0; border: 1px solid transparent;
  background: transparent; color: #7EE8FA; font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem; cursor: pointer; border-radius: 3px; text-align: left;
}
.sp-btn:hover { border-color: #0C2D40; }
.sp-btn.active { border-color: #00E5FF; background: rgba(0,229,255,0.06); }
.sp-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
#brush-area {
  padding: 8px 10px; border-top: 1px solid #0C2D40;
}
#brush-area label { font-size: 0.6rem; display: block; margin-bottom: 4px; }
#brush-slider { width: 100%; accent-color: #00E5FF; }
#brush-val { font-size: 0.6rem; color: #00E5FF; }

/* Centre column */
#centre { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
#canvas-wrap { flex: 1; overflow: auto; position: relative; background: #060E16; }
#canvas-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
#canvas-wrap::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 3px; }
canvas { cursor: crosshair; display: block; }

/* Bottom Bar */
#bottom-bar {
  height: 50px; min-height: 50px; display: flex; align-items: center;
  padding: 0 10px; gap: 6px; background: #04090F; border-top: 1px solid #0C2D40;
}
#bottom-bar button {
  font-family: 'Share Tech Mono', monospace; font-size: 0.65rem;
  padding: 4px 10px; border: 1px solid #0C2D40; background: #0A1622;
  color: #7EE8FA; cursor: pointer; border-radius: 3px; white-space: nowrap;
}
#bottom-bar button:hover { border-color: #00E5FF; }
#bottom-bar button.active-speed { border-color: #00E5FF; background: rgba(0,229,255,0.12); color: #00E5FF; }
#btn-clear { color: #FF6B6B !important; border-color: #FF6B6B !important; }
#btn-clear:hover { background: rgba(255,107,107,0.12) !important; }
#btn-balance { color: #00FF88 !important; border-color: #00FF88 !important; }
#btn-balance:hover { background: rgba(0,255,136,0.12) !important; }
#btn-biome { color: #44AAFF !important; border-color: #44AAFF !important; }
#btn-biome:hover { background: rgba(68,170,255,0.12) !important; }
.divider { width: 1px; height: 24px; background: #0C2D40; margin: 0 4px; }
#gen-counter { margin-left: auto; font-size: 0.65rem; color: #00E5FF; white-space: nowrap; }
#info-text { font-size: 0.55rem; color: #4A7A8A; margin-left: 10px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Right Panel */
#right-panel {
  width: 200px; min-width: 200px; max-width: 200px;
  background: #04090F; border-left: 1px solid #0C2D40;
  display: flex; flex-direction: column; overflow: hidden;
}
#right-panel h2 {
  font-family: 'Orbitron', monospace; font-weight: 600; font-size: 0.6rem;
  text-align: center; padding: 10px 0 6px; color: #00E5FF; letter-spacing: 1px;
}
#stats-list { flex: 1; overflow-y: auto; padding: 0 8px; }
#stats-list::-webkit-scrollbar { width: 4px; }
#stats-list::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 2px; }
.stat-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 0.6rem; cursor: pointer; border-radius: 2px; padding: 2px 4px; }
.stat-row:hover { background: rgba(0,229,255,0.08); }
.stat-name { opacity: 0.85; }
.stat-count { color: #00E5FF; }
#bio-score {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 4px 10px 6px; border-bottom: 1px solid #0C2D40; flex-shrink: 0;
}
#bio-score-label {
  font-family: 'Orbitron', monospace; font-size: 0.5rem;
  color: #4A7A8A; letter-spacing: 1px;
}
#bio-score-value {
  font-family: 'Orbitron', monospace; font-size: 0.85rem;
  font-weight: 600; color: #00FF88; transition: color 0.3s;
}
#pop-graph-wrap {
  flex-shrink: 0; padding: 2px 4px 4px; border-top: 1px solid #0C2D40;
}
#pop-graph { display: block; width: 100%; height: 80px; }
#grid-config { padding: 8px; border-top: 1px solid #0C2D40; }
#grid-config label { font-size: 0.55rem; display: block; margin-bottom: 2px; }
#grid-config input {
  width: 52px; background: #0A1622; border: 1px solid #0C2D40; color: #7EE8FA;
  font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; padding: 2px 4px;
  border-radius: 2px; margin-right: 4px;
}
#btn-apply {
  font-family: 'Share Tech Mono', monospace; font-size: 0.55rem;
  padding: 3px 8px; border: 1px solid #0C2D40; background: #0A1622;
  color: #7EE8FA; cursor: pointer; border-radius: 3px; margin-top: 4px;
}
#btn-apply:hover { border-color: #00E5FF; }
#btn-evo { color: #DDBB44 !important; border-color: #DDBB44 !important; }
#btn-evo:hover { background: rgba(221,187,68,0.12) !important; }
#btn-evo.evo-active { border-color: #00FF88 !important; color: #00FF88 !important; background: rgba(0,255,136,0.12) !important; }
#btn-mutate { color: #FF44FF !important; border-color: #FF44FF !important; }
#btn-mutate:hover { background: rgba(255,68,255,0.12) !important; }
#evo-log { padding: 0 8px 8px; overflow-y: auto; min-height: 60px; height: 220px; flex-shrink: 0; }
#evo-log::-webkit-scrollbar { width: 4px; }
#evo-log::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 2px; }
#evo-log h2 {
  font-family: 'Orbitron', monospace; font-weight: 600; font-size: 0.55rem;
  text-align: center; padding: 6px 0 4px; color: #DDBB44; letter-spacing: 1px;
}
.evo-entry { font-size: 0.6rem; color: #DDBB44; padding: 2px 0; opacity: 0.9; line-height: 1.4; word-wrap: break-word; }
#evo-resize {
  height: 5px; cursor: ns-resize; background: transparent; border-top: 1px solid #0C2D40;
  flex-shrink: 0; transition: background 0.15s;
}
#evo-resize:hover { background: rgba(0,229,255,0.15); }
#cell-tooltip {
  position: fixed; pointer-events: none; z-index: 999;
  background: rgba(4,9,15,0.94); border: 1px solid #0C2D40; border-radius: 4px;
  padding: 6px 8px; font-size: 0.6rem; color: #7EE8FA; display: none;
  max-width: 200px; line-height: 1.4; backdrop-filter: blur(4px);
}
#cell-tooltip .tt-name { font-weight: bold; color: #00E5FF; font-size: 0.65rem; }
#cell-tooltip .tt-stat { color: #4A7A8A; }
#cell-tooltip .tt-trait { color: #DDBB44; font-style: italic; }
.sp-btn.disaster { color: #FF6B6B; }
.sp-btn.disaster:hover { border-color: #FF6B6B; }
.sp-btn.disaster.active { border-color: #FF4400; background: rgba(255,68,0,0.1); }

/* Evolution Tree Popup */
#evo-tree-popup {
  display: none; position: fixed; z-index: 1000;
  background: rgba(4,9,15,0.96); border: 1px solid #DDBB44; border-radius: 6px;
  padding: 12px 14px; min-width: 220px; max-width: 340px;
  backdrop-filter: blur(6px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#evo-tree-popup .etp-title {
  font-family: 'Orbitron', monospace; font-size: 0.65rem; color: #DDBB44;
  margin-bottom: 8px; letter-spacing: 1px; text-align: center;
}
#evo-tree-popup .etp-close {
  position: absolute; top: 4px; right: 8px; cursor: pointer;
  color: #FF6B6B; font-size: 0.75rem; background: none; border: none;
  font-family: 'Share Tech Mono', monospace;
}
#evo-tree-popup .etp-close:hover { color: #FF4400; }
#evo-tree-popup .etp-node {
  display: flex; align-items: center; gap: 6px; padding: 3px 0;
  font-size: 0.6rem; color: #7EE8FA; line-height: 1.3;
}
#evo-tree-popup .etp-node.etp-current { color: #00FF88; font-weight: bold; }
#evo-tree-popup .etp-branch { color: #0C2D40; margin-right: 2px; }
#evo-tree-popup .etp-swatch {
  width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
  display: inline-block; border: 1px solid rgba(255,255,255,0.15);
}
#evo-tree-popup .etp-traits { font-size: 0.55rem; color: #DDBB44; font-style: italic; margin-left: 18px; }
#evo-tree-popup .etp-stats { font-size: 0.55rem; color: #4A7A8A; margin-left: 18px; }

/* Settings Panel */
#btn-settings { color: #AABBCC !important; border-color: #AABBCC !important; }
#btn-settings:hover { background: rgba(170,187,204,0.12) !important; }
#settings-panel {
  display: none; position: fixed; z-index: 1001;
  bottom: 60px; right: 210px;
  background: rgba(4,9,15,0.97); border: 1px solid #0C2D40; border-radius: 6px;
  padding: 14px 16px; min-width: 240px;
  backdrop-filter: blur(6px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#settings-panel.visible { display: block; }
#settings-panel h3 {
  font-family: 'Orbitron', monospace; font-weight: 600; font-size: 0.65rem;
  color: #00E5FF; letter-spacing: 1px; margin-bottom: 10px; text-align: center;
}
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; font-size: 0.65rem; color: #7EE8FA;
}
.settings-row label { flex: 1; }
.settings-row input[type="range"] {
  width: 100px; accent-color: #00E5FF;
}
.settings-row .settings-val {
  width: 32px; text-align: right; color: #00E5FF; font-size: 0.65rem;
}
.settings-close {
  position: absolute; top: 4px; right: 8px; cursor: pointer;
  color: #FF6B6B; font-size: 0.75rem; background: none; border: none;
  font-family: 'Share Tech Mono', monospace;
}
.settings-close:hover { color: #FF4400; }

/* Species Info Panel */
#species-info-panel {
  display: none; position: fixed; z-index: 1002;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(4,9,15,0.97); border: 1px solid #00E5FF; border-radius: 8px;
  padding: 0; width: 420px; max-height: 85vh; overflow-y: auto;
  backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.7);
}
#species-info-panel::-webkit-scrollbar { width: 4px; }
#species-info-panel::-webkit-scrollbar-thumb { background: #0C2D40; border-radius: 2px; }
#species-info-panel.visible { display: block; }
.sip-header {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border-bottom: 1px solid #0C2D40;
}
.sip-portrait { width: 160px; height: 160px; border-radius: 6px; border: 1px solid #0C2D40; image-rendering: pixelated; flex-shrink: 0; }
.sip-title-area { flex: 1; }
.sip-name { font-family: 'Orbitron', monospace; font-size: 0.8rem; color: #00E5FF; letter-spacing: 1px; margin-bottom: 4px; }
.sip-tier { font-size: 0.6rem; color: #4A7A8A; text-transform: uppercase; }
.sip-pop { font-size: 0.65rem; color: #00FF88; margin-top: 2px; }
.sip-close {
  position: absolute; top: 8px; right: 12px; cursor: pointer;
  color: #FF6B6B; font-size: 0.85rem; background: none; border: none;
  font-family: 'Share Tech Mono', monospace;
}
.sip-close:hover { color: #FF4400; }
.sip-section { padding: 10px 16px; border-bottom: 1px solid #0C2D40; }
.sip-section-title { font-family: 'Orbitron', monospace; font-size: 0.55rem; color: #4A7A8A; letter-spacing: 1px; margin-bottom: 6px; }
.sip-gene-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 0.6rem; }
.sip-gene-label { width: 60px; color: #7EE8FA; }
.sip-gene-bar { flex: 1; height: 8px; background: #0A1622; border-radius: 2px; overflow: hidden; position: relative; }
.sip-gene-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.sip-gene-val { width: 32px; text-align: right; color: #4A7A8A; font-size: 0.55rem; }
.sip-traits { display: flex; flex-wrap: wrap; gap: 4px; }
.sip-trait-badge { padding: 2px 6px; border-radius: 3px; font-size: 0.55rem; background: rgba(221,187,68,0.15); color: #DDBB44; border: 1px solid rgba(221,187,68,0.3); }
.sip-trait-strength { color: #4A7A8A; font-size: 0.5rem; margin-left: 2px; }
.sip-diet-list { font-size: 0.6rem; color: #7EE8FA; }
.sip-diet-item { display: inline-flex; align-items: center; gap: 3px; margin: 2px 4px 2px 0; }
.sip-diet-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.sip-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 0.6rem; }
.sip-stat-label { color: #4A7A8A; }
.sip-stat-val { color: #00E5FF; text-align: right; }
.sip-lineage { font-size: 0.6rem; overflow-x: auto; max-height: 300px; overflow-y: auto; }
.sip-tree-node { display: flex; align-items: center; gap: 3px; padding: 1px 0; color: #7EE8FA; white-space: nowrap; cursor: pointer; }
.sip-tree-node:hover { color: #FFFFFF; }
.sip-tree-node.sip-current { color: #00FF88; font-weight: bold; }
.sip-tree-node.sip-extinct { color: #4A6A7A; font-style: italic; }
.sip-tree-node.sip-extinct:hover { color: #7A9AAA; }
.sip-tree-prefix { color: #0E4A5A; font-family: monospace; user-select: none; }
.sip-lineage-swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
.sip-tree-pop { color: #4A7A8A; font-size: 0.5rem; margin-left: 2px; }
.sip-tree-tier { color: #DDBB44; font-size: 0.5rem; margin-left: 2px; }
.sip-desc { font-size: 0.55rem; color: #4A7A8A; font-style: italic; padding: 8px 16px; }
</style>
</head>
<body>
<div id="app">
  <!-- LEFT PANEL -->
  <div id="left-panel">
    <h1>AQUASIM</h1>
    <div id="species-list"></div>
    <div id="brush-area">
      <label>Brush Size: <span id="brush-val">3</span></label>
      <input type="range" id="brush-slider" min="1" max="12" value="3">
    </div>
  </div>

  <!-- CENTRE -->
  <div id="centre">
    <div id="canvas-wrap">
      <canvas id="grid-canvas"></canvas>
    </div>
    <div id="bottom-bar">
      <button id="btn-play">▶ PLAY</button>
      <button id="btn-step">⏭ STEP</button>
      <div class="divider"></div>
      <button class="speed-btn" data-speed="500">½×</button>
      <button class="speed-btn active-speed" data-speed="100">1×</button>
      <button class="speed-btn" data-speed="50">2×</button>
      <button class="speed-btn" data-speed="25">4×</button>
      <button class="speed-btn" data-speed="8">MAX</button>
      <div class="divider"></div>
      <button id="btn-evo">⧬ EVO</button>
      <button id="btn-mutate">☢ MUTATE</button>
      <div class="divider"></div>
      <button id="btn-seed">⚡ SEED</button>
      <button id="btn-balance">☯ BALANCE</button>
      <button id="btn-biome">🌊 BIOME</button>
      <button id="btn-clear">✕ CLEAR</button>
      <span id="season-display" style="font-size:0.65rem;color:#88FF88;white-space:nowrap;">Spring</span>
      <span id="gen-counter">GEN 0</span>
      <span id="info-text"></span>
      <div class="divider"></div>
      <button id="btn-settings">⚙ UI</button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-panel">
    <button class="settings-close" id="settings-close-btn">✕</button>
    <h3>DISPLAY SETTINGS</h3>
    <div class="settings-row">
      <label>UI Scale</label>
      <input type="range" id="ui-scale-slider" min="80" max="180" step="10" value="180">
      <span class="settings-val" id="ui-scale-val">180%</span>
    </div>
    <div class="settings-row">
      <label>Panel Width</label>
      <input type="range" id="panel-width-slider" min="160" max="360" step="20" value="200">
      <span class="settings-val" id="panel-width-val">200</span>
    </div>
    <div class="settings-row">
      <label>Left Panel</label>
      <input type="range" id="left-panel-slider" min="140" max="280" step="20" value="168">
      <span class="settings-val" id="left-panel-val">168</span>
    </div>
    <div class="settings-row">
      <label>Bar Height</label>
      <input type="range" id="bar-height-slider" min="40" max="80" step="5" value="50">
      <span class="settings-val" id="bar-height-val">50</span>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <h2>POPULATION</h2>
    <div id="bio-score" title="Biodiversity score (0-100) based on Shannon diversity index: measures species richness, population evenness, trait variety, and trophic tier coverage across the ecosystem.">
      <span id="bio-score-label">BIODIVERSITY</span>
      <span id="bio-score-value">0</span>
    </div>
    <div id="stats-list"></div>
    <div id="pop-graph-wrap">
      <canvas id="pop-graph"></canvas>
    </div>
    <div id="evo-resize"></div>
    <div id="evo-log">
      <h2>EVOLUTION</h2>
      <div id="evo-entries"></div>
    </div>
    <div id="grid-config">
      <label>Grid Size (px)</label>
      <div style="display:flex;align-items:center;gap:2px;margin-top:2px;">
        <input id="cfg-w" type="number" min="480" max="3200" step="8" placeholder="W">
        <span style="font-size:0.55rem;">×</span>
        <input id="cfg-h" type="number" min="480" max="3200" step="8" placeholder="H">
      </div>
      <button id="btn-apply">APPLY</button>
    </div>
  </div>
</div>
<div id="cell-tooltip"></div>
<div id="evo-tree-popup">
  <div class="etp-title">EVOLUTION TREE</div>
  <button class="etp-close" id="etp-close-btn">✕</button>
  <div id="etp-content"></div>
</div>
<div id="species-info-panel">
  <button class="sip-close" id="sip-close-btn">&times;</button>
  <div id="sip-body"></div>
</div>

<script>
// ============================================================
// 1. CONSTANTS & SPECIES DEFINITIONS
// ============================================================
const CELL_SIZE = 8;
const GRID_GAP = 1; // pixels of background visible between cells
const DEAD_DECAY_AGE = 14;
const DEAD_FOSSILIZE_AGE = 120; // dead cells become rock after this many ticks if uneaten
const OIL_SPREAD_RATE = 0.06;
const OIL_DECAY_AGE = 40;
const ICE_THAW_AGE = 60;        // ice melts after this many ticks
const TOXIC_BLOOM_SPREAD = 0.08; // spread chance per tick
const TOXIC_BLOOM_DECAY = 50;   // ticks before toxic bloom fades
const LAVA_COOL_AGE = 40;       // lava cools into rock after this many ticks
const LAVA_SPREAD_MAX_AGE = 20; // lava only spreads while younger than this
const LAVA_HEAT_RADIUS = 2;     // radiant heat kills creatures within this range
const activeVents = [];          // ongoing eruption sites [{x, y, ticksLeft, radius, angles}]
const HUNGER_RESTORE_FRACTION = 0.65;
// Metabolic scaling: chance of hunger incrementing per tick (lower = slower metabolism)
const METABOLISM = { herbivore: 1.0, consumer: 0.8, apex: 0.5, megafauna: 0.35, decomposer: 0.9 };
// Hunger restored per meal scales with tier (apex/mega get more per kill)
const HUNGER_RESTORE_BY_TIER = { herbivore: 0.65, consumer: 0.70, apex: 0.85, megafauna: 0.90, decomposer: 0.65 };
const MIN_GRID_PX = 480;
const MAX_GRID_PX = 3200;

const SPECIES = {
  0:  { name: 'Empty',          color: '#060E16', tier: 'none',        layer: -1 },
  1:  { name: 'Rock',           color: '#4A5A6A', tier: 'environment', layer: 0, desc: 'Impassable terrain blocker' },
  2:  { name: 'Current',        color: '#003D88', tier: 'environment', layer: -1, desc: 'Drag to paint — sweeps creatures in drag direction' },
  3:  { name: 'Dead',           color: '#8B7355', tier: 'transient',   layer: -1, desc: 'Decays to empty after 14 ticks' },
  4:  { name: 'Oil',            color: '#2A1800', tier: 'transient',   layer: 3, desc: 'Toxic sludge — spreads, kills life, then decays' },
  5:  { name: 'Ice',            color: '#AADDFF', tier: 'transient',   layer: -1, desc: 'Frozen water — blocks movement, thaws over time' },

// --- Simplex-like 2D noise for natural terrain generation ---
const _noiseP = new Uint8Array(512);
function noiseSeed(s) {
  const perm = new Uint8Array(256);
  for (let i = 0; i < 256; i++) perm[i] = i;
  // Fisher-Yates with seeded PRNG
  let t = s | 0;
  for (let i = 255; i > 0; i--) {
    t = (t * 16807 + 0) & 0x7fffffff;
    const j = t % (i + 1);
    const tmp = perm[i]; perm[i] = perm[j]; perm[j] = tmp;
  }
  for (let i = 0; i < 512; i++) _noiseP[i] = perm[i & 255];
}
function _grad2(hash, x, y) {
  const h = hash & 7;
  const u = h < 4 ? x : y, v = h < 4 ? y : x;
  return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
}
function noise2D(x, y) {
  const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  const s = (x + y) * F2;
  const i = Math.floor(x + s), j = Math.floor(y + s);
  const t = (i + j) * G2;
  const X0 = i - t, Y0 = j - t;
  const x0 = x - X0, y0 = y - Y0;
  const i1 = x0 > y0 ? 1 : 0, j1 = x0 > y0 ? 0 : 1;
  const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
  const x2 = x0 - 1.0 + 2.0 * G2, y2 = y0 - 1.0 + 2.0 * G2;
  const ii = i & 255, jj = j & 255;
  let n0 = 0, n1 = 0, n2 = 0;
  let t0 = 0.5 - x0 * x0 - y0 * y0;
  if (t0 > 0) { t0 *= t0; n0 = t0 * t0 * _grad2(_noiseP[ii + _noiseP[jj]], x0, y0); }
  let t1 = 0.5 - x1 * x1 - y1 * y1;
  if (t1 > 0) { t1 *= t1; n1 = t1 * t1 * _grad2(_noiseP[ii + i1 + _noiseP[jj + j1]], x1, y1); }
  let t2 = 0.5 - x2 * x2 - y2 * y2;
  if (t2 > 0) { t2 *= t2; n2 = t2 * t2 * _grad2(_noiseP[ii + 1 + _noiseP[jj + 1]], x2, y2); }
  return 70.0 * (n0 + n1 + n2); // returns -1..1
}
// Fractal Brownian Motion — layered noise for natural textures
function fbm(x, y, octaves, lacunarity, gain) {
  let sum = 0, amp = 1, freq = 1, max = 0;
  for (let o = 0; o < octaves; o++) {
    sum += amp * noise2D(x * freq, y * freq);
    max += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return sum / max; // normalized -1..1
}

  schooling:   { genes: { o: 0.65, v: 0.40 } },
  territorial: { genes: { p: 0.55 }, anti: { o: 0.30 } },
  maternal:    { genes: { o: 0.50, v: 0.45 } },
  biofilm:     { genes: { o: 0.50, a: 0.35 } },
  allelopathy: { genes: { p: 0.45 }, anti: { a: 0.50 } },
  spore:       { genes: { v: 0.60, s: 0.30 } },
  poddefense:  { genes: { o: 0.65, a: 0.45 } },
};

const GENE_NAME_POOLS = {
  v: ['Prolific', 'Thriving', 'Fecund', 'Blooming', 'Verdant'],
  s: ['Swift', 'Darting', 'Fleet', 'Agile', 'Racing'],
  f: ['Hardy', 'Stalwart', 'Ironclad', 'Enduring', 'Rugged'],
  a: ['Plated', 'Spiny', 'Shielded', 'Thorned', 'Mailed'],
  p: ['Fierce', 'Razor', 'Fanged', 'Savage', 'Vicious'],
  o: ['Swarming', 'Herding', 'Colonial', 'Gregarious', 'Social'],
};
const NICHE_SHIFT_NAMES = {
  consumer: ['Hunter', 'Predatory', 'Prowling', 'Raptor'],
  apex: ['Alpha', 'Apex', 'Dominant', 'Supreme'],
  megafauna: ['Titan', 'Giant', 'Colossal', 'Leviathan'],
  herbivore: ['Grazer', 'Foraging', 'Browsing', 'Pastoral'],
};
const DIVERGENT_NAMES = {
  coldadapt: 'Frost', warmadapt: 'Sun', nocturnal: 'Night', diurnal: 'Day',
  camouflage: 'Shadow', bioluminesc: 'Glowing', mimicry: 'Mimic',
  shell: 'Shelled', softshell: 'Soft', armored: 'Armoured',
  dwarfism: 'Dwarf', gigantism: 'Giant', ambush: 'Lurking', stalker: 'Stalking',
  thorns: 'Thorned', allelopathy: 'Chemical', deeproot: 'Rooted',
  regrowth: 'Budding', nitrofix: 'Nitrogen', packhunter: 'Pack', trapjaw: 'Jaw',
  inkcloud: 'Ink', poddefense: 'Pod',
};

// Seasonality constants
const SEASON_LENGTH = 80;          // ticks per season
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const SEASON_COLORS = { Spring: '#88FF88', Summer: '#FFDD44', Autumn: '#FF8844', Winter: '#88CCFF' };
// Seasonal modifiers: [breedMult, hungerMult, moveMult, producerBreedMult]
const SEASON_MODS = {
  Spring: [1.3, 0.9, 1.0, 1.5],   // bloom season — producers flourish, breeding up
  Summer: [1.1, 1.0, 1.1, 1.0],   // warm and active — slightly faster everything
  Autumn: [0.8, 1.2, 0.9, 0.7],   // declining — harder to breed, hungrier
  Winter: [0.5, 1.4, 0.7, 0.4],   // harsh — major slowdown, starvation pressure
};
let currentSeason = 'Spring';
let seasonTick = 0;  // ticks within current season

// Niche shifting: animals can change ecological tier under sustained pressure
const NICHE_SHIFT_MIN_DEPTH   = 2;    // must be at least this many speciations deep
const NICHE_SHIFT_MIN_DRIFT   = 0.45; // stats must have drifted 45%+ from baseline
const NICHE_SHIFT_CHANCE      = 0.12; // chance per eligible species per evo cycle
// Tier promotion map: which tier can shift into which (only upward pressure shifts)
const TIER_PROMOTE = { herbivore: 'consumer', consumer: 'apex', decomposer: 'herbivore', apex: 'megafauna' };
// Extended promotion: cross-tier jumps allowed when target niche is vacant
const TIER_PROMOTE_EXTENDED = {
  producer:   ['herbivore'],
  herbivore:  ['consumer', 'apex'],
  consumer:   ['apex', 'megafauna'],
  decomposer: ['herbivore', 'consumer'],
  apex:       ['megafauna'],
};
// Convergent evolution: empty niche attraction thresholds
const EMPTY_NICHE_THRESHOLD   = 0.03; // tier < 3% of total living = "empty"
const EMPTY_NICHE_SHIFT_BOOST = 0.40; // boosted shift chance for empty niches
const EMPTY_NICHE_MIN_DRIFT   = 0.08; // reduced divergence for empty niches
// Self-predation: evolved variants can prey on siblings/parent in same lineage
const SELF_PREDATION_CHANCE = 0.18;   // chance per evo cycle per eligible variant

// Population graph constants
const GRAPH_HISTORY_MAX = 200;
const GRAPH_RECORD_INTERVAL = 2;
let graphHistory = [];

// Tier list for biodiversity scoring (excludes 'none', 'environment', 'transient')
const BIO_TIERS = ['producer', 'herbivore', 'consumer', 'apex', 'megafauna', 'decomposer'];

// Living species IDs (everything that evolves)
const LIVING_IDS = [];
for (const id in SPECIES) {
  const sp = SPECIES[id];
  if (sp.breedRate !== undefined) LIVING_IDS.push(parseInt(id));
}

// Mutable evolution stats — deep copy of relevant SPECIES fields
let evoStats = {};
let evolveEnabled = false;
let popHistory = [];   // array of { [sid]: count } snapshots
let evoLog = [];       // recent evolution event strings
const EVO_LOG_MAX = 30;
let evoCooldown = 0;   // gens remaining before next evo can fire
let lastEvoGen  = 0;   // generation of last evo event
let radiationBoost = 0; // evo events remaining with boosted mutation (post-disaster adaptive radiation)
let prevLivingCount = 0; // living cell count last gen, for detecting mass death

function initEvoStats() {
  // Clean up all dynamic species (active and extinct)
  for (const id in SPECIES) {
    const numId = parseInt(id);
    if (numId >= 100) { delete SPECIES[numId]; delete COLOR_RGB[numId]; removeFromTierGroups(numId); }
  }
  for (const did of dynamicSpeciesIds) {
    const li = LIVING_IDS.indexOf(did);
    if (li !== -1) LIVING_IDS.splice(li, 1);
  }
  dynamicSpeciesIds = [];
  nextSpeciesId = 100;

  evoStats = {};
  for (const id of LIVING_IDS) {
    const sp = SPECIES[id];
    const tierGenes = TIER_DEFAULT_GENES[sp.tier] || TIER_DEFAULT_GENES.herbivore;
    const noise = (seed) => {
      const x = Math.sin(seed * 127.1 + id * 311.7) * 43758.5453;
      return (x - Math.floor(x)) * 0.08 - 0.04;
    };
    const genes = {};
    const geneVar = {};
    for (let gi = 0; gi < GENE_KEYS.length; gi++) {
      const g = GENE_KEYS[gi];
      genes[g] = clamp(tierGenes[g] + noise(gi + 1), 0.05, 0.95);
      geneVar[g] = 0.14;
    }
    evoStats[id] = {
      breedRate: sp.breedRate,
      moveRate:  sp.moveRate || 0,
      hungerMax: sp.hungerMax || 0,
      eats:      sp.eats ? sp.eats.slice() : [],
      traits:    [],
      traitAge:  {},
      traitStrengths: {},
      genes: genes,
      geneVar: geneVar,
      baseGenes: { ...genes },
    };
  }
  popHistory = [];
  evoLog = [];
  evoCooldown = 0;
  lastEvoGen = 0;
  radiationBoost = 0;
  prevLivingCount = 0;
}

// Get effective stat for a species (evolved if evo enabled, else base)
function evo(sid) {
  return evolveEnabled && evoStats[sid] ? evoStats[sid] : SPECIES[sid];
}

function recordPopSnapshot() {
  const counts = {};
  const total = gridW * gridH;
  for (let i = 0; i < total; i++) {
    const s = species[i];
    if (s !== 0) counts[s] = (counts[s] || 0) + 1;
  }
  popHistory.push(counts);
  if (popHistory.length > EVO_HISTORY_LEN) popHistory.shift();
  return counts;
}

function addEvoEvent(msg) {
  evoLog.unshift('G' + generation + ': ' + msg);
  if (evoLog.length > EVO_LOG_MAX) evoLog.pop();
}

function gaussRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function geneDivergence(genesA, genesB) {
  let sum = 0;
  for (const g of GENE_KEYS) {
    const d = (genesA[g] || 0.5) - (genesB[g] || 0.5);
    sum += d * d;
  }
  return Math.sqrt(sum);
}

function deriveStats(id) {
  const sp = SPECIES[id];
  const es = evoStats[id];
  if (!es || !es.genes) return;
  const g = es.genes;
  es.breedRate = sp.breedRate * (0.5 + g.v);
  if (sp.moveRate) es.moveRate = clamp(sp.moveRate * (0.5 + g.s), 0.02, 0.98);
  if (sp.hungerMax) es.hungerMax = clamp(Math.round(sp.hungerMax * (0.5 + g.f)), 6, 80);
}

function expressTraits(id) {
  const sp = SPECIES[id];
  const es = evoStats[id];
  if (!es || !es.genes) return;
  const genes = es.genes;
  const expressed = [];

  for (const tk of TRAIT_KEYS) {
    if (!TRAITS[tk].eligible(sp.tier)) continue;
    const req = TRAIT_GENE_REQS[tk];
    if (!req) continue;
    let qualifies = true;
    let totalExcess = 0;
    let reqCount = 0;
    if (req.genes) {
      for (const g in req.genes) {
        if (genes[g] < req.genes[g]) { qualifies = false; break; }
        totalExcess += (genes[g] - req.genes[g]) / Math.max(0.01, 1.0 - req.genes[g]);
        reqCount++;
      }
    }
    if (qualifies && req.anti) {
      for (const g in req.anti) {
        if (genes[g] >= req.anti[g]) { qualifies = false; break; }
      }
    }
    if (qualifies) {
      const strength = reqCount > 0 ? Math.min(1.5, 1 + totalExcess / reqCount) : 1;
      expressed.push({ trait: tk, strength: strength });
    }
  }

  expressed.sort((a, b) => b.strength - a.strength);
  const newTraits = expressed.slice(0, MAX_TRAITS_PER_SPECIES).map(e => e.trait);
  const oldTraits = es.traits || [];
  for (const t of newTraits) {
    if (oldTraits.indexOf(t) === -1) addEvoEvent(sp.name + ' expressed ' + TRAITS[t].name);
  }
  for (const t of oldTraits) {
    if (newTraits.indexOf(t) === -1) addEvoEvent(sp.name + ' lost ' + TRAITS[t].name);
  }
  es.traits = newTraits;
  es.traitStrengths = {};
  for (const e of expressed.slice(0, MAX_TRAITS_PER_SPECIES)) {
    es.traitStrengths[e.trait] = e.strength;
  }
}

function traitStr(sid, trait) {
  if (!evolveEnabled) return 1;
  const es = evoStats[sid];
  return (es && es.traitStrengths && es.traitStrengths[trait]) || 1;
}

function generateSpeciesName(parentId, genes, context, extraData) {
  const sp = SPECIES[parentId];
  const rootId = sp.rootAncestor || parentId;
  const rootSp = SPECIES[rootId];
  const rootName = rootSp ? rootSp.name : sp.name;
  const existingNames = new Set(LIVING_IDS.map(id => SPECIES[id] ? SPECIES[id].name : ''));
  let adj = '';
  if (context === 'niche' && extraData && NICHE_SHIFT_NAMES[extraData]) {
    const pool = NICHE_SHIFT_NAMES[extraData];
    adj = pool[(Math.random() * pool.length) | 0];
  } else if (context === 'divergent' && extraData && DIVERGENT_NAMES[extraData]) {
    adj = DIVERGENT_NAMES[extraData];
  } else {
    const parentGenes = evoStats[parentId] ? evoStats[parentId].genes : null;
    let maxDrift = 0, maxGene = 'v';
    if (parentGenes) {
      for (const g of GENE_KEYS) {
        const drift = Math.abs((genes[g] || 0.5) - (parentGenes[g] || 0.5));
        if (drift > maxDrift) { maxDrift = drift; maxGene = g; }
      }
    } else {
      let maxVal = 0;
      for (const g of GENE_KEYS) {
        if ((genes[g] || 0) > maxVal) { maxVal = genes[g]; maxGene = g; }
      }
    }
    const pool = GENE_NAME_POOLS[maxGene];
    adj = pool[(Math.random() * pool.length) | 0];
  }
  let name = adj + ' ' + rootName;
  if (existingNames.has(name)) {
    let suffix = 2;
    while (existingNames.has(name + ' ' + suffix)) suffix++;
    name = name + ' ' + suffix;
  }
  return name;
}

// Build predator→prey map: which species eat which
function buildFoodWeb() {
  const predators = {};  // prey_id → [predator_ids]
  const preyOf    = {};  // predator_id → [prey_ids]
  for (const id of LIVING_IDS) {
    const e = evo(id);
    if (e.eats && e.eats.length) {
      preyOf[id] = e.eats.slice();
      for (const prey of e.eats) {
        if (!predators[prey]) predators[prey] = [];
        predators[prey].push(id);
      }
    }
  }
  return { predators, preyOf };
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function evolve() {
  if (popHistory.length < 3) return;

  const now = popHistory[popHistory.length - 1];
  const prev = popHistory[popHistory.length - 3];
  const { predators, preyOf } = buildFoodWeb();

  let totalPop = 0, livingCount = 0;
  for (const id of LIVING_IDS) {
    const c = now[id] || 0;
    if (c > 0) { totalPop += c; livingCount++; }
  }
  const avgPop = livingCount > 0 ? totalPop / livingCount : 1;

  // Phase 1: Gene mutation + selection + trait expression
  for (const id of LIVING_IDS) {
    const sp = SPECIES[id];
    const es = evoStats[id];
    const popNow = now[id] || 0;
    const popPrev = prev[id] || 0;
    if (popNow === 0 && popPrev === 0) continue;
    if (!es.genes) continue;

    const trend = popPrev > 0 ? (popNow - popPrev) / popPrev : 0;
    const genes = es.genes;
    const gv = es.geneVar;

    // Random mutation: gaussian shift per gene, scaled by genetic variance
    const radMul = radiationBoost > 0 ? 2.0 : 1.0;
    for (const g of GENE_KEYS) {
      const sd = GENE_MUTATION_SD * (0.5 + gv[g] * 3) * radMul;
      genes[g] = clamp(genes[g] + gaussRandom() * sd, 0, 1);
    }

    // Selection nudge: light directional pressure from environment
    if (predators[id] && predators[id].length > 0) {
      let predPop = 0;
      for (const pid of predators[id]) predPop += (now[pid] || 0);
      const pressure = popNow > 0 ? predPop / popNow : 0;
      if (pressure > PRESSURE_HIGH || trend < -0.15) {
        genes.s = clamp(genes.s + 0.008 * (0.5 + Math.random()), 0, 1);
        genes.a = clamp(genes.a + 0.006 * (0.5 + Math.random()), 0, 1);
        if (trend < -0.25) genes.v = clamp(genes.v + 0.006, 0, 1);
      }
    }
    if (preyOf[id] && preyOf[id].length > 0) {
      let totalPreyPop = 0;
      for (const prey of preyOf[id]) totalPreyPop += (now[prey] || 0);
      if (totalPreyPop < popNow * 0.5 && popNow > 2) {
        genes.p = clamp(genes.p + 0.008 * (0.5 + Math.random()), 0, 1);
        genes.s = clamp(genes.s + 0.004, 0, 1);
        genes.f = clamp(genes.f + 0.004, 0, 1);
      }
    }
    if (sp.tier === 'producer' && popNow > 0) {
      let grazerPop = 0;
      if (predators[id]) {
        for (const pid of predators[id]) grazerPop += (now[pid] || 0);
      }
      if (trend < -0.2 || (popNow > 0 && grazerPop / popNow > 0.8)) {
        genes.v = clamp(genes.v + 0.01, 0, 1);
        genes.a = clamp(genes.a + 0.004, 0, 1);
      }
    }

    // Stabilising selection: only pull back extreme gene values
    for (const g of GENE_KEYS) {
      if (genes[g] > 0.85) genes[g] -= (genes[g] - 0.85) * 0.06;
      else if (genes[g] < 0.15) genes[g] += (0.15 - genes[g]) * 0.06;
    }

    // Gene variance: larger populations generate more variation (population genetics)
    const popRatio = popNow / Math.max(1, avgPop);
    for (const g of GENE_KEYS) {
      if (popRatio > 1.0 && popNow > 15) {
        const gain = 0.002 + 0.004 * Math.min(1, popNow / (avgPop * 3));
        gv[g] = Math.min(0.35, gv[g] + gain);
      } else if (popNow < 10) {
        gv[g] = Math.max(0.02, gv[g] - 0.008);
      }
    }

    deriveStats(id);
    expressTraits(id);
  }

  // Phase 1b: Competitive exclusion (character displacement)
  // Same-tier species sharing diet overlap have genes pushed apart
  for (let i = 0; i < LIVING_IDS.length; i++) {
    const idA = LIVING_IDS[i];
    const spA = SPECIES[idA];
    const esA = evoStats[idA];
    if (!esA.genes || !esA.eats || (now[idA] || 0) < 5) continue;
    for (let j = i + 1; j < LIVING_IDS.length; j++) {
      const idB = LIVING_IDS[j];
      const spB = SPECIES[idB];
      const esB = evoStats[idB];
      if (!esB.genes || !esB.eats || (now[idB] || 0) < 5) continue;
      if (spA.tier !== spB.tier) continue;
      const shared = esA.eats.filter(e => esB.eats.indexOf(e) !== -1).length;
      const minLen = Math.min(esA.eats.length, esB.eats.length);
      if (minLen === 0 || shared / minLen < 0.5) continue;
      let maxDiffGene = GENE_KEYS[0], maxDiff = 0;
      for (const g of GENE_KEYS) {
        const d = Math.abs(esA.genes[g] - esB.genes[g]);
        if (d > maxDiff) { maxDiff = d; maxDiffGene = g; }
      }
      const nudge = 0.012;
      if (esA.genes[maxDiffGene] > esB.genes[maxDiffGene]) {
        esA.genes[maxDiffGene] = clamp(esA.genes[maxDiffGene] + nudge, 0, 1);
        esB.genes[maxDiffGene] = clamp(esB.genes[maxDiffGene] - nudge, 0, 1);
      } else {
        esA.genes[maxDiffGene] = clamp(esA.genes[maxDiffGene] - nudge, 0, 1);
        esB.genes[maxDiffGene] = clamp(esB.genes[maxDiffGene] + nudge, 0, 1);
      }
    }
  }

  if (radiationBoost > 0) radiationBoost--;

  // Phase 2: Overpopulation predation
  for (const id of LIVING_IDS) {
    const popNow = now[id] || 0;
    if (popNow < avgPop * OVERPOP_THRESHOLD) continue;
    const sp = SPECIES[id];
    const tierRank = { producer: 0, herbivore: 1, consumer: 2, apex: 3, megafauna: 4, decomposer: 1 };
    const myRank = tierRank[sp.tier] ?? -1;
    const candidates = [];
    for (const cid of LIVING_IDS) {
      if (cid === id) continue;
      const csp = SPECIES[cid];
      const cRank = tierRank[csp.tier] ?? -1;
      if (cRank <= myRank || !csp.hungerMax) continue;
      const ces = evoStats[cid];
      if (ces.eats.indexOf(id) !== -1) continue;
      candidates.push(cid);
    }
    if (candidates.length > 0 && Math.random() < 0.25) {
      const winner = candidates[(Math.random() * candidates.length) | 0];
      evoStats[winner].eats.push(id);
      addEvoEvent(SPECIES[winner].name + ' adapted to eat ' + sp.name + '!');
    }
  }

  // Phase 3: Self-predation among lineage relatives
  for (const id of LIVING_IDS) {
    const sp = SPECIES[id];
    const es = evoStats[id];
    if (!sp.hungerMax || !sp.parentId) continue;
    const popNow = now[id] || 0;
    if (popNow < 10) continue;
    if (Math.random() > SELF_PREDATION_CHANCE) continue;
    const rootId = sp.rootAncestor || id;
    const relatives = LIVING_IDS.filter(rid => {
      if (rid === id) return false;
      const rsp = SPECIES[rid];
      if (!rsp) return false;
      const rRoot = rsp.rootAncestor || rid;
      return (rRoot === rootId || rid === rootId) && es.eats.indexOf(rid) === -1;
    });
    if (relatives.length === 0) continue;
    const tierRank = { producer: 0, herbivore: 1, consumer: 2, apex: 3, megafauna: 4, decomposer: 1 };
    const myRank = tierRank[sp.tier] ?? 1;
    const scored = relatives.map(rid => {
      const rsp = SPECIES[rid];
      const rRank = tierRank[rsp.tier] ?? 1;
      const rPop = now[rid] || 0;
      let score = 1;
      if (rRank < myRank) score += 2;
      if (rRank === myRank) score += 0.5;
      if (rPop > avgPop) score += 1.5;
      return { id: rid, score };
    });
    const totalS = scored.reduce((a, s) => a + s.score, 0);
    let r = Math.random() * totalS;
    let target = scored[scored.length - 1].id;
    for (const s of scored) {
      r -= s.score;
      if (r <= 0) { target = s.id; break; }
    }
    es.eats.push(target);
    addEvoEvent(sp.name + ' now preys on ' + SPECIES[target].name + ' (lineage rivalry)!');
  }
}

// --- SPECIATION: fork via gene divergence ---
function speciate() {
  if (dynamicSpeciesIds.length >= MAX_DYNAMIC_SPECIES) return;
  if (nextSpeciesId > 254) return;
  if (popHistory.length < 3) return;

  const now = popHistory[popHistory.length - 1];
  const total = gridW * gridH;

  for (const id of LIVING_IDS) {
    if (dynamicSpeciesIds.length >= MAX_DYNAMIC_SPECIES || nextSpeciesId > 254) break;
    const popNow = now[id] || 0;
    const sp = SPECIES[id];
    if (!sp.breedRate) continue;
    const depth = sp.lineageDepth || 0;
    const minPop = Math.max(25, SPECIATION_MIN_POP - depth * 15);
    if (popNow < minPop) continue;

    const es = evoStats[id];
    if (!es.genes || !es.baseGenes) continue;

    const divergence = geneDivergence(es.genes, es.baseGenes);
    const radDiv = radiationBoost > 0 ? 0.5 : 1.0;
    const driftThreshold = 0.15 * Math.max(0.4, 1 - depth * 0.15) * radDiv;
    if (divergence < driftThreshold) continue;

    const speciationChance = Math.min(0.6, SPECIATION_CHANCE + depth * 0.05);
    if (Math.random() > speciationChance) continue;

    const newId = nextSpeciesId++;
    const rootId = sp.rootAncestor || id;

    const vigour = 1.05 + Math.random() * 0.1;
    const newGenes = {};
    const newGeneVar = {};
    for (const g of GENE_KEYS) {
      newGenes[g] = clamp(es.genes[g] + gaussRandom() * 0.04, 0, 1);
      newGeneVar[g] = Math.max(0.04, (es.geneVar[g] || 0.14) * 0.85);
    }

    const newName = generateSpeciesName(id, newGenes, 'speciation');

    const baseRGB = COLOR_RGB[id];
    const shift = () => Math.round((Math.random() - 0.5) * 70);
    const nr = clamp(baseRGB[0] + shift(), 20, 255);
    const ng = clamp(baseRGB[1] + shift(), 20, 255);
    const nb = clamp(baseRGB[2] + shift(), 20, 255);
    const newHex = '#' + ((1 << 24) + (nr << 16) + (ng << 8) + nb).toString(16).slice(1).toUpperCase();

    const tmpBR = sp.breedRate * (0.5 + newGenes.v) * vigour;
    const tmpMR = sp.moveRate ? clamp(sp.moveRate * (0.5 + newGenes.s) * vigour, 0.02, 0.98) : 0;
    const tmpHM = sp.hungerMax ? clamp(Math.round(sp.hungerMax * (0.5 + newGenes.f) * vigour), 6, 80) : 0;

    const newEats = es.eats.slice();
    if (newEats.length > 1 && Math.random() < 0.15) {
      newEats.splice((Math.random() * newEats.length) | 0, 1);
    }
    if (sp.hungerMax && newEats.indexOf(id) === -1 && Math.random() < 0.35) {
      newEats.push(id);
    }

    SPECIES[newId] = {
      name: newName, color: newHex, tier: sp.tier, layer: sp.layer,
      breedRate: sp.breedRate, moveRate: sp.moveRate || undefined,
      hungerMax: sp.hungerMax || undefined, eats: newEats.length ? newEats : undefined,
      desc: 'Evolved from ' + sp.name + ' at gen ' + generation,
      parentId: id, rootAncestor: rootId,
      lineageDepth: depth + 1,
    };
    COLOR_RGB[newId] = [nr, ng, nb];
    LIVING_IDS.push(newId);
    dynamicSpeciesIds.push(newId);
    evoStats[newId] = {
      breedRate: tmpBR, moveRate: tmpMR, hungerMax: tmpHM,
      eats: newEats.slice(), traits: [], traitStrengths: {},
      genes: newGenes, geneVar: newGeneVar, baseGenes: { ...newGenes },
    };
    expressTraits(newId);

    addToTierGroup(newId, sp.tier);

    for (const oid of LIVING_IDS) {
      if (oid === newId) continue;
      const oe = evoStats[oid];
      if (oe && oe.eats && oe.eats.indexOf(id) !== -1 && oe.eats.indexOf(newId) === -1) {
        oe.eats.push(newId);
      }
    }

    const convertTarget = (popNow * SPECIATION_CONVERT) | 0;
    let converted = 0;
    const parentCells = [];
    for (let i = 0; i < total; i++) { if (species[i] === id) parentCells.push(i); }
    for (let i = parentCells.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const tmp = parentCells[i]; parentCells[i] = parentCells[j]; parentCells[j] = tmp;
    }
    for (let i = 0; i < parentCells.length && converted < convertTarget; i++) {
      species[parentCells[i]] = newId;
      converted++;
    }

    addEvoEvent(newName + ' diverged from ' + sp.name + '!');
  }
}

// --- NICHE SHIFT: animals can change ecological tier under sustained pressure ---
// Also supports convergent evolution: unrelated species fill empty niches
function nicheShift() {
  if (dynamicSpeciesIds.length >= MAX_DYNAMIC_SPECIES || nextSpeciesId > 254) return;
  if (popHistory.length < 3) return;

  const now = popHistory[popHistory.length - 1];
  const prev = popHistory[popHistory.length - 3];
  const { predators, preyOf } = buildFoodWeb();
  const total = gridW * gridH;

  // Calculate per-tier population for empty niche detection
  const tierPop = {};
  let totalLiving = 0;
  for (const tid of LIVING_IDS) {
    const tsp = SPECIES[tid];
    if (!tsp) continue;
    const cnt = now[tid] || 0;
    tierPop[tsp.tier] = (tierPop[tsp.tier] || 0) + cnt;
    totalLiving += cnt;
  }

  for (const id of LIVING_IDS) {
    if (dynamicSpeciesIds.length >= MAX_DYNAMIC_SPECIES || nextSpeciesId > 254) break;
    const sp = SPECIES[id];
    if (sp.tier === 'megafauna') continue;
    if (sp.tier === 'producer' && !sp.breedRate) continue;

    const es = evoStats[id];
    const popNow = now[id] || 0;
    if (!es.genes || !es.baseGenes) continue;
    const depth = sp.lineageDepth || 0;
    const divergence = geneDivergence(es.genes, es.baseGenes);

    // Find target tier: standard promotion first, then scan for empty niches
    let newTier = TIER_PROMOTE[sp.tier] || null;
    let targetEmpty = false;

    // Check if standard target is empty
    if (newTier && totalLiving > 50) {
      const tp = tierPop[newTier] || 0;
      if (tp < totalLiving * EMPTY_NICHE_THRESHOLD) targetEmpty = true;
    }

    // If standard target isn't empty, scan extended paths for empty niches
    if (!targetEmpty) {
      const extended = TIER_PROMOTE_EXTENDED[sp.tier] || [];
      let emptiest = null, emptiestPop = Infinity;
      for (const ct of extended) {
        const cp = tierPop[ct] || 0;
        if (totalLiving > 50 && cp < totalLiving * EMPTY_NICHE_THRESHOLD && cp < emptiestPop) {
          emptiest = ct;
          emptiestPop = cp;
        }
      }
      if (emptiest) {
        newTier = emptiest;
        targetEmpty = true;
      }
    }

    if (!newTier) continue;

    // Gate checks: relaxed when target niche is empty (convergent evolution)
    if (targetEmpty) {
      if (popNow < 15) continue;
      if (divergence < EMPTY_NICHE_MIN_DRIFT) continue;
      if (Math.random() > EMPTY_NICHE_SHIFT_BOOST) continue;
    } else {
      if (!sp.hungerMax) continue;
      if (sp.tier === 'producer') continue;
      if (depth < NICHE_SHIFT_MIN_DEPTH) continue;
      if (popNow < 30) continue;
      if (divergence < NICHE_SHIFT_MIN_DRIFT * 0.4) continue;
      if (Math.random() > NICHE_SHIFT_CHANCE) continue;

      let underPressure = false;
      if (predators[id]) {
        let predPop = 0;
        for (const pid of predators[id]) predPop += (now[pid] || 0);
        if (popNow > 0 && predPop / popNow > PRESSURE_HIGH * 0.7) underPressure = true;
      }
      if (preyOf[id] && preyOf[id].length > 0) {
        let preyPop = 0;
        for (const prey of preyOf[id]) preyPop += (now[prey] || 0);
        if (popNow > 0 && preyPop < popNow * 0.8) underPressure = true;
      }
      const popPrev = prev[id] || 0;
      const trend = popPrev > 0 ? (popNow - popPrev) / popPrev : 0;
      if (trend < -0.15) underPressure = true;
      if (!underPressure) continue;
    }

    const newId = nextSpeciesId++;
    const rootId = sp.rootAncestor || id;
    const newName = generateSpeciesName(id, es.genes, 'niche', newTier);

    const baseRGB = COLOR_RGB[id];
    const shiftC = () => Math.round((Math.random() - 0.5) * 100);
    const nr = clamp(baseRGB[0] + shiftC(), 20, 255);
    const ng = clamp(baseRGB[1] + shiftC(), 20, 255);
    const nb = clamp(baseRGB[2] + shiftC(), 20, 255);
    const newHex = '#' + ((1 << 24) + (nr << 16) + (ng << 8) + nb).toString(16).slice(1).toUpperCase();

    const newGenes = {};
    const newGeneVar = {};
    for (const g of GENE_KEYS) {
      newGenes[g] = es.genes[g];
      newGeneVar[g] = Math.max(0.04, (es.geneVar[g] || 0.14) * 0.85);
    }

    let newEats = [];
    if (newTier === 'herbivore') {
      if (sp.tier === 'producer') {
        newGenes.s = clamp(newGenes.s + 0.25, 0, 1);
        newGenes.v = clamp(newGenes.v * 0.6, 0, 1);
        newGenes.p = clamp(newGenes.p + 0.15, 0, 1);
      } else {
        newGenes.s = clamp(newGenes.s * 1.1, 0, 1);
        newGenes.p = clamp(newGenes.p * 0.5, 0, 1);
      }
      const targets = LIVING_IDS.filter(pid => { const psp = SPECIES[pid]; return psp && psp.tier === 'producer'; });
      const sh = targets.slice(); for (let i = sh.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
      for (let i = 0; i < Math.min(sh.length, 1 + ((Math.random() * 2) | 0)); i++) newEats.push(sh[i]);
    } else if (newTier === 'consumer') {
      newGenes.s = clamp(newGenes.s * 1.3, 0, 1);
      newGenes.v = clamp(newGenes.v * 0.7, 0, 1);
      newGenes.p = clamp(newGenes.p + 0.2, 0, 1);
      const targets = LIVING_IDS.filter(hid => { const hsp = SPECIES[hid]; return hsp && hsp.tier === 'herbivore' && hid !== id; });
      const sh = targets.slice(); for (let i = sh.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
      for (let i = 0; i < Math.min(sh.length, 1 + ((Math.random() * 2) | 0)); i++) newEats.push(sh[i]);
    } else if (newTier === 'apex') {
      newGenes.s = clamp(newGenes.s * 1.2, 0, 1);
      newGenes.v = clamp(newGenes.v * 0.5, 0, 1);
      newGenes.p = clamp(newGenes.p + 0.15, 0, 1);
      newGenes.f = clamp(newGenes.f * 1.2, 0, 1);
      const targets = LIVING_IDS.filter(cid => { const csp = SPECIES[cid]; return csp && (csp.tier === 'consumer' || csp.tier === 'herbivore') && cid !== id; });
      const sh = targets.slice(); for (let i = sh.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
      for (let i = 0; i < Math.min(sh.length, 1 + ((Math.random() * 3) | 0)); i++) newEats.push(sh[i]);
    } else if (newTier === 'megafauna') {
      newGenes.s = clamp(newGenes.s * 0.7, 0, 1);
      newGenes.v = clamp(newGenes.v * 0.4, 0, 1);
      newGenes.f = clamp(newGenes.f + 0.2, 0, 1);
      newGenes.p = clamp(newGenes.p + 0.1, 0, 1);
      const targets = LIVING_IDS.filter(pid => { const psp = SPECIES[pid]; return psp && (psp.tier === 'consumer' || psp.tier === 'herbivore') && pid !== id; });
      const sh = targets.slice(); for (let i = sh.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
      for (let i = 0; i < Math.min(sh.length, 2 + ((Math.random() * 3) | 0)); i++) newEats.push(sh[i]);
    }

    const tmpBR = (sp.breedRate || 0.04) * (0.5 + newGenes.v);
    const tmpMR = clamp((sp.moveRate || 0.35) * (0.5 + newGenes.s), 0.02, 0.98);
    const tmpHM = clamp(Math.round((sp.hungerMax || 20) * (0.5 + newGenes.f)), 6, 80);

    const tierLayerMap = { herbivore: 1, consumer: 2, apex: 3, megafauna: 3 };
    const newLayer = tierLayerMap[newTier] !== undefined ? tierLayerMap[newTier] : sp.layer;
    SPECIES[newId] = {
      name: newName, color: newHex, tier: newTier, layer: newLayer,
      breedRate: sp.breedRate || 0.04, moveRate: sp.moveRate || 0.35,
      hungerMax: sp.hungerMax || 20, eats: newEats.length ? newEats : undefined,
      desc: sp.name + ' shifted to ' + newTier + ' niche (gen ' + generation + ')',
      parentId: id, rootAncestor: rootId,
      lineageDepth: (sp.lineageDepth || 0) + 1,
    };
    COLOR_RGB[newId] = [nr, ng, nb];
    LIVING_IDS.push(newId);
    dynamicSpeciesIds.push(newId);
    evoStats[newId] = {
      breedRate: tmpBR, moveRate: tmpMR, hungerMax: tmpHM,
      eats: newEats.slice(), traits: [], traitStrengths: {},
      genes: newGenes, geneVar: newGeneVar, baseGenes: { ...newGenes },
    };
    expressTraits(newId);

    addToTierGroup(newId, newTier);

    const convertTarget = (popNow * 0.25) | 0;
    const parentCells = [];
    for (let i = 0; i < total; i++) { if (species[i] === id) parentCells.push(i); }
    for (let i = parentCells.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const tmp = parentCells[i]; parentCells[i] = parentCells[j]; parentCells[j] = tmp;
    }
    let converted = 0;
    for (let i = 0; i < parentCells.length && converted < convertTarget; i++) {
      species[parentCells[i]] = newId;
      converted++;
    }

    if (targetEmpty) {
      addEvoEvent(newName + ' filled empty ' + newTier + ' niche (convergent evolution)!');
    } else {
      addEvoEvent(newName + ' shifted niche: ' + sp.tier + ' → ' + newTier + '!');
    }
  }
}

// ============================================================
// 2. GRID STATE
// ============================================================
let gridW, gridH; // in cells
let species, hunger, age; // typed arrays (flat: y * gridW + x)
let currents; // overlay layer: 1 = current present
let canvasW, canvasH; // in pixels

let cellNoise;  // precomputed per-cell noise for visual variation
let cellNoise2; // second noise channel for independent variation

function allocGrid(cw, ch) {
  gridW = cw; gridH = ch;
  canvasW = cw * CELL_SIZE; canvasH = ch * CELL_SIZE;
  const total = cw * ch;
  species  = new Uint8Array(total);
  hunger   = new Int16Array(total);
  age      = new Uint16Array(total);
  currents = new Uint8Array(total);
  cellNoise  = new Float32Array(total);
  cellNoise2 = new Float32Array(total);
  for (let cy = 0; cy < ch; cy++) {
    for (let cx = 0; cx < cw; cx++) {
      const i = cy * cw + cx;
      cellNoise[i]  = noise2D(cx * 0.35, cy * 0.35);
      cellNoise2[i] = noise2D(cx * 0.6 + 50, cy * 0.6 + 50);
    }
  }
}

function clearGrid() {
  species.fill(0);
  hunger.fill(0);
  age.fill(0);
  currents.fill(0);
  generation = 0;
  currentSeason = 'Spring';
  seasonTick = 0;
  graphHistory = [];
  activeVents.length = 0;
  for (const k in _creatureCache) delete _creatureCache[k];
  initEvoStats();
}

function cellIdx(x, y) {
  return y * gridW + x;
}

function wrapX(x) { return ((x % gridW) + gridW) % gridW; }
function wrapY(y) { return ((y % gridH) + gridH) % gridH; }

// ============================================================
// 3. RENDER
// ============================================================
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let imgData, imgPixels;
let highlightSpecies = -1; // -1 = no highlight, otherwise species ID to highlight

// Death particle system
const MAX_PARTICLES = 300;
const particles = [];
function spawnDeathParticles(idx, sid) {
  if (particles.length >= MAX_PARTICLES) return;
  const cw = gridW;
  const cx = (idx % cw) * CELL_SIZE + 3;
  const cy = ((idx / cw) | 0) * CELL_SIZE + 3;
  const rgb = COLOR_RGB[sid];
  if (!rgb) return;
  const count = 3 + ((Math.random() * 3) | 0);
  for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.4 + Math.random() * 1.2;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: rgb[0], g: rgb[1], b: rgb[2],
      life: 8 + ((Math.random() * 8) | 0)
    });
  }
}

function tickParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.life--;
    if (p.life <= 0) { particles.splice(i, 1); }
  }
}

function drawParticles() {
  if (particles.length === 0) return;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const alpha = Math.min(1, p.life / 6);
    ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha.toFixed(2) + ')';
    ctx.fillRect(p.x | 0, p.y | 0, 2, 2);
  }
}

function initCanvas() {
  canvas.width = canvasW;
  canvas.height = canvasH;
  imgData = ctx.createImageData(canvasW, canvasH);
  imgPixels = imgData.data;
}

function render() {
  const cw = gridW, ch = gridH, cs = CELL_SIZE, gap = GRID_GAP;
  const pw = canvasW, ph = canvasH;
  const data = imgPixels;
  const bgBase = COLOR_RGB[0];
  const innerSize = cs - gap;
  const gen = generation;
  const hlSid = highlightSpecies;
  const lastInner = innerSize - 1;

  // --- Pass 1: depth-gradient background ---
  for (let py = 0; py < ph; py++) {
    const dt = py / ph;
    const bgR = Math.max(0, (bgBase[0] + 8 * (1 - dt)) | 0);
    const bgG = Math.max(0, (bgBase[1] + 14 * (1 - dt)) | 0);
    const bgB = Math.max(0, (bgBase[2] + 20 * (1 - dt) - 4 * dt) | 0);
    const rowOff = py * pw * 4;
    for (let px = 0; px < pw; px++) {
      const off = rowOff + px * 4;
      data[off] = bgR; data[off+1] = bgG; data[off+2] = bgB; data[off+3] = 255;
    }
  }

  // --- Pass 2: water caustic on empty cells ---
  for (let cy = 0; cy < ch; cy++) {
    for (let cx = 0; cx < cw; cx++) {
      const idx = cy * cw + cx;
      if (species[idx] !== 0) continue;
      const nv = cellNoise[idx];
      if (nv < 0.15) continue;
      const bright = ((nv - 0.15) * 12) | 0;
      if (bright <= 0) continue;
      const px0 = cx * cs, py0 = cy * cs;
      const cx2 = ((cellNoise2[idx] + 1) * 3.5) | 0;
      const cy2 = ((cellNoise[idx]) * 3.5) | 0;
      const cpx = px0 + Math.min(cx2, lastInner);
      const cpy = py0 + Math.min(Math.abs(cy2), lastInner);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const ppx = cpx + dx, ppy = cpy + dy;
          if (ppx >= px0 && ppx < px0 + innerSize && ppy >= py0 && ppy < py0 + innerSize) {
            const off = (ppy * pw + ppx) * 4;
            const falloff = (dx === 0 && dy === 0) ? 1.0 : 0.5;
            const b = (bright * falloff) | 0;
            data[off] += b; data[off+1] += (b * 1.2) | 0; data[off+2] += (b * 1.5) | 0;
          }
        }
      }
    }
  }

  // --- Pass 3: cell rendering with noise, bevel, and effects ---
  for (let cy = 0; cy < ch; cy++) {
    const depthDim = 1.0 - (cy / ch) * 0.12;

    for (let cx = 0; cx < cw; cx++) {
      const idx = cy * cw + cx;
      const sid = species[idx];
      if (sid === 0) continue;

      const rgb = COLOR_RGB[sid];
      let baseR = rgb[0], baseG = rgb[1], baseB = rgb[2];

      const nv = cellNoise[idx];
      const nv2 = cellNoise2[idx];
      const sp = SPECIES[sid];

      // Hunger dimming for animals
      let hungerF = 1.0;
      if (sp && sp.hungerMax) {
        hungerF = Math.max(0.35, 1 - hunger[idx] / evo(sid).hungerMax);
      }

      // Noise colour variation: per-cell subtle shift
      let noiseShift = nv * 0.10;

      // Species-specific rendering adjustments
      let glowR = 0, glowG = 0, glowB = 0;
      let bevelStrength = 16;
      let isLava = false, isIce = false, isToxic = false;

      if (sid === 1) {
        // Rock: heavier noise for natural stone appearance
        noiseShift = nv * 0.18;
        const stoneHue = nv2 * 8;
        baseR += stoneHue | 0;
        baseG += (stoneHue * 0.7) | 0;
        bevelStrength = 22;
      } else if (sid === 7) {
        // Lava: pulsing glow, warm centre
        isLava = true;
        const lavaAge = age[idx];
        const pulse = 0.8 + 0.2 * Math.sin(lavaAge * 0.25 + nv * 3);
        noiseShift = nv * 0.08;
        baseR = Math.min(255, (baseR * pulse + 40 * (1 - lavaAge / LAVA_COOL_AGE)) | 0);
        baseG = Math.min(255, (baseG * pulse + 25 * Math.max(0, 1 - lavaAge / 20)) | 0);
        glowR = 60; glowG = 15;
        bevelStrength = 10;
      } else if (sid === 5) {
        // Ice: crystalline shimmer
        isIce = true;
        const shimmer = 0.92 + 0.08 * Math.sin(cx * 1.5 + cy * 0.9 + gen * 0.15);
        baseR = (baseR * shimmer) | 0;
        baseG = (baseG * shimmer) | 0;
        baseB = (baseB * shimmer) | 0;
        noiseShift = nv2 * 0.06;
        bevelStrength = 24;
      } else if (sid === 6) {
        // Toxic Bloom: eerie pulsing glow
        isToxic = true;
        const tPulse = 0.88 + 0.12 * Math.sin(gen * 0.2 + nv * 5);
        baseG = Math.min(255, (baseG * tPulse) | 0);
        glowG = 30;
        bevelStrength = 12;
      } else if (sid === 3) {
        // Dead: muted, low variation
        noiseShift = nv * 0.05;
        bevelStrength = 8;
      } else if (sid === 4) {
        // Oil: dark with subtle iridescence
        const iriShift = (nv2 * 6) | 0;
        baseR += iriShift;
        baseB += (iriShift * 0.8) | 0;
        bevelStrength = 6;
      } else if (sp && sp.tier === 'producer') {
        // Producers: organic variation
        noiseShift = nv * 0.14;
        const organicWave = Math.sin(cx * 0.8 + cy * 0.5) * 4;
        baseG = Math.min(255, Math.max(0, baseG + organicWave));
      }

      // Trait-based visual flair
      if (sp && sp.tier !== 'environment' && sp.tier !== 'transient') {
        const traits = evo(sid).traits;
        if (traits && traits.length > 0) {
          for (let ti = 0; ti < traits.length; ti++) {
            const tr = traits[ti];
            if (tr === 'bioluminesc') {
              glowR += 15; glowG += 20; glowB += 30;
            } else if (tr === 'toxic') {
              baseG = Math.min(255, baseG + 12);
            } else if (tr === 'armored' || tr === 'shell') {
              bevelStrength += 8;
            }
          }
        }
      }

      // Apply combined factor
      let factor = hungerF * depthDim * (1 + noiseShift);
      let r = Math.min(255, Math.max(0, (baseR * factor) | 0));
      let g = Math.min(255, Math.max(0, (baseG * factor) | 0));
      let b = Math.min(255, Math.max(0, (baseB * factor) | 0));

      // Highlight dimming
      if (hlSid >= 0 && sid !== hlSid) {
        r = (r * 0.15) | 0; g = (g * 0.15) | 0; b = (b * 0.15) | 0;
      }

      // Fill inner cell with bevel effect
      const px0 = cx * cs, py0 = cy * cs;
      const hiR = Math.min(255, r + bevelStrength);
      const hiG = Math.min(255, g + bevelStrength);
      const hiB = Math.min(255, b + bevelStrength);
      const shR = Math.max(0, r - bevelStrength);
      const shG = Math.max(0, g - bevelStrength);
      const shB = Math.max(0, b - bevelStrength);

      for (let ly = 0; ly < innerSize; ly++) {
        const rowOff = (py0 + ly) * pw * 4;
        const isTop = ly === 0;
        const isBot = ly === lastInner;
        for (let lx = 0; lx < innerSize; lx++) {
          const off = rowOff + (px0 + lx) * 4;
          if (isTop || lx === 0) {
            data[off] = hiR; data[off+1] = hiG; data[off+2] = hiB;
          } else if (isBot || lx === lastInner) {
            data[off] = shR; data[off+1] = shG; data[off+2] = shB;
          } else {
            data[off] = r; data[off+1] = g; data[off+2] = b;
          }
        }
      }

      // Glow: bleed light into gap pixels for lava, toxic bloom, bioluminescent
      if (glowR | glowG | glowB) {
        if (gap > 0) {
          for (let ly = 0; ly < innerSize; ly++) {
            const gapOff = ((py0 + ly) * pw + px0 + innerSize) * 4;
            data[gapOff]   = Math.min(255, data[gapOff]   + glowR);
            data[gapOff+1] = Math.min(255, data[gapOff+1] + glowG);
            data[gapOff+2] = Math.min(255, data[gapOff+2] + glowB);
          }
          for (let lx = 0; lx <= innerSize; lx++) {
            const gapOff = ((py0 + innerSize) * pw + px0 + lx) * 4;
            data[gapOff]   = Math.min(255, data[gapOff]   + glowR);
            data[gapOff+1] = Math.min(255, data[gapOff+1] + glowG);
            data[gapOff+2] = Math.min(255, data[gapOff+2] + glowB);
          }
        }
      }

      // Lava: centre hot-spot (inner 3x3 brighter)
      if (isLava && age[idx] < 20) {
        const cStart = ((innerSize - 3) >> 1);
        const heat = Math.max(0, 1 - age[idx] / 20);
        const addR = (40 * heat) | 0, addG = (20 * heat) | 0;
        for (let ly = cStart; ly < cStart + 3; ly++) {
          const rowOff = (py0 + ly) * pw * 4;
          for (let lx = cStart; lx < cStart + 3; lx++) {
            const off = rowOff + (px0 + lx) * 4;
            data[off]   = Math.min(255, data[off]   + addR);
            data[off+1] = Math.min(255, data[off+1] + addG);
          }
        }
      }

      // Ice: bright centre pixel for sparkle
      if (isIce) {
        const sparkle = (Math.sin(cx * 2.7 + cy * 1.3 + gen * 0.3) > 0.6);
        if (sparkle) {
          const mid = innerSize >> 1;
          const off = ((py0 + mid) * pw + px0 + mid) * 4;
          data[off] = 255; data[off+1] = 255; data[off+2] = 255;
        }
      }
    }
  }

  // --- Pass 4: current overlay + arrows ---
  const curR = COLOR_RGB[2][0], curG = COLOR_RGB[2][1], curB = COLOR_RGB[2][2];
  const alpha = 0.25, inv = 1 - alpha;
  const arwR = 80, arwG = 160, arwB = 255;
  for (let cy = 0; cy < ch; cy++) {
    for (let cx = 0; cx < cw; cx++) {
      const idx = cy * cw + cx;
      const cdir = currents[idx];
      if (!cdir) continue;
      const px0 = cx * cs, py0 = cy * cs;
      for (let py = py0; py < py0 + innerSize; py++) {
        const rowOff = py * pw * 4;
        for (let px = px0; px < px0 + innerSize; px++) {
          const off = rowOff + px * 4;
          data[off]     = (data[off]     * inv + curR * alpha) | 0;
          data[off + 1] = (data[off + 1] * inv + curG * alpha) | 0;
          data[off + 2] = (data[off + 2] * inv + curB * alpha) | 0;
        }
      }
      const mid = (innerSize / 2) | 0;
      const mcx = px0 + mid, mcy = py0 + mid;
      let arrowPx;
      if (cdir === 1) arrowPx = [[0,-1],[0,0],[-1,0],[1,0],[0,1]];
      else if (cdir === 2) arrowPx = [[-1,0],[0,0],[0,-1],[0,1],[1,0]];
      else if (cdir === 3) arrowPx = [[0,1],[0,0],[-1,0],[1,0],[0,-1]];
      else arrowPx = [[1,0],[0,0],[0,-1],[0,1],[-1,0]];
      for (const [adx, ady] of arrowPx) {
        const apx = mcx + adx, apy = mcy + ady;
        if (apx >= px0 && apx < px0 + innerSize && apy >= py0 && apy < py0 + innerSize) {
          const off = (apy * pw + apx) * 4;
          data[off] = arwR; data[off+1] = arwG; data[off+2] = arwB;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

// ============================================================
// 4. SIMULATION ENGINE
// ============================================================
let generation = 0;
let running = false;
let tickInterval = 100;
let tickTimer = null;

// Fisher-Yates shuffle in-place, returns array
function shuffleSmall(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

// Pre-allocated shuffle buffers to avoid per-cell array allocations in step()
const _dirs4 = new Uint8Array([0, 1, 2, 3]);
const _dirs8 = new Uint8Array([0, 1, 2, 3, 4, 5, 6, 7]);
function shuffleDirs4() { shuffleSmall(_dirs4); return _dirs4; }
function shuffleDirs8() { shuffleSmall(_dirs8); return _dirs8; }

function step() {
  const total = gridW * gridH;
  const processed = new Uint8Array(total);

  // Advance season
  seasonTick++;
  if (seasonTick >= SEASON_LENGTH) {
    seasonTick = 0;
    const si = (SEASONS.indexOf(currentSeason) + 1) % 4;
    currentSeason = SEASONS[si];
  }
  const sMod = SEASON_MODS[currentSeason];

  // Build index list of non-empty cells using typed array (avoids JS array push overhead)
  const indices = new Uint32Array(total);
  let indexCount = 0;
  for (let i = 0; i < total; i++) {
    if (species[i] !== 0) indices[indexCount++] = i;
  }
  // Fisher-Yates shuffle on the populated portion
  for (let i = indexCount - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
  }

  const cw = gridW, ch = gridH;

  for (let k = 0; k < indexCount; k++) {
    const idx = indices[k];
    if (processed[idx]) continue;
    const sid = species[idx];
    if (sid === 0) continue; // empty
    processed[idx] = 1;

    const cx = idx % cw;
    const cy = (idx / cw) | 0;
    const sp = SPECIES[sid];

    // Rock: do nothing
    if (sid === 1) continue;

    // Current overlay is handled separately — no species ID 2 in grid

    // Dead cell: fossilize into rock if uneaten
    if (sid === 3) {
      age[idx]++;
      if (age[idx] >= DEAD_FOSSILIZE_AGE) {
        species[idx] = 1; hunger[idx] = 0; age[idx] = 0; // become rock
      }
      continue;
    }

    // Oil: spread, kill neighbours, decay
    if (sid === 4) {
      age[idx]++;
      if (age[idx] >= OIL_DECAY_AGE) {
        species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
        continue;
      }
      // Kill adjacent life and spread
      const dirs = shuffleDirs4();
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[dirs[d]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        const nSid = species[ni];
        if (nSid === 0 || nSid === 1 || nSid === 4) continue; // skip empty, rock, oil
        // Kill whatever is here
        if (Math.random() < OIL_SPREAD_RATE) {
          species[ni] = 4; hunger[ni] = 0; age[ni] = 0;
          processed[ni] = 1;
          break; // spread once per tick
        }
      }
      continue;
    }

    // Ice: thaw over time
    if (sid === 5) {
      age[idx]++;
      if (age[idx] >= ICE_THAW_AGE) {
        species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
      }
      continue;
    }

    // Toxic Bloom: spread, damage neighbours, decay
    if (sid === 6) {
      age[idx]++;
      if (age[idx] >= TOXIC_BLOOM_DECAY) {
        species[idx] = 0; hunger[idx] = 0; age[idx] = 0;
        continue;
      }
      const tdirs = shuffleDirs4();
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[tdirs[d]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        const nSid = species[ni];
        if (nSid === 0 || nSid === 1 || nSid === 5 || nSid === 6) continue;
        const nSp = SPECIES[nSid];
        if (!nSp) continue;
        // Toxic trait species are immune
        const nTraits = evoStats[nSid] ? evoStats[nSid].traits || [] : [];
        if (nTraits.indexOf('toxic') !== -1) continue;
        // Biofilm clusters resist
        if (nTraits.indexOf('biofilm') !== -1 && Math.random() < 0.35) continue;
        if (Math.random() < TOXIC_BLOOM_SPREAD) {
          if (nSp.hungerMax) {
            // Animals: take hunger damage, die if starving
            hunger[ni] += 8;
            if (hunger[ni] >= (evoStats[nSid] ? evoStats[nSid].hungerMax : nSp.hungerMax)) {
              species[ni] = 3; hunger[ni] = 0; age[ni] = 0;
            }
          } else {
            // Plants: replaced by toxic bloom
            species[ni] = 6; hunger[ni] = 0; age[ni] = 0;
            processed[ni] = 1;
          }
          break;
        }
      }
      continue;
    }

    // Lava: kill all adjacent life, flow outward, radiant heat, cool into rock
    if (sid === 7) {
      age[idx]++;
      if (age[idx] >= LAVA_COOL_AGE) {
        let adjLava = 0;
        for (let d = 0; d < 4; d++) {
          const dir = CARDINAL[d];
          const ni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
          if (species[ni] === 7 || species[ni] === 1) adjLava++;
        }
        species[idx] = adjLava >= 2 ? 1 : 0;
        hunger[idx] = 0; age[idx] = 0;
        continue;
      }
      const ldirs = shuffleDirs4();
      // Kill all adjacent life (animals AND plants)
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[ldirs[d]];
        const nx = wrapX(cx + dir[0]);
        const ny = wrapY(cy + dir[1]);
        const ni = ny * cw + nx;
        const nSid = species[ni];
        if (nSid <= 1 || nSid === 5 || nSid === 7 || nSid === 0) continue;
        const nSp = SPECIES[nSid];
        if (!nSp) continue;
        const nTraits = evoStats[nSid] ? evoStats[nSid].traits || [] : [];
        if (nTraits.indexOf('warmadapt') !== -1 && Math.random() < 0.5) continue;
        if (nTraits.indexOf('shell') !== -1 && Math.random() < 0.25) continue;
        spawnDeathParticles(ni, nSid);
        species[ni] = 3; hunger[ni] = 0; age[ni] = 0;
      }
      // Lava flow: fresh lava spreads aggressively, older lava barely moves
      const spreadChance = age[idx] < 6 ? 0.12 : age[idx] < LAVA_SPREAD_MAX_AGE ? 0.03 : 0;
      if (spreadChance > 0 && Math.random() < spreadChance) {
        let adjLava = 0;
        for (let d = 0; d < 4; d++) {
          const dir = CARDINAL[ldirs[d]];
          const ni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
          if (species[ni] === 7 || species[ni] === 1) adjLava++;
        }
        if (adjLava < 3) {
          // Bias flow away from nearest vent
          let bestD = -1, bestScore = -1;
          for (let d = 0; d < 4; d++) {
            const dir = CARDINAL[ldirs[d]];
            const nx = wrapX(cx + dir[0]);
            const ny = wrapY(cy + dir[1]);
            const ni = ny * cw + nx;
            const nSid = species[ni];
            if (nSid === 1 || nSid === 7) continue;
            let score = Math.random();
            for (let vi = 0; vi < activeVents.length; vi++) {
              const v = activeVents[vi];
              const dxV = nx - v.x, dyV = ny - v.y;
              score += Math.sqrt(dxV * dxV + dyV * dyV) * 0.02;
            }
            if (score > bestScore) { bestScore = score; bestD = d; }
          }
          if (bestD >= 0) {
            const dir = CARDINAL[ldirs[bestD]];
            const nx = wrapX(cx + dir[0]);
            const ny = wrapY(cy + dir[1]);
            const ni = ny * cw + nx;
            species[ni] = 7; hunger[ni] = 0; age[ni] = 0;
            processed[ni] = 1;
          }
        }
      }
      // Radiant heat: kill creatures within 2 cells
      if (age[idx] < 25 && Math.random() < 0.08) {
        for (let dy = -LAVA_HEAT_RADIUS; dy <= LAVA_HEAT_RADIUS; dy++) {
          for (let dx = -LAVA_HEAT_RADIUS; dx <= LAVA_HEAT_RADIUS; dx++) {
            if (dx === 0 && dy === 0) continue;
            if (Math.abs(dx) + Math.abs(dy) > LAVA_HEAT_RADIUS) continue;
            const hx = wrapX(cx + dx);
            const hy = wrapY(cy + dy);
            const hi = hy * cw + hx;
            const hSid = species[hi];
            if (hSid < 10) continue;
            const hSp = SPECIES[hSid];
            if (!hSp) continue;
            const hTraits = evoStats[hSid] ? evoStats[hSid].traits || [] : [];
            if (hTraits.indexOf('warmadapt') !== -1) continue;
            if (Math.random() < 0.35) {
              spawnDeathParticles(hi, hSid);
              species[hi] = 3; hunger[hi] = 0; age[hi] = 0;
            }
          }
        }
      }
      // Lava melts ice on contact
      for (let d = 0; d < 4; d++) {
        const dir = CARDINAL[ldirs[d]];
        const ni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
        if (species[ni] === 5) {
          species[ni] = 0; hunger[ni] = 0; age[ni] = 0;
        }
      }
      continue;
    }

    // Producer behaviour
    if (sp.tier === 'producer') {
      const pes = evo(sid);
      const pTraits = pes.traits ? new Set(pes.traits) : null;
      let breedChance = pes.breedRate * sMod[3]; // seasonal producer breed modifier
      // Warm/cold adaptation overrides seasonal penalty
      if (pTraits && pTraits.has('warmadapt') && (currentSeason === 'Summer' || currentSeason === 'Spring')) breedChance = pes.breedRate * 1.4;
      if (pTraits && pTraits.has('coldadapt') && (currentSeason === 'Winter' || currentSeason === 'Autumn')) breedChance = pes.breedRate * 1.0;

      // Coral grows faster near rock (reef affinity)
      let nearRock = false;
      if (sid === 12) {
        for (let n = 0; n < 4; n++) {
          const dir = CARDINAL[n];
          const ni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
          if (species[ni] === 1) { nearRock = true; break; }
        }
        if (nearRock) breedChance *= 3; // triple breed rate near rock
      }

      // Nitrogen Fix: breed 2x faster near dead matter
      if (pTraits && pTraits.has('nitrofix')) {
        for (let n = 0; n < 4; n++) {
          const dir = CARDINAL[n];
          const ni = wrapY(cy + dir[1]) * cw + wrapX(cx + dir[0]);
          if (species[ni] === 3) { breedChance *= 2; break; }
        }
      }

      // Allelopathy: inhibit other producer species within 2 tiles
      if (pTraits && pTraits.has('allelopathy') && Math.random() < 0.08) {
        for (let ady = -2; ady <= 2; ady++) {
          for (let adx = -2; adx <= 2; adx++) {
            if (adx === 0 && ady === 0) continue;
            const ani = wrapY(cy + ady) * cw + wrapX(cx + adx);
            const aSid = species[ani];
            if (aSid !== sid && aSid !== 0 && SPECIES[aSid] && SPECIES[aSid].tier === 'producer') {
              // 15% chance to kill rival producer
              if (Math.random() < 0.15) {
                species[ani] = 0; hunger[ani] = 0; age[ani] = 0;
                processed[ani] = 1;
              }
            }
          }
        }
      }

      // Nocturnal/diurnal for producers (via pes)
      if (pTraits && pTraits.has('nocturnal')) {
        if (currentSeason === 'Winter' || currentSeason === 'Autumn') breedChance *= 1.4;
        else breedChance *= 0.8;
      }
      if (pTraits && pTraits.has('diurnal')) {
        if (currentSeason === 'Summer' || currentSeason === 'Spring') breedChance *= 1.4;
        else breedChance *= 0.8;
      }

      if (Math.random() < breedChance) {
        // Spore Burst: can spread 2 tiles away
        const maxDist = (pTraits && pTraits.has('spore')) ? 2 : 1;
        const dirs = shuffleDirs4();
        let bred = false;
        for (let dist = 1; dist <= maxDist && !bred; dist++) {
          for (let d = 0; d < 4; d++) {
            const dir = CARDINAL[dirs[d]];
            const nx = wrapX(cx + dir[0] * dist);
            const ny = wrapY(cy + dir[1] * dist);
            const ni = ny * cw + nx;
            // Coral can grow on rock (colonizes reef substrate)
            if (species[ni] === 0 || (sid === 12 && species[ni] === 1)) {
              species[ni] = sid; hunger[ni] = 0; age[ni] = 0;
              processed[ni] = 1;
              bred = true;
              break;
            }
          }
        }
      }
      continue;
    }

    // Animal behaviour (herbivore, consumer, apex, megafauna, decomposer)
    if (!sp.hungerMax) continue;
    const es = evo(sid);
    const traits = es.traits || [];
    const traitSet = new Set(traits);
    const hasTrait = (t) => traitSet.has(t);
    const restoreFrac = HUNGER_RESTORE_BY_TIER[sp.tier] || HUNGER_RESTORE_FRACTION;

    // Seasonal adaptation check
    const isColdAdapt = hasTrait('coldadapt');
    const isWarmAdapt = hasTrait('warmadapt');
    const isMigratory = hasTrait('migratory');
    let seasonHungerMult = sMod[1];
    let seasonBreedMult = sMod[0];
    let seasonMoveMult = sMod[2];
    if (isColdAdapt && (currentSeason === 'Winter' || currentSeason === 'Autumn')) {
      seasonHungerMult = 1.0; seasonBreedMult = 1.0; seasonMoveMult = 1.0;
    }
    if (isWarmAdapt && (currentSeason === 'Summer' || currentSeason === 'Spring')) {
      seasonBreedMult = 1.4; seasonHungerMult = 0.85;
    }
    if (isMigratory) seasonMoveMult = Math.min(1.5, seasonMoveMult * 1.3);
    // Nocturnal: +40% in cold seasons, -20% in warm
    if (hasTrait('nocturnal')) {
      if (currentSeason === 'Winter' || currentSeason === 'Autumn') {
        seasonBreedMult *= 1.4; seasonMoveMult *= 1.4;
      } else {
        seasonBreedMult *= 0.8; seasonMoveMult *= 0.8;
      }
    }
    // Diurnal: +40% in warm seasons, -20% in cold
    if (hasTrait('diurnal')) {
      if (currentSeason === 'Summer' || currentSeason === 'Spring') {
